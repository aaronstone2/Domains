# Global trustworthy-sources registry for the corpus.
# Filtered per-leaf by (domain, subdomain). Add new entries here OR in a leaf-local sources.yaml.
#
# Tiers
#   T0 — primary live capture (e.g. DevBox process tree, daemon.json copy)
#   T1 — official vendor docs / kernel docs / man pages / specs
#   T2 — respected secondary (books, talks by recognized practitioners)
#   T3 — high-quality blogs / canonical StackOverflow answers
#
# license_note
#   redistribute-ok — CC, Apache, BSD, GPL, public domain; safe to ingest content into the corpus
#   reference-only  — proprietary docs (Docker, Devin docs); store URL/title/snippets only, cite, do not republish
#   unknown         — assume reference-only until verified
#
# parser
#   trafilatura  — generic HTML→MD via trafilatura (default)
#   manpage      — man7.org / freedesktop man pages (preserve SYNOPSIS/DESCRIPTION/DIAGNOSTICS sections)
#   github-md    — raw markdown file from a GitHub repo
#   mintlify     — Devin's Mintlify-rendered docs (uses /llms.txt for index)

