    notes: 'Volume- AND effort-matched within-participant unilateral cluster-set RCT in trained individuals: equated volume/RIR -> similar muscle thickness & lean mass for cluster vs traditional. Direct evidence preventing a cluster hypertrophy overclaim. CC-BY 4.0, PMC-OA. (Springer DOI s00421-025-05712-6 is the same article.)'
