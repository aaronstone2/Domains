[project]
name = "domains-ingest"
version = "0.1.0"
description = "Fetch / extract / load pipeline for the domains knowledge corpus"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "lxml>=5.3",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "tenacity>=9.0",
  "tqdm>=4.66",
  "trafilatura>=1.12",
]

[project.scripts]
ingest = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.uv]
package = true
