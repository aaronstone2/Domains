        - text: including allocator tracing and page fault flame graphs; and different techniques for
        - link "Off-CPU Flame Graphs" [ref=e600] [cursor=pointer]:
          - /url: FlameGraphs/offcpuflamegraphs.html
        - text: ", including block I/O flame graphs, wakeup flame graphs, off-wake flame graphs, and chain graphs."
