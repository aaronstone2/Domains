        - text: ), where I discussed performance, DTrace, and the ZFS storage appliance (2006-2010); and
        - link "dtrace.org/blogs/brendan" [ref=e754] [cursor=pointer]:
          - /url: http://dtrace.org/blogs/brendan
        - text: ", where I continued posting about cloud performance and DTrace (2010-2014). Posts from my prior personal blog at"
        - link "bdgregg.blogspot.com" [ref=e755] [cursor=pointer]:
