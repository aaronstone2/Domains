          - /url: /blog/2007-07-29/dtracing-off-cpu-time.html
        - text: ", where I used DTrace and my DTraceToolkit to analyze gnome-terminal startup latency (2007)."
      - listitem [ref=e713]:
        - text: Slides for the OSCON 2007 talk
        - 'link "Observability Matters: How DTrace Helped Twitter" [ref=e714] [cursor=pointer]':
          - /url: Slides/OSCON2007_Observability_DTrace_Twitter
        - text: by Adam Leventhal and myself. At the time, Twitter was a one-year old startup running on Solaris with crippling performance issues, and Sun's top engineering team (including Adam and myself) visited the SF headquarters to help. This findings by the team (
        - link "slides" [ref=e715] [cursor=pointer]:
          - /url: Slides/OSCON2007_Observability_DTrace_Twitter
        - text: ","
        - link "PDF" [ref=e716] [cursor=pointer]:
          - /url: Slides/OSCON2007_Observability_DTrace_Twitter.pdf
        - text: ) (2007).
