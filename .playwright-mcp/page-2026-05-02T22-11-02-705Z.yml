        - text: A post on
        - link "AMD64 PICs, CPI" [ref=e718] [cursor=pointer]:
          - /url: /blog/2007-02-27/amd64-pics.html
        - text: ", where I used Solaris cpustat and PICs (aka PMCs) to measure cycles per instruction, and summarized tuning strategies for low or high CPI (2007)."
