        - text: .
      - listitem [ref=e1143]:
        - link "FreqCount" [ref=e1144] [cursor=pointer]:
          - /url: Perl/freqcount
        - text: is a simple frequency counter. Useful for processing logs (most common IP addr, port, etc..).
        - link "example" [ref=e1145] [cursor=pointer]:
          - /url: Perl/freqcount_example.txt
        - text: .
      - listitem [ref=e1146]:
        - link "PortPing" [ref=e1147] [cursor=pointer]:
          - /url: Perl/portping
        - text: is a version of ping that connects using ssh (or other ports), not ICMP. Good for checking firewalls.
        - link "example" [ref=e1148] [cursor=pointer]:
          - /url: Perl/portping_example.txt
        - text: .
      - listitem [ref=e1149]:
        - link "MTUfinder" [ref=e1150] [cursor=pointer]:
