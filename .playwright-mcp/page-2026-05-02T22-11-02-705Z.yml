        - text: ) (2006).
      - listitem [ref=e737]:
        - text: My
        - link "Solaris 10 Zones" [ref=e738] [cursor=pointer]:
          - /url: zones.html
        - text: page from 2005, where I developed models for configuring Zones with Resource Controls. This was pioneering work for the performance isolation of containers (nowadays the realm of Linux cgroups). I was not a Sun employee at the time. Sun later based their official docs on my work, without attribution (they were not allowed to include my home page URL in the official Sun references).
      - listitem [ref=e739]:
        - link "DTrace vs truss" [ref=e740] [cursor=pointer]:
          - /url: DTrace/dtracevstruss.html
        - text: ", a page to explain the virtues of DTrace over truss, the Solaris syscall tracer (2005)."
      - listitem [ref=e741]:
        - text: Analysis of
        - link "prstat vs top using DTrace" [ref=e742] [cursor=pointer]:
          - /url: DTrace/prstatvstop.html
        - text: ", and showing why these perform differently (2005)."
      - listitem [ref=e743]:
        - text: "Another DTrace case study:"
        - link "DTracing SMC" [ref=e744] [cursor=pointer]:
          - /url: DTrace/smc.html
        - text: ", the Solaris Management Console, which took 30 minutes to startup (yes, minutes). I found various issues using DTrace, including 12 Million mostly 1 byte sequential read()s. (2005)."
      - listitem [ref=e745]:
        - text: "A DTrace case study:"
        - link "DTracing Lost CPU" [ref=e746] [cursor=pointer]:
          - /url: DTrace/lostcpu.html
        - text: ", demonstrating DTrace and my new DTrace tools. I published this and others before Solaris 10 was released, at a time when there were no other websites on using DTrace, and so these became important first use cases from a customer (2005)."
      - listitem [ref=e747]:
        - link "DTrace" [ref=e748] [cursor=pointer]:
          - /url: dtrace.html
        - text: where I shared the first publicly available DTrace tools and later my
        - link "DTraceToolkit" [ref=e749] [cursor=pointer]:
          - /url: dtracetoolkit.html
        - text: . I created this page in 2004 and it was also the first public website on DTrace.
      - listitem [ref=e750]:
        - text: I had two prior professional blogs (see my
        - link "blog archive" [ref=e751] [cursor=pointer]:
