      - listitem [ref=e626]:
        - text: The
        - link "DTrace book" [ref=e627] [cursor=pointer]:
          - /url: http://www.dtracebook.com
        - text: with Jim Mauro (Prentice Hall, 2011; ISBN 0132091518). A sample chapter on
        - link "File Systems" [ref=e628] [cursor=pointer]:
          - /url: /blog/2011-02-23/dtrace-book-sample-chapter-file-systems.html
        - text: is online. This 1152 page book took over a year to write, including the research, development and testing of dozens of new DTrace scripts and one-liners, and soliciting input from many experts. Solaris was used as the primary OS for examples, with additional examples from Mac OS X and FreeBSD. The most difficult challenge for using a dynamic tracing tool (DTrace, SystemTap, etc.) is knowing what to do with it. This book provides over one hundred use cases (scripts), which will be invaluable even after the example code becomes out of date.
