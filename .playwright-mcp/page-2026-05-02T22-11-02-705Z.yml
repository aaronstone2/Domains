      - listitem [ref=e681]:
        - text: Slides for
        - link "Fishworks Analytics" [ref=e682] [cursor=pointer]:
          - /url: Slides/CEC2008_analytics.pdf
        - text: (PDF) for CEC2008 with Bryan Cantrill, where we launched a storage appliance performance analysis tool that was many years ahead of the industry. A real-time dynamic tracing GUI, latency heat maps, etc.
      - listitem [ref=e683]:
        - text: Slides for
        - link "Fishworks Overview" [ref=e684] [cursor=pointer]:
          - /url: Slides/CEC2008_fishworks_overview.pdf
        - text: (PDF) at CEC2008 with Cindi McGuire, where we introduced the first ZFS-based storage appliance, the Sun Storage 7000 series. Fishworks was the team that developed it. We worked at a private site, setup to mimic a San Francisco startup.
      - listitem [ref=e685]:
        - text: The original
        - link "ZFS L2ARC" [ref=e686] [cursor=pointer]:
          - /url: /blog/2008-07-22/zfs-l2arc.html
        - text: post (2008) and later
        - link "L2ARC Screenshots" [ref=e687] [cursor=pointer]:
          - /url: /blog/2009-01-30/l2arc-screenshots.html
        - text: (2009). Since code changes were public each night, my
        - link "block comment" [ref=e688] [cursor=pointer]:
          - /url: Solaris/l2arc_comment.txt
        - text: in usr/src/uts/common/fs/zfs/arc.c (added in Nov 2007) disguised the then-secret intent of this technology by listing "short-stroked disks" as the first intended device, instead of SSDs.
      - listitem [ref=e689]:
        - text: I wrote the original
        - link "Sun ZFS Storage 7000 admin guide" [ref=e690] [cursor=pointer]:
          - /url: https://docs.oracle.com/cd/E22471_01/pdf/820-4167.pdf
        - text: "and online help, and while doing so created the most advanced content system within Sun Microsystems: A content wiki that could auto-generate Sun-styled PDFs and other formats, allowing versions to be built in seconds instead of the usual 2-week process. This 2010 version has many updates from other staff (I've yet to find my original 2008 PDF) (2008)."
      - listitem [ref=e691]:
        - text: A post on the
        - link "DTraceToolkit in MacOS X" [ref=e692] [cursor=pointer]:
          - /url: /blog/2008-02-18/dtracetoolkit-in-macosx.html
        - text: ", which included (and updated) 44 of my DTraceToolkit tools in /usr/bin by default (2008)."
      - listitem [ref=e693]:
        - text: A post announcing the
        - link "DTraceToolkit ver 0.99" [ref=e694] [cursor=pointer]:
          - /url: /blog/2007-10-05/dtracetoolkit-099.html
        - text: ", a major release were I added many language provider tools (2007)."
