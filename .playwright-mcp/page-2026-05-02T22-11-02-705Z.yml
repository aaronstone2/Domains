        - link "TSA Method" [ref=e522] [cursor=pointer]:
          - /url: tsamethod.html
        - text: ", a performance analysis methodology for identifying issues causing poor application performance. This is a thread-oriented methodology, and is complementary to the resource-oriented USE Method. It has solved countless issues."
