      - listitem [ref=e729]:
        - text: "The companion book to Solaris Internals 2nd Edition:"
        - link "Solaris Performance and Tools" [ref=e730] [cursor=pointer]:
          - /url: http://www.amazon.com/gp/product/0131568191/ref=as_li_ss_tl?ie=UTF8&tag=deirdrestraug-20&linkCode=as2&camp=217145&creative=399369&creativeASIN=0131568191
        - text: ", with Richard McDougall and Jim Mauro (Prentice Hall, 2006; ISBN 0131568191). These chapters began during development of Solaris Internals 2nd Edition, and were later split into a separate companion volume. It worked well: a reference book on internals, and a companion book for practitioners on performance. 444 pages."
      - listitem [ref=e731]:
        - text: The post
        - link "How much CPU does a down interface chew?" [ref=e732] [cursor=pointer]:
          - /url: /blog/2006-08-11/how-much-cpu-does-a-down-interface-chew.html
        - text: ", solving a mysterious performance issue on Solaris (2006)."
