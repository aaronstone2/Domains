        - text: A 233-slide deck for a
        - link "DTrace workshop" [ref=e734] [cursor=pointer]:
          - /url: Slides/CS2006_dtrace_workshop_slides
        - text: that I developed and delivered in London, that summarized Solaris performance and DTrace analysis. As part of this workshop I created performance labs for the students to solve (not included in the slides) (
        - link "slides" [ref=e735] [cursor=pointer]:
          - /url: Slides/CS2006_dtrace_workshop_slides
        - text: ","
        - link "PDF" [ref=e736] [cursor=pointer]:
