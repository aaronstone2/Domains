        - text: using latency heat maps (2010). This includes interesting latency heat maps I had found using Sun Storage Analytics, including the
        - link "Rainbow Pterodactyl" [ref=e644] [cursor=pointer]:
          - /url: /blog/2009-03-12/latency-art-rainbow-pterodactyl.html
        - text: and the
