          - /url: HeatMaps/latency.html
        - text: about it.
      - listitem [ref=e1134]:
        - link "Chaosreader" [ref=e1135] [cursor=pointer]:
          - /url: chaosreader.html
        - text: ": A forensics and network troubleshooting tools that extracts and reassembles application data from sniffed TCP/UDP sessions in tcpdump or snoop logs. Supports HTTP transfers, FTP transfers, SMTP emails, telnet sessions, etc. This"
        - link "example output" [ref=e1136] [cursor=pointer]:
          - /url: Chaosreader/Chaos01/index.html
        - text: "was created by Chaosreader to link to the extracted HTTP sections, telnet sessions, and FTP files found in a snoop log. This can also create telnet replay programs that play back sessions in realtime:"
        - link "example" [ref=e1137] [cursor=pointer]:
          - /url: Chaosreader/Chaos01/session_0004.telnet.replay
        - text: . Created in 2003.
        - link "download code" [ref=e1138] [cursor=pointer]:
          - /url: https://github.com/brendangregg/Chaosreader
        - text: (github).
      - listitem [ref=e1139]:
        - text: "Perl modules:"
        - link "Net::SnoopLog" [ref=e1140] [cursor=pointer]:
          - /url: http://search.cpan.org/~bdgregg/Net-SnoopLog-0.12/SnoopLog.pm
        - text: for snoop packet logs (RFC1761),
        - link "Net::TcpDumpLog" [ref=e1141] [cursor=pointer]:
          - /url: http://search.cpan.org/~bdgregg/Net-TcpDumpLog-0.11/TcpDumpLog.pm
        - text: for tcpdump/libpcap logs,
        - link "Algorithm::Hamming::Perl" [ref=e1142] [cursor=pointer]:
