      - listitem [ref=e587]:
        - text: The
        - link "USE Method" [ref=e588] [cursor=pointer]:
          - /url: usemethod.html
        - text: ", which I developed for identifying common system bottlenecks and errors, and have used successfully for many years in enterprise and cloud performance environments. Based on the USE method: the"
        - link "Linux Performance Checklist" [ref=e589] [cursor=pointer]:
          - /url: USEmethod/use-linux.html
        - text: ", the"
        - link "Solaris Performance Checklist" [ref=e590] [cursor=pointer]:
          - /url: USEmethod/use-solaris.html
        - text: ", the"
        - link "SmartOS Performance Checklist" [ref=e591] [cursor=pointer]:
          - /url: USEmethod/use-smartos.html
        - text: ", the"
        - link "Mac OS X Performance Checklist" [ref=e592] [cursor=pointer]:
          - /url: USEmethod/use-macosx.html
        - text: ", the"
        - link "FreeBSD Performance Checklist" [ref=e593] [cursor=pointer]:
          - /url: USEmethod/use-freebsd.html
        - text: ", and the"
        - link "Unix 7th Edition Performance Checklist" [ref=e594] [cursor=pointer]:
          - /url: USEmethod/use-unix7th.html
        - text: . There is also the USE Method
        - link "Rosetta Stone of Performance Checklists" [ref=e595] [cursor=pointer]:
          - /url: USEmethod/use-rosetta.html
        - text: .
