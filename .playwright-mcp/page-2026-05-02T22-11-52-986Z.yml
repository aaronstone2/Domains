    - heading "3. Linux Performance Tools (Velocity 2015)" [level=3] [ref=e189]
    - paragraph [ref=e190]: "At Velocity 2015, I gave a 90 minute tutorial on Linux performance tools, summarizing performance observability, benchmarking, tuning, static performance tuning, and tracing tools. I also covered performance methodology, and included some live demos. This should be useful for everyone working on Linux systems. If you just saw my PerconaLive2016 talk, then some content should be familiar, but with many extras: I focus a lot more on the tools in this talk."
    - paragraph [ref=e191]:
      - text: A video of the talk is on youtube (
      - link "playlist" [ref=e192] [cursor=pointer]:
