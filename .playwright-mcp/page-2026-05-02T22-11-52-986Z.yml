    - heading "6. Broken Linux Performance Tools (SCaLE14x, 2016)" [level=3] [ref=e220]
    - paragraph [ref=e221]:
      - text: At the Southern California Linux Expo (
      - link "SCaLE 14x" [ref=e222] [cursor=pointer]:
        - /url: http://www.socallinuxexpo.org/scale/14x
      - text: ), I gave a talk on Broken Linux Performance Tools. This was a follow-on to my earlier Linux Performance Tools talk originally at SCaLE11x (and more recently at
      - link "Velocity" [ref=e223] [cursor=pointer]:
        - /url: "#Velocity2015"
      - text: as a tutorial). This broken tools talk was a tour of common problems with Linux system tools, metrics, statistics, visualizations, measurement overhead, and benchmarks. It also includes advice on how to cope (the green "What You Can Do" slides).
