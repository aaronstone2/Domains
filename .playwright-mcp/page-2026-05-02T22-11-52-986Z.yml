    - 'heading "10. Linux Performance Analysis: New Tools and Old Secrets (ftrace) (LISA 2014)" [level=3] [ref=e260]'
    - paragraph [ref=e261]:
      - text: "At USENIX LISA 2014, I gave a talk on the new ftrace and perf_events tools I've been developing: the"
      - link "perf-tools" [ref=e262] [cursor=pointer]:
