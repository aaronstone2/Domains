      - text: .
    - heading "4. How Netflix Tunes EC2 Instances for Performance (AWS re:Invent, 2017)" [level=3] [ref=e204]
    - paragraph [ref=e205]: Instead of performance observability, this talk is about tuning. I begin by providing Netflix background, covering instance types and features in the AWS EC2 cloud, and then talk about Linux kernel tunables and observability.
