      - text: and
      - link "LinuxCon" [ref=e202] [cursor=pointer]:
        - /url: /blog/2014-08-23/linux-perf-tools-linuxcon-na-2014.html
      - text: talks, however, with 90 minutes I was able to cover more tools and methodologies, making it the most complete tour of the topic I've done. I also posted about it on the
      - link "Netflix Tech Blog" [ref=e203] [cursor=pointer]:
