    - heading "7. Using Linux perf at Netflix (Kernel Recipes, 2017)" [level=3] [ref=e231]
    - paragraph [ref=e232]:
      - text: At
      - link "Kernel Recipes 2017" [ref=e233] [cursor=pointer]:
        - /url: https://kernel-recipes.org/en/2017/talks/perf-in-netflix/
      - text: I gave an updated talk on Linux perf at Netflix, focusing on getting CPU profiling and flame graphs to work. This talk includes a crash course on perf_events, plus gotchas such as fixing stack traces and symbols when profiling Java, Node.js, VMs, and containers.
