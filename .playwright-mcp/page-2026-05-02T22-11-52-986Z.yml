        - /url: http://www.slideshare.net/brendangregg/velocity-2015-linux-perf-tools
      - text: or as a
      - link "PDF" [ref=e196] [cursor=pointer]:
        - /url: /Slides/Velocity2015_LinuxPerfTools.pdf
      - text: .
    - paragraph [ref=e197]:
      - iframe [ref=e198]
      - iframe [ref=e199]
    - paragraph [ref=e200]:
      - text: This was similar to my
      - link "SCaLE11x" [ref=e201] [cursor=pointer]:
