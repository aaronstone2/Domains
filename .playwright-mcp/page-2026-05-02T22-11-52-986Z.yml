    - heading "9. Performance analysis superpowers with Linux eBPF (O'Reilly Velocity, 2017)" [level=3] [ref=e251]
    - paragraph [ref=e252]: This talk covers using enhanced BPF (aka eBPF) features added to the Linux 4.x series for performance analysis, observability, and debugging. The front-end used in this talk is bcc (BPF compiler collection), an open source project that provides BPF interfaces and a collection of tools.
