                  - heading "BPF Compiler Collection (BCC)" [level=1] [ref=e730]
                  - 'link "Permalink: BPF Compiler Collection (BCC)" [ref=e731] [cursor=pointer]':
                    - /url: "#bpf-compiler-collection-bcc"
                    - img [ref=e732]
                - paragraph [ref=e734]: BCC is a toolkit for creating efficient kernel tracing and manipulation programs, and includes several useful tools and examples. It makes use of extended BPF (Berkeley Packet Filters), formally known as eBPF, a new feature that was first added to Linux 3.15. Much of what BCC uses requires Linux 4.1 and above.
                - paragraph [ref=e735]:
                  - text: eBPF was
                  - link "described by" [ref=e736] [cursor=pointer]:
                    - /url: https://lkml.org/lkml/2015/4/14/232
                  - text: "Ingo Molnár as:"
                - blockquote [ref=e737]:
                  - paragraph [ref=e738]: One of the more interesting features in this cycle is the ability to attach eBPF programs (user-defined, sandboxed bytecode executed by the kernel) to kprobes. This allows user-defined instrumentation on a live kernel image that can never crash, hang or interfere with the kernel negatively.
                - paragraph [ref=e739]: BCC makes BPF programs easier to write, with kernel instrumentation in C (and includes a C wrapper around LLVM), and front-ends in Python and lua. It is suited for many tasks, including performance analysis and network traffic control.
                - generic [ref=e740]:
                  - heading "Screenshot" [level=2] [ref=e741]
                  - 'link "Permalink: Screenshot" [ref=e742] [cursor=pointer]':
                    - /url: "#screenshot"
                    - img [ref=e743]
                - paragraph [ref=e745]: This example traces a disk I/O kernel function, and populates an in-kernel power-of-2 histogram of the I/O size. For efficiency, only the histogram summary is returned to user-level.
                - generic [ref=e746]:
                  - generic [ref=e747]:
                    - generic [ref=e748]: "# ./bitehist.py"
                    - text: "Tracing... Hit Ctrl-C to end. ^C kbytes : count distribution 0 -> 1 : 3 | | 2 -> 3 : 0 | | 4 -> 7 : 211 |********** | 8 -> 15 : 0 | | 16 -> 31 : 0 | | 32 -> 63 : 0 | | 64 -> 127 : 1 | | 128 -> 255 : 800 |**************************************|"
                  - button "Copy" [ref=e750] [cursor=pointer]:
                    - img [ref=e751]
                - paragraph [ref=e754]: The above output shows a bimodal distribution, where the largest mode of 800 I/O was between 128 and 255 Kbytes in size.
