                    - img [ref=e1230]
                - paragraph [ref=e1232]: Tools that help to introspect BPF programs.
                - list [ref=e1233]:
                  - listitem [ref=e1234]:
                    - text: introspection/
                    - link "bps.c" [ref=e1235] [cursor=pointer]:
                      - /url: /iovisor/bcc/blob/master/introspection/bps.c
                    - text: ": List all BPF programs loaded into the kernel. 'ps' for BPF programs."
                    - link "Examples" [ref=e1236] [cursor=pointer]:
                      - /url: /iovisor/bcc/blob/master/introspection/bps_example.txt
                    - text: .
                - generic [ref=e1237]:
                  - heading "Motivation" [level=2] [ref=e1238]
                  - 'link "Permalink: Motivation" [ref=e1239] [cursor=pointer]':
                    - /url: "#motivation"
                    - img [ref=e1240]
                - paragraph [ref=e1242]: BPF guarantees that the programs loaded into the kernel cannot crash, and cannot run forever, but yet BPF is general purpose enough to perform many arbitrary types of computation. Currently, it is possible to write a program in C that will compile into a valid BPF program, yet it is vastly easier to write a C program that will compile into invalid BPF (C is like that). The user won't know until trying to run the program whether it was valid or not.
                - paragraph [ref=e1243]: With a BPF-specific frontend, one should be able to write in a language and receive feedback from the compiler on the validity as it pertains to a BPF backend. This toolkit aims to provide a frontend that can only create valid BPF programs while still harnessing its full flexibility.
                - paragraph [ref=e1244]: Furthermore, current integrations with BPF have a kludgy workflow, sometimes involving compiling directly in a linux kernel source tree. This toolchain aims to minimize the time that a developer spends getting BPF compiled, and instead focus on the applications that can be written and the problems that can be solved with BPF.
                - paragraph [ref=e1245]: "The features of this toolkit include:"
                - list [ref=e1246]:
                  - listitem [ref=e1247]:
                    - text: End-to-end BPF workflow in a shared library
                    - list [ref=e1248]:
                      - listitem [ref=e1249]: A modified C language for BPF backends
                      - listitem [ref=e1250]: Integration with llvm-bpf backend for JIT
                      - listitem [ref=e1251]: Dynamic (un)loading of JITed programs
                      - listitem [ref=e1252]: "Support for BPF kernel hooks: socket filters, tc classifiers, tc actions, and kprobes"
                  - listitem [ref=e1253]: Bindings for Python
                  - listitem [ref=e1254]: Examples for socket filters, tc classifiers, and kprobes
                  - listitem [ref=e1255]: Self-contained tools for tracing a running system
                - paragraph [ref=e1256]: In the future, more bindings besides python will likely be supported. Feel free to add support for the language of your choice and send a pull request!
                - generic [ref=e1257]:
