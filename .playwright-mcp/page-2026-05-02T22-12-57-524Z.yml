                  - code [ref=e421]: "bpftrace -e 'kprobe:vfs_read { @start[tid] = nsecs; } kretprobe:vfs_read /@start[tid]/ { @ns[comm] = hist(nsecs - @start[tid]); delete(@start, tid); }'"
                  - button "Copy" [ref=e423] [cursor=pointer]:
