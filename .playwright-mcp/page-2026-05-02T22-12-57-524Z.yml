                    - img [ref=e388]
                - generic [ref=e390]:
                  - code [ref=e392]: "bpftrace -e 'kretprobe:vfs_read { @bytes = lhist(retval, 0, 2000, 200); }'"
                  - button "Copy" [ref=e394] [cursor=pointer]:
