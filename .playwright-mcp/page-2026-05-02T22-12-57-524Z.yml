                - paragraph [ref=e398]: "Expected Output:"
                - generic [ref=e399]:
                  - code [ref=e401]: "Attached 1 probe ^C @bytes: (...,0] 0 | | [0, 200) 66 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@| [200, 400) 2 |@ | [400, 600) 3 |@@ | [600, 800) 0 | | [800, 1000) 5 |@@@ | [1000, 1200) 0 | | [1200, 1400) 0 | | [1400, 1600) 0 | | [1600, 1800) 0 | | [1800, 2000) 0 | | [2000,...) 39 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ |"
                  - button "Copy" [ref=e403] [cursor=pointer]:
                    - img [ref=e404]
                - paragraph [ref=e407]: Summarize read() bytes as a linear histogram, and traced using kernel dynamic tracing.
                - list [ref=e408]:
                  - listitem [ref=e409]:
                    - text: It begins with the probe
                    - code [ref=e410]: kretprobe:vfs_read
                    - text: ": this is the kretprobe probe type (kernel dynamic tracing of function returns) instrumenting the"
                    - code [ref=e411]: vfs_read()
                    - text: "kernel function. There is also the kprobe probe type (shown in the next lesson), to instrument when functions begin execution (are entered). These are powerful probe types, letting you trace tens of thousands of different kernel functions. However, these are \"unstable\" probe types: since they can trace any kernel function, there is no guarantee that your kprobe/kretprobe will work between kernel versions, as the function names, arguments, return values, and roles may change. Also, since it is tracing the raw kernel, you'll need to browse the kernel source to understand what these probes, arguments, and return values, mean."
                  - listitem [ref=e412]:
                    - text: "lhist(): this is a linear histogram, where the arguments are: value, min, max, step. The first argument ("
                    - code [ref=e413]: retval
                    - text: ") of vfs_read() is the return value: the number of bytes read."
                - generic [ref=e414]:
                  - heading "Lesson 7. Timing read()s" [level=1] [ref=e415]
                  - 'link "Permalink: Lesson 7. Timing read()s" [ref=e416] [cursor=pointer]':
