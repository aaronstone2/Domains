                - generic [ref=e516]:
                  - code [ref=e518]: "^C [...] @[ __schedule+697 __schedule+697 schedule+50 schedule_timeout+365 xfsaild+274 kthread+248 ret_from_fork+53 ]: 73 @[ __schedule+697 __schedule+697 schedule_idle+40 do_idle+356 cpu_startup_entry+111 start_secondary+423 secondary_startup_64+165 ]: 305"
                  - button "Copy" [ref=e520] [cursor=pointer]:
                    - img [ref=e521]
                - paragraph [ref=e524]: This counts stack traces that led to context switching (off-CPU) events. The above output has been truncated to show the last two only.
                - list [ref=e525]:
                  - listitem [ref=e526]: "sched: The sched category has tracepoints for different kernel CPU scheduler events: sched_switch, sched_wakeup, sched_migrate_task, etc."
                  - listitem [ref=e527]: "sched_switch: This probe fires when a thread leaves CPU. This will be a blocking event: eg, waiting on I/O, a timer, paging/swapping, or a lock."
                  - listitem [ref=e528]: "kstack: A kernel stack trace."
                  - listitem [ref=e529]: sched_switch fires in thread context, so that the stack refers to the thread who is leaving. As you use other probe types, pay attention to context, as comm, pid, kstack, etc, may not refer to the target of the probe.
                - generic [ref=e530]:
                  - heading "Lesson 11. Block I/O Tracing" [level=1] [ref=e531]
                  - 'link "Permalink: Lesson 11. Block I/O Tracing" [ref=e532] [cursor=pointer]':
