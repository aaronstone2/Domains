                - paragraph [ref=e497]: Profile kernel stacks at 99 Hertz, printing a frequency count.
                - list [ref=e498]:
                  - listitem [ref=e499]: "profile:hz:99: This fires on all CPUs at 99 Hertz. Why 99 and not 100 or 1000? We want frequent enough to catch both the big and small picture of execution, but not too frequent as to perturb performance. 100 Hertz is enough. But we don't want 100 exactly, as sampling may occur in lockstep with other timed activities, hence 99."
                  - listitem [ref=e500]:
                    - text: "kstack: Returns the kernel stack trace. This is used as a key for the map, so that it can be frequency counted. The output of this is ideal to be visualized as a flame graph. There is also"
                    - code [ref=e501]: ustack
                    - text: for the user-level stack trace.
                - generic [ref=e502]:
                  - heading "Lesson 10. Scheduler Tracing" [level=1] [ref=e503]
                  - 'link "Permalink: Lesson 10. Scheduler Tracing" [ref=e504] [cursor=pointer]':
