                - paragraph [ref=e349]: This summarizes syscalls by process name, printing a report on Ctrl-C.
                - list [ref=e350]:
                  - listitem [ref=e351]: "@: This denotes a special variable type called a map, which can store and summarize data in different ways. You can add an optional variable name after the @, eg \"@num\", either to improve readability, or to differentiate between more than one map."
                  - listitem [ref=e352]: "[]: The optional brackets allow a key to be set for the map, much like an associative array."
                  - listitem [ref=e353]: "count(): This is a map function – the way it is populated. count() counts the number of times it is called. Since this is saved by comm, the result is a frequency count of system calls by process name."
                - paragraph [ref=e354]: Maps are automatically printed when bpftrace ends (eg, via Ctrl-C).
                - generic [ref=e355]:
                  - heading "Lesson 5. Distribution of read() Bytes" [level=1] [ref=e356]
                  - 'link "Permalink: Lesson 5. Distribution of read() Bytes" [ref=e357] [cursor=pointer]':
                    - /url: "#lesson-5-distribution-of-read-bytes"
                    - img [ref=e358]
                - generic [ref=e360]:
                  - code [ref=e362]: "bpftrace -e 'tracepoint:syscalls:sys_exit_read /pid == 18644/ { @bytes = hist(args.ret); }'"
                  - button "Copy" [ref=e364] [cursor=pointer]:
                    - img [ref=e365]
                - paragraph [ref=e368]: "Expected Output:"
                - generic [ref=e369]:
                  - code [ref=e371]: "Attached 1 probe ^C @bytes: [0, 1] 12 |@@@@@@@@@@@@@@@@@@@@ | [2, 4) 18 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ | [4, 8) 0 | | [8, 16) 0 | | [16, 32) 0 | | [32, 64) 30 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@| [64, 128) 19 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ | [128, 256) 1 |@"
                  - button "Copy" [ref=e373] [cursor=pointer]:
                    - img [ref=e374]
                - paragraph [ref=e377]: This summarizes the return value of the sys_read() kernel function for PID 18644, printing it as a histogram.
                - list [ref=e378]:
                  - listitem [ref=e379]: "/.../: This is a filter (aka predicate), which acts as a filter for the action. The action is only executed if the filtered expression is true, in this case, only for the process ID 18644. Boolean operators are supported (\"&&\", \"||\")."
                  - listitem [ref=e380]: "ret: This is the return value of the function. For sys_read(), this is either -1 (error) or the number of bytes successfully read."
                  - listitem [ref=e381]: "@: This is a map similar to the previous lesson, but without any keys ([]) this time, and the name \"bytes\" which decorates the output."
                  - listitem [ref=e382]:
                    - text: "hist(): This is a map function which summarizes the argument as a power-of-2 histogram. The output shows rows that begin with interval notation, where, for example"
                    - code [ref=e383]: "[128, 256)"
                    - text: "means that the value is: 128 <= value < 256. The next number is the count of occurrences, and then an ASCII histogram is printed to visualize that count. The histogram can be used to study multi-modal distributions."
                  - listitem [ref=e384]: Other map functions include lhist() (linear hist), count(), sum(), avg(), min(), and max().
                - generic [ref=e385]:
                  - heading "Lesson 6. Kernel Dynamic Tracing of read() Bytes" [level=1] [ref=e386]
                  - 'link "Permalink: Lesson 6. Kernel Dynamic Tracing of read() Bytes" [ref=e387] [cursor=pointer]':
