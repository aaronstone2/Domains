                    - img [ref=e533]
                - generic [ref=e535]:
                  - code [ref=e537]: "bpftrace -e 'tracepoint:block:block_rq_issue { @ = hist(args.bytes); }'"
                  - button "Copy" [ref=e539] [cursor=pointer]:
