                    - img [ref=e561]
                - generic [ref=e563]:
                  - code [ref=e565]: "# cat path.bt #ifndef BPFTRACE_HAVE_BTF #include <linux/path.h> #include <linux/dcache.h> #endif kprobe:vfs_open { printf(\"open path: %s\\n\", str(((struct path *)arg0)->dentry->d_name.name)); } # bpftrace path.bt Attached 1 probe open path: dev open path: if_inet6 open path: retrans_time_ms [...]"
                  - button "Copy" [ref=e567] [cursor=pointer]:
                    - img [ref=e568]
                - paragraph [ref=e571]: This uses kernel dynamic tracing of the vfs_open() function, which has a (struct path *) as the first argument.
                - list [ref=e572]:
                  - listitem [ref=e573]: "kprobe: As mentioned earlier, this is the kernel dynamic tracing probe type, which traces the entry of kernel functions (use kretprobe to trace their returns)."
                  - listitem [ref=e574]:
                    - code [ref=e575]: arg0
                    - text: is a builtin variable containing the first probe argument, the meaning of which is defined by the probe type. For
                    - code [ref=e576]: kprobe
                    - text: ", it is the first argument to the function. Other arguments can be accessed as arg1, ..., argN."
                  - listitem [ref=e577]:
                    - code [ref=e578]: ((struct path *)arg0)->dentry->d_name.name
                    - text: ": this casts"
                    - code [ref=e579]: arg0
                    - text: as
                    - code [ref=e580]: struct path *
                    - text: ", then dereferences dentry, etc."
                  - listitem [ref=e581]: "#include: these are necessary to include struct definitions for path and dentry on systems where the kernel was built without BTF (BPF Type Format) data."
                - paragraph [ref=e582]:
                  - text: The kernel struct support is the same as bcc, making use of kernel headers. This means that many structs are available, but not everything, and sometimes it might be necessary to manually include a struct. For an example of this, see the
                  - link "dcsnoop tool" [ref=e583] [cursor=pointer]:
                    - /url: /bpftrace/bpftrace/blob/master/tools/dcsnoop.bt
                  - text: ", which includes a portion of struct nameidata manually as it wasn't in the available headers. If the kernel has BTF data, all kernel structs are always available."
