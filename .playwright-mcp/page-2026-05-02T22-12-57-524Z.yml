                - paragraph [ref=e543]: "Expected Output:"
                - generic [ref=e544]:
                  - code [ref=e546]: "Attached 1 probe ^C @: [0, 1] 1 |@@ | [2, 4) 0 | | [4, 8) 0 | | [8, 16) 0 | | [16, 32) 0 | | [32, 64) 0 | | [64, 128) 0 | | [128, 256) 0 | | [256, 512) 0 | | [512, 1K) 0 | | [1K, 2K) 0 | | [2K, 4K) 0 | | [4K, 8K) 24 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@| [8K, 16K) 2 |@@@@ | [16K, 32K) 6 |@@@@@@@@@@@@@ | [32K, 64K) 5 |@@@@@@@@@@ | [64K, 128K) 0 | | [128K, 256K) 1 |@@ |"
                  - button "Copy" [ref=e548] [cursor=pointer]:
                    - img [ref=e549]
                - paragraph [ref=e552]: Block I/O requests by size in bytes, as a histogram.
                - list [ref=e553]:
                  - listitem [ref=e554]: "tracepoint:block: The block category of tracepoints traces various block I/O (storage) events."
                  - listitem [ref=e555]: "block_rq_issue: This fires when an I/O is issued to the device."
                  - listitem [ref=e556]: "args.bytes: This is a member from the tracepoint block_rq_issue arguments which shows the size in bytes."
                - paragraph [ref=e557]: "The context of this probe is important: this fires when the I/O is issued to the device. This often happens in process context, where builtins like comm will show you the process name, but it can also happen from kernel context (eg, readahead) when the pid and comm will not show the application you expect."
                - generic [ref=e558]:
                  - heading "Lesson 12. Kernel Struct Tracing" [level=1] [ref=e559]
                  - 'link "Permalink: Lesson 12. Kernel Struct Tracing" [ref=e560] [cursor=pointer]':
