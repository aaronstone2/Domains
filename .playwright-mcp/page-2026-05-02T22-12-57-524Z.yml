                    - img [ref=e505]
                - generic [ref=e507]:
                  - code [ref=e509]: "bpftrace -e 'tracepoint:sched:sched_switch { @[kstack] = count(); }'"
                  - button "Copy" [ref=e511] [cursor=pointer]:
