                - paragraph [ref=e427]: "Expected Output:"
                - generic [ref=e428]:
                  - code [ref=e430]: "Attached 2 probes [...] @ns[snmp-pass]: [0, 1] 0 | | [2, 4) 0 | | [4, 8) 0 | | [8, 16) 0 | | [16, 32) 0 | | [32, 64) 0 | | [64, 128) 0 | | [128, 256) 0 | | [256, 512) 27 |@@@@@@@@@ | [512, 1k) 125 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ | [1k, 2k) 22 |@@@@@@@ | [2k, 4k) 1 | | [4k, 8k) 10 |@@@ | [8k, 16k) 1 | | [16k, 32k) 3 |@ | [32k, 64k) 144 |@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@| [64k, 128k) 7 |@@ | [128k, 256k) 28 |@@@@@@@@@@ | [256k, 512k) 2 | | [512k, 1M) 3 |@ | [1M, 2M) 1 | |"
                  - button "Copy" [ref=e432] [cursor=pointer]:
                    - img [ref=e433]
                - paragraph [ref=e436]: Summarize the time spent in read(), in nanoseconds, as a histogram, by process name.
                - list [ref=e437]:
                  - listitem [ref=e438]:
                    - paragraph [ref=e439]: "@start[tid]: This uses the thread ID as a key. There may be many reads in-flight, and we want to store a start timestamp to each. How? We could construct a unique identifier for each read, and use that as the key. But because kernel threads can only be executing one syscall at a time, we can use the thread ID as the unique identifier, as each thread cannot be executing more than one."
                  - listitem [ref=e440]:
                    - paragraph [ref=e441]: "nsecs: Nanoseconds since boot. This is a high resolution timestamp counter than can be used to time events."
                  - listitem [ref=e442]:
                    - paragraph [ref=e443]: "/@start[tid]/: This filter checks that the start time was seen and recorded. Without this filter, this program may be launched during a read and only catch the end, resulting in a time calculation of now - zero, instead of now - start."
                  - listitem [ref=e444]:
                    - paragraph [ref=e445]: "delete(@start, tid): this frees the variable."
