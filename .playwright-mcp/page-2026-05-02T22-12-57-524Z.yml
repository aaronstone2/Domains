                - paragraph [ref=e309]: This traces file opens as they happen, and we're printing the process name and pathname.
                - list [ref=e310]:
                  - listitem [ref=e311]:
                    - text: It begins with the probe
                    - code [ref=e312]: tracepoint:syscalls:sys_enter_openat
                    - text: ": this is the tracepoint probe type (kernel static tracing), and is instrumenting when the"
                    - code [ref=e313]: openat()
                    - text: "syscall begins (is entered). Tracepoints are preferred over kprobes (kernel dynamic tracing, introduced in lesson 6), since tracepoints have stable API. Note: In modern Linux systems (glibc >= 2.26) the"
                    - code [ref=e314]: open
                    - text: wrapper always calls the
                    - code [ref=e315]: openat
                    - text: syscall.
                  - listitem [ref=e316]:
                    - code [ref=e317]: comm
                    - text: is a builtin variable that has the current process's name. Other similar builtins include pid and tid.
                  - listitem [ref=e318]:
                    - code [ref=e319]: args
                    - text: "is a struct containing all the tracepoint arguments. This struct is automatically generated by bpftrace based tracepoint information. The members of this struct can be found with:"
                    - code [ref=e320]: bpftrace -vl tracepoint:syscalls:sys_enter_openat
                    - text: .
