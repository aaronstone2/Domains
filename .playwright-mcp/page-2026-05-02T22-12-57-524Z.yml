                - paragraph [ref=e253]: "\"bpftrace -l\" lists all probes, and a search term can be added."
                - list [ref=e254]:
                  - listitem [ref=e255]: A probe is an instrumentation point for capturing event data.
                  - listitem [ref=e256]:
                    - text: The supplied search term supports wildcards/globs (
                    - code [ref=e257]: "*"
                    - text: and
                    - code [ref=e258]: "?"
                    - text: )
                  - listitem [ref=e259]: "\"bpftrace -l\" can also be piped to grep(1) for full regular expression searching."
                - generic [ref=e260]:
                  - heading "Lesson 2. Hello World" [level=1] [ref=e261]
