                - list [ref=e283]:
                  - listitem [ref=e284]:
                    - text: The word
                    - code [ref=e285]: BEGIN
                    - text: is a special probe that fires at the start of the program (like awk's BEGIN). You can use it to set variables and print headers.
                  - listitem [ref=e286]: "An action can be associated with probes, in { }. This example calls printf() when the probe fires."
