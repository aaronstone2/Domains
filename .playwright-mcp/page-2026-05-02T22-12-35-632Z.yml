                - generic [ref=e736]:
                  - heading "Motivation" [level=2] [ref=e737]
                  - 'link "Permalink: Motivation" [ref=e738] [cursor=pointer]':
                    - /url: "#motivation"
                    - img [ref=e739]
                - paragraph [ref=e741]: BPF guarantees that the programs loaded into the kernel cannot crash, and cannot run forever, but yet BPF is general purpose enough to perform many arbitrary types of computation. Currently, it is possible to write a program in C that will compile into a valid BPF program, yet it is vastly easier to write a C program that will compile into invalid BPF (C is like that). The user won't know until trying to run the program whether it was valid or not.
                - paragraph [ref=e742]: With a BPF-specific frontend, one should be able to write in a language and receive feedback from the compiler on the validity as it pertains to a BPF backend. This toolkit aims to provide a frontend that can only create valid BPF programs while still harnessing its full flexibility.
                - paragraph [ref=e743]: Furthermore, current integrations with BPF have a kludgy workflow, sometimes involving compiling directly in a linux kernel source tree. This toolchain aims to minimize the time that a developer spends getting BPF compiled, and instead focus on the applications that can be written and the problems that can be solved with BPF.
                - paragraph [ref=e744]: "The features of this toolkit include:"
                - list [ref=e745]:
                  - listitem [ref=e746]:
                    - text: End-to-end BPF workflow in a shared library
                    - list [ref=e747]:
                      - listitem [ref=e748]: A modified C language for BPF backends
                      - listitem [ref=e749]: Integration with llvm-bpf backend for JIT
                      - listitem [ref=e750]: Dynamic (un)loading of JITed programs
                      - listitem [ref=e751]: "Support for BPF kernel hooks: socket filters, tc classifiers, tc actions, and kprobes"
                  - listitem [ref=e752]: Bindings for Python
                  - listitem [ref=e753]: Examples for socket filters, tc classifiers, and kprobes
                  - listitem [ref=e754]: Self-contained tools for tracing a running system
                - paragraph [ref=e755]: In the future, more bindings besides python will likely be supported. Feel free to add support for the language of your choice and send a pull request!
                - generic [ref=e756]:
                  - heading "Tutorials" [level=2] [ref=e757]
