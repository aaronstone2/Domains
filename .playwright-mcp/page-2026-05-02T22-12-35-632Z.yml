                - generic [ref=e228]:
                  - heading "BPF Compiler Collection (BCC)" [level=1] [ref=e229]
                  - 'link "Permalink: BPF Compiler Collection (BCC)" [ref=e230] [cursor=pointer]':
                    - /url: "#bpf-compiler-collection-bcc"
                    - img [ref=e231]
                - paragraph [ref=e233]: BCC is a toolkit for creating efficient kernel tracing and manipulation programs, and includes several useful tools and examples. It makes use of extended BPF (Berkeley Packet Filters), formally known as eBPF, a new feature that was first added to Linux 3.15. Much of what BCC uses requires Linux 4.1 and above.
                - paragraph [ref=e234]:
                  - text: eBPF was
                  - link "described by" [ref=e235] [cursor=pointer]:
                    - /url: https://lkml.org/lkml/2015/4/14/232
                  - text: "Ingo Molnár as:"
                - blockquote [ref=e236]:
                  - paragraph [ref=e237]: One of the more interesting features in this cycle is the ability to attach eBPF programs (user-defined, sandboxed bytecode executed by the kernel) to kprobes. This allows user-defined instrumentation on a live kernel image that can never crash, hang or interfere with the kernel negatively.
                - paragraph [ref=e238]: BCC makes BPF programs easier to write, with kernel instrumentation in C (and includes a C wrapper around LLVM), and front-ends in Python and lua. It is suited for many tasks, including performance analysis and network traffic control.
                - generic [ref=e239]:
                  - heading "Screenshot" [level=2] [ref=e240]
                  - 'link "Permalink: Screenshot" [ref=e241] [cursor=pointer]':
                    - /url: "#screenshot"
                    - img [ref=e242]
                - paragraph [ref=e244]: This example traces a disk I/O kernel function, and populates an in-kernel power-of-2 histogram of the I/O size. For efficiency, only the histogram summary is returned to user-level.
                - generic [ref=e245]:
