    - paragraph [ref=e10]:
      - text: These are some examples of using the
      - link "perf" [ref=e11] [cursor=pointer]:
        - /url: https://perf.wiki.kernel.org/index.php/Main_Page
      - text: Linux profiler, which has also been called Performance Counters for Linux (PCL), Linux perf events (LPE), or perf_events. Like
      - link "Vince Weaver" [ref=e12] [cursor=pointer]:
        - /url: http://web.eece.maine.edu/~vweaver/projects/perf_events/
      - text: ", I'll call it perf_events so that you can search on that term later. Searching for just \"perf\" finds sites on the police, petroleum, weed control, and a"
      - link "T-shirt" [ref=e13] [cursor=pointer]:
        - /url: perf_events/omg-so-perf.jpg
      - text: . This is not an official perf page, for either perf_events or the T-shirt.
    - paragraph [ref=e14]: "perf_events is an event-oriented observability tool, which can help you solve advanced performance and troubleshooting functions. Questions that can be answered include:"
    - list [ref=e15]:
      - listitem [ref=e16]: Why is the kernel on-CPU so much? What code-paths?
      - listitem [ref=e17]: Which code-paths are causing CPU level 2 cache misses?
      - listitem [ref=e18]: Are the CPUs stalled on memory I/O?
      - listitem [ref=e19]: Which code-paths are allocating memory, and how much?
      - listitem [ref=e20]: What is triggering TCP retransmits?
      - listitem [ref=e21]: Is a certain kernel function being called, and how often?
      - listitem [ref=e22]: What reasons are threads leaving the CPU?
    - paragraph [ref=e23]:
      - text: perf_events is part of the Linux kernel, under tools/perf. While it uses many Linux tracing features, some are not yet exposed via the perf command, and need to be used via the ftrace interface instead. My
      - link "perf-tools" [ref=e24] [cursor=pointer]:
        - /url: https://github.com/brendangregg/perf-tools
      - text: collection (github) uses both perf_events and ftrace as needed.
