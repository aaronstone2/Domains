    - heading "9. More" [level=1] [ref=e600]
    - paragraph [ref=e601]: There's more capabilities to perf_events than I've demonstrated here. I'll add examples of the other subcommands when I get a chance.
    - paragraph [ref=e602]:
      - text: Here's a preview of perf trace, which was added in
      - link "3.7" [ref=e603] [cursor=pointer]:
        - /url: http://kernelnewbies.org/Linux_3.7
      - text: ", demonstrated on 3.13.1:"
    - generic [ref=e604]: "# perf trace ls 0.109 ( 0.000 ms): ... [continued]: read()) = 1 0.430 ( 0.000 ms): ... [continued]: execve()) = -2 0.565 ( 0.051 ms): execve(arg0: 140734989338352, arg1: 140734989358048, arg2: 40612288, arg3: 1407... 0.697 ( 0.051 ms): execve(arg0: 140734989338353, arg1: 140734989358048, arg2: 40612288, arg3: 1407... 0.797 ( 0.046 ms): execve(arg0: 140734989338358, arg1: 140734989358048, arg2: 40612288, arg3: 1407... 0.915 ( 0.045 ms): execve(arg0: 140734989338359, arg1: 140734989358048, arg2: 40612288, arg3: 1407... 1.030 ( 0.044 ms): execve(arg0: 140734989338362, arg1: 140734989358048, arg2: 40612288, arg3: 1407... 1.414 ( 0.311 ms): execve(arg0: 140734989338363, arg1: 140734989358048, arg2: 40612288, arg3: 1407... 2.156 ( 1.053 ms): ... [continued]: brk()) = 0xac9000 2.319 ( 1.215 ms): ... [continued]: access()) = -1 ENOENT No such file or directory 2.479 ( 1.376 ms): ... [continued]: mmap()) = 0xb3a84000 2.634 ( 0.052 ms): access(arg0: 139967406289504, arg1: 4, arg2: 139967408408688, arg3: 13996740839... 2.787 ( 0.205 ms): ... [continued]: open()) = 3 2.919 ( 0.337 ms): ... [continued]: fstat()) = 0 3.049 ( 0.057 ms): mmap(arg0: 0, arg1: 22200, arg2: 1, arg3: 2, arg4: 3, arg5: 0 ) = 0xb3a... 3.177 ( 0.184 ms): ... [continued]: close()) = 0 3.298 ( 0.043 ms): access(arg0: 139967406278152, arg1: 0, arg2: 6, arg3: 7146772199173811245, arg4... 3.432 ( 0.049 ms): open(arg0: 139967408376811, arg1: 524288, arg2: 0, arg3: 139967408376810, arg4:... 3.560 ( 0.045 ms): read(arg0: 3, arg1: 140737350651528, arg2: 832, arg3: 139967408376810, arg4: 14... 3.684 ( 0.042 ms): fstat(arg0: 3, arg1: 140737350651216, arg2: 140737350651216, arg3: 354389249727... 3.814 ( 0.054 ms): mmap(arg0: 0, arg1: 2221680, arg2: 5, arg3: 2050, arg4: 3, arg5: 0 ) = 0xb36... [...]"
    - paragraph [ref=e605]:
      - text: An advantage is that this is buffered tracing, which costs much less overhead than strace, as I described
      - link "earlier" [ref=e606] [cursor=pointer]:
        - /url: "#perf_vs_strace"
      - text: . The perf trace output seen from this 3.13.1 kernel does, however, looks suspicious for a number of reasons. I think this is still an in-development feature. It reminds me of my
      - link "dtruss" [ref=e607] [cursor=pointer]:
        - /url: http://www.brendangregg.com/dtrace.html#dtruss
      - text: tool, which has a similar role, before I added code to print each system call in a custom and appropriate way.
    - heading "10. Building" [level=1] [ref=e608]
    - paragraph [ref=e609]: "The steps to build perf_events depends on your kernel version and Linux distribution. In summary:"
    - list [ref=e610]:
      - listitem [ref=e611]:
        - text: Get the Linux kernel source that matches your currently running kernel (eg, from the linux-source package, or
        - link "kernel.org" [ref=e612] [cursor=pointer]:
          - /url: http://kernel.org
        - text: ).
      - listitem [ref=e613]: Unpack the kernel source.
      - listitem [ref=e614]: cd tools/perf
      - listitem [ref=e615]: make
      - listitem [ref=e616]: Fix all errors, and most warnings, from (4).
    - paragraph [ref=e617]: The first error may be that you are missing make, or a compiler (gcc). Once you have those, you may then see various warnings about missing libraries, which disable perf features. I'd install as many as possible, and take note of the ones you are missing.
    - paragraph [ref=e618]: "These perf build warnings are really helpful, and are generated by its Makefile. Here's the makefile from 3.9.3:"
    - generic [ref=e619]: "# grep found Makefile msg := $(warning No libelf found, disables 'probe' tool, please install elfutils-libelf-devel/libelf-dev); msg := $(error No gnu/libc-version.h found, please install glibc-dev[el]/glibc-static); msg := $(warning No libdw.h found or old libdw.h found or elfutils is older than 0.138, disables dwarf support. Please install new elfutils-devel/libdw-dev); msg := $(warning No libunwind found, disabling post unwind support. Please install libunwind-dev[el] >= 0.99); msg := $(warning No libaudit.h found, disables 'trace' tool, please install audit-libs-devel or libaudit-dev); msg := $(warning newt not found, disables TUI support. Please install newt-devel or libnewt-dev); msg := $(warning GTK2 not found, disables GTK2 support. Please install gtk2-devel or libgtk2.0-dev); $(if $(1),$(warning No $(1) was found)) msg := $(warning No bfd.h/libbfd found, install binutils-dev[el]/zlib-static to gain symbol demangling) msg := $(warning No numa.h found, disables 'perf bench numa mem' benchmark, please install numa-libs-devel or libnuma-dev);"
    - paragraph [ref=e620]: Take the time to read them. This list is likely to grow as new features are added to perf_events.
    - paragraph [ref=e621]: The following notes show what I've specifically done for kernel versions and distributions, in case it is helpful.
    - 'heading "Packages: Ubuntu, 3.8.6" [level=3] [ref=e622]'
    - paragraph [ref=e623]: "Packages required for key functionality: gcc make bison flex elfutils libelf-dev libdw-dev libaudit-dev. You may also consider python-dev (for python scripting) and binutils-dev (for symbol demangling), which are larger packages."
    - 'heading "Kernel Config: 3.8.6" [level=3] [ref=e624]'
    - paragraph [ref=e625]: "Here are some kernel CONFIG options for perf_events functionality:"
    - generic [ref=e626]: "# for perf_events: CONFIG_PERF_EVENTS=y # for stack traces: CONFIG_FRAME_POINTER=y # kernel symbols: CONFIG_KALLSYMS=y # tracepoints: CONFIG_TRACEPOINTS=y # kernel function trace: CONFIG_FTRACE=y # kernel-level dynamic tracing: CONFIG_KPROBES=y CONFIG_KPROBE_EVENTS=y # user-level dynamic tracing: CONFIG_UPROBES=y CONFIG_UPROBE_EVENTS=y # full kernel debug info: CONFIG_DEBUG_INFO=y # kernel lock tracing: CONFIG_LOCKDEP=y # kernel lock tracing: CONFIG_LOCK_STAT=y # kernel dynamic tracepoint variables: CONFIG_DEBUG_INFO=y"
    - paragraph [ref=e627]: You may need to build your own kernel to enable these. The exact set you need depends on your needs and kernel version, and list is likely to grow as new features are added to perf_events.
    - heading "10.1. Static Builds" [level=2] [ref=e628]
    - paragraph [ref=e629]: "I've sometimes done this so that I have a single perf binary that can be copied into Docker containers for execution. Steps, given the Linux source:"
    - generic [ref=e630]: cd tools/perf vi Makefile.perf LDFLAGS=-static make clean; make
    - heading "11. Troubleshooting" [level=1] [ref=e631]
    - paragraph [ref=e632]:
      - text: If you see hexadecimal numbers instead of symbols, or have truncated stack traces, see the
      - link "Prerequisites" [ref=e633] [cursor=pointer]:
        - /url: "#Prerequisites"
      - text: section.
    - paragraph [ref=e634]: Here are some rough notes from other issues I've encountered.
    - paragraph [ref=e635]: "This sometimes works (3.5.7.2) and sometimes throws the following error (3.9.3):"
    - generic [ref=e636]: "ubuntu# perf stat -e 'syscalls:sys_enter_*' -a sleep 5 Error: Too many events are opened. Try again after reducing the number of events."
    - paragraph [ref=e637]: This can be fixed by increasing the file descriptor limit using ulimit -n.
    - paragraph [ref=e638]: "Type 3 errors:"
    - generic [ref=e639]: "ubuntu# perf report 0xab7e48 [0x30]: failed to process type: 3 # ======== # captured on: Tue Jan 28 21:08:31 2014 # hostname : pgbackup # os release : 3.9.3-ubuntu-12-opt # perf version : 3.9.3 # arch : x86_64 # nrcpus online : 8 # nrcpus avail : 8 # cpudesc : Intel(R) Xeon(R) CPU E5-2670 0 @ 2.60GHz # cpuid : GenuineIntel,6,45,7 # total memory : 8179104 kB # cmdline : /lib/modules/3.9.3-ubuntu-12-opt/build/tools/perf/perf record -e sched:sched_process_exec -a # event : name = sched:sched_process_exec, type = 2, config = 0x125, config1 = 0x0, config2 = 0x0, excl_usr = 0, excl_kern = 0, excl_host = 0, excl_guest = 1, precise_ip = 0 # HEADER_CPU_TOPOLOGY info available, use -I to display # HEADER_NUMA_TOPOLOGY info available, use -I to display # pmu mappings: software = 1, tracepoint = 2, breakpoint = 5 # ======== # Warning: Timestamp below last timeslice flush"
    - heading "12. Other Tools" [level=1] [ref=e640]
    - paragraph [ref=e641]:
      - text: "perf_events has the capabilities from many other tools rolled into one: strace(1), for tracing system calls, tcpdump(8), for tracing network packets, and blktrace(1), for tracing block device I/O (disk I/O), and other targets including file system and scheduler events. Tracing all events from one tool is not only convenient, it also allows direct correlations, including timestamps, between different instrumentation sources. Unlike these other tools, some assembly is required, which may not be for everyone (as explained in"
      - link "Audience" [ref=e642] [cursor=pointer]:
        - /url: "#Audience"
      - text: ).
