    - heading "4. Background" [level=1] [ref=e123]
    - paragraph [ref=e124]: The following sections provide some background for understanding perf_events and how to use it. I'll describe the prerequisites, audience, usage, events, and tracepoints.
    - heading "4.1. Prerequisites" [level=2] [ref=e125]
    - paragraph [ref=e126]: The perf tool is in the linux-tools-common package. Start by adding that, then running "perf" to see if you get the USAGE message. It may tell you to install another related package (linux-tools-kernelversion).
    - paragraph [ref=e127]:
      - text: You can also build and add perf from the Linux kernel source. See the
      - link "Building" [ref=e128] [cursor=pointer]:
        - /url: "#Building"
      - text: section.
    - paragraph [ref=e129]: To get the most out perf, you'll want symbols and stack traces. These may work by default in your Linux distribution, or they may require the addition of packages, or recompilation of the kernel with additional config options.
    - heading "4.2. Symbols" [level=2] [ref=e130]
    - paragraph [ref=e131]: perf_events, like other debug tools, needs symbol information (symbols). These are used to translate memory addresses into function and variable names, so that they can be read by us humans. Without symbols, you'll see hexadecimal numbers representing the memory addresses profiled.
    - paragraph [ref=e132]: "The following perf report output shows stack traces, however, only hexadecimal numbers can be seen:"
    - generic [ref=e133]: 57.14% sshd libc-2.15.so [.] connect | --- connect | |--25.00%-- 0x7ff3c1cddf29 | |--25.00%-- 0x7ff3bfe82761 | 0x7ff3bfe82b7c | |--25.00%-- 0x7ff3bfe82dfc --25.00%-- [...]
    - paragraph [ref=e134]: "If the software was added by packages, you may find debug packages (often \"-dbgsym\") which provide the symbols. Sometimes perf report will tell you to install these, eg: \"no symbols found in /bin/dd, maybe install a debug package?\"."
    - paragraph [ref=e135]: "Here's the same perf report output seen earlier, after adding openssh-server-dbgsym and libc6-dbgsym (this is on ubuntu 12.04):"
    - generic [ref=e136]: 57.14% sshd libc-2.15.so [.] __GI___connect_internal | --- __GI___connect_internal | |--25.00%-- add_one_listen_addr.isra.0 | |--25.00%-- __nscd_get_mapping | __nscd_get_map_ref | |--25.00%-- __nscd_open_socket --25.00%-- [...]
    - paragraph [ref=e137]: I find it useful to add both libc6-dbgsym and coreutils-dbgsym, to provide some symbol coverage of user-level OS codepaths.
    - paragraph [ref=e138]: "Another way to get symbols is to compile the software yourself. For example, I just compiled node (Node.js):"
    - generic [ref=e139]: "# file node-v0.10.28/out/Release/node node-v0.10.28/out/Release/node: ELF 64-bit LSB executable, ... not stripped"
    - paragraph [ref=e140]: This has not been stripped, so I can profile node and see more than just hex. If the result is stripped, configure your build system not to run strip(1) on the output binaries.
    - paragraph [ref=e141]: Kernel-level symbols are in the kernel debuginfo package, or when the kernel is compiled with CONFIG_KALLSYMS.
    - heading "4.3. JIT Symbols (Java, Node.js)" [level=2] [ref=e142]
    - paragraph [ref=e143]: Programs that have virtual machines (VMs), like Java's JVM and node's v8, execute their own virtual processor, which has its own way of executing functions and managing stacks. If you profile these using perf_events, you'll see symbols for the VM engine, which have some use (eg, to identify if time is spent in GC), but you won't see the language-level context you might be expecting. Eg, you won't see Java classes and methods.
    - paragraph [ref=e144]:
      - text: perf_events has JIT support to solve this, which requires the VM to maintain a /tmp/perf-PID.map file for symbol translation. Java can do this with
      - link "perf-map-agent" [ref=e145] [cursor=pointer]:
        - /url: https://github.com/jvm-profiling-tools/perf-map-agent
      - text: ", and Node.js 0.11.13+ with --perf_basic_prof. See my blog post"
      - link "Node.js flame graphs on Linux" [ref=e146] [cursor=pointer]:
        - /url: http://www.brendangregg.com/blog/2014-09-17/node-flame-graphs-on-linux.html
      - text: for the steps.
    - paragraph [ref=e147]:
      - text: Note that Java may not show full stacks to begin with, due to hotspot on x86 omitting the frame pointer (just like gcc). On newer versions (JDK 8u60+), you can use the -XX:+PreserveFramePointer option to fix this behavior, and profile fully using perf. See my Netflix Tech Blog post,
      - link "Java in Flames" [ref=e148] [cursor=pointer]:
        - /url: http://techblog.netflix.com/2015/07/java-in-flames.html
      - text: ", for a full writeup, and my"
      - link "Java flame graphs" [ref=e149] [cursor=pointer]:
        - /url: /FlameGraphs/cpuflamegraphs.html#Java
      - text: section, which links to an older patch and includes an example resulting flame graph. I also summarized the latest in my JavaOne 2016 talk
      - link "Java Performance Analysis on Linux with Flame Graphs" [ref=e150] [cursor=pointer]:
        - /url: http://www.slideshare.net/brendangregg/java-performance-analysis-on-linux-with-flame-graphs
      - text: .
    - heading "4.4 Stack Traces" [level=2] [ref=e151]
    - paragraph [ref=e152]: "Always compile with frame pointers. Omitting frame pointers is an evil compiler optimization that breaks debuggers, and sadly, is often the default. Without them, you may see incomplete stacks from perf_events, like seen in the earlier sshd symbols example. There are three ways to fix this: either using dwarf data to unwind the stack, using last branch record (LBR) if available (a processor feature), or returning the frame pointers."
    - paragraph [ref=e153]: There are other stack walking techniques, like BTS (Branch Trace Store), and the new ORC unwinder. I'll add docs for them at some point (and as perf support arrives).
    - paragraph [ref=e154]: Frame Pointers
    - paragraph [ref=e155]: "The earlier sshd example was a default build of OpenSSH, which uses compiler optimizations (-O2), which in this case has omitted the frame pointer. Here's how it looks after recompiling OpenSSH with -fno-omit-frame-pointer:"
    - generic [ref=e156]: 100.00% sshd libc-2.15.so [.] __GI___connect_internal | --- __GI___connect_internal | |--30.00%-- add_one_listen_addr.isra.0 | add_listen_addr | fill_default_server_options | main | __libc_start_main | |--20.00%-- __nscd_get_mapping | __nscd_get_map_ref | |--20.00%-- __nscd_open_socket --30.00%-- [...]
    - paragraph [ref=e157]: Now the ancestry from add_one_listen_addr() can be seen, down to main() and __libc_start_main().
    - paragraph [ref=e158]: "The kernel can suffer the same problem. Here's an example CPU profile collected on an idle server, with stack traces (-g):"
    - generic [ref=e159]: 99.97% swapper [kernel.kallsyms] [k] default_idle | --- default_idle 0.03% sshd [kernel.kallsyms] [k] iowrite16 | --- iowrite16 __write_nocancel (nil)
    - paragraph [ref=e160]: "The kernel stack traces are incomplete. Now a similar profile with CONFIG_FRAME_POINTER=y:"
    - generic [ref=e161]: 99.97% swapper [kernel.kallsyms] [k] default_idle | --- default_idle cpu_idle | |--87.50%-- start_secondary | --12.50%-- rest_init start_kernel x86_64_start_reservations x86_64_start_kernel 0.03% sshd [kernel.kallsyms] [k] iowrite16 | --- iowrite16 vp_notify virtqueue_kick start_xmit dev_hard_start_xmit sch_direct_xmit dev_queue_xmit ip_finish_output ip_output ip_local_out ip_queue_xmit tcp_transmit_skb tcp_write_xmit __tcp_push_pending_frames tcp_sendmsg inet_sendmsg sock_aio_write do_sync_write vfs_write sys_write system_call_fastpath __write_nocancel
    - paragraph [ref=e162]: Much better -- the entire path from the write() syscall (__write_nocancel) to iowrite16() can be seen.
    - paragraph [ref=e163]: Dwarf
    - paragraph [ref=e164]: "Since about the 3.9 kernel, perf_events has supported a workaround for missing frame pointers in user-level stacks: libunwind, which uses dwarf. This can be enabled using \"--call-graph dwarf\" (or \"-g dwarf\")."
    - paragraph [ref=e165]:
      - text: Also see the
      - link "Building" [ref=e166] [cursor=pointer]:
        - /url: "#Building"
      - text: section for other notes about building perf_events, as without the right library, it may build itself without dwarf support.
    - paragraph [ref=e167]: LBR
    - paragraph [ref=e168]: "You must have Last Branch Record access to be able to use this. It is disabled in most cloud environments, where you'll get this error:"
    - generic [ref=e169]: "# perf record -F 99 -a --call-graph lbr Error: PMU Hardware doesn't support sampling/overflow-interrupts."
    - paragraph [ref=e170]: "Here's an example of it working:"
    - generic [ref=e171]: "# perf record -F 99 -a --call-graph lbr ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.903 MB perf.data (163 samples) ] # perf script [...] stackcollapse-p 23867 [007] 4762187.971824: 29003297 cycles:ppp: 1430c0 Perl_re_intuit_start (/usr/bin/perl) 144118 Perl_regexec_flags (/usr/bin/perl) cfcc9 Perl_pp_match (/usr/bin/perl) cbee3 Perl_runops_standard (/usr/bin/perl) 51fb3 perl_run (/usr/bin/perl) 2b168 main (/usr/bin/perl) stackcollapse-p 23867 [007] 4762187.980184: 31532281 cycles:ppp: e3660 Perl_sv_force_normal_flags (/usr/bin/perl) 109b86 Perl_leave_scope (/usr/bin/perl) 1139db Perl_pp_leave (/usr/bin/perl) cbee3 Perl_runops_standard (/usr/bin/perl) 51fb3 perl_run (/usr/bin/perl) 2b168 main (/usr/bin/perl) stackcollapse-p 23867 [007] 4762187.989283: 32341031 cycles:ppp: cfae0 Perl_pp_match (/usr/bin/perl) cbee3 Perl_runops_standard (/usr/bin/perl) 51fb3 perl_run (/usr/bin/perl) 2b168 main (/usr/bin/perl)"
    - paragraph [ref=e172]: Nice! Note that LBR is usually limited in stack depth (either 8, 16, or 32 frames), so it may not be suitable for deep stacks or flame graph generation, as flame graphs need to walk to the common root for merging.
    - paragraph [ref=e173]: "Here's that same program sampled using the by-default frame pointer walk:"
    - generic [ref=e174]: "# perf record -F 99 -a -g ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.882 MB perf.data (81 samples) ] # perf script [...] stackcollapse-p 23883 [005] 4762405.747834: 35044916 cycles:ppp: 135b83 [unknown] (/usr/bin/perl) stackcollapse-p 23883 [005] 4762405.757935: 35036297 cycles:ppp: ee67d Perl_sv_gets (/usr/bin/perl) stackcollapse-p 23883 [005] 4762405.768038: 35045174 cycles:ppp: 137334 [unknown] (/usr/bin/perl)"
    - paragraph [ref=e175]: "You can recompile Perl with frame pointer support (in its ./Configure, it asks what compiler options: add -fno-omit-frame-pointer). Or you can use LBR if it's available, and you don't need very long stacks."
    - heading "4.5. Audience" [level=2] [ref=e176]
    - paragraph [ref=e177]: "To use perf_events, you'll either:"
    - list [ref=e178]:
      - listitem [ref=e179]: Develop your own commands
      - listitem [ref=e180]: Run example commands
    - paragraph [ref=e181]: "Developing new invocations of perf_events requires the study of kernel and application code, which isn't for everyone. Many more people will use perf_events by running commands developed by other people, like the examples on this page. This can work out fine: your organization may only need one or two people who can develop perf_events commands or source them, and then share them for use by the entire operation and support groups."
    - paragraph [ref=e182]:
      - text: Either way, you need to know the capabilities of perf_events so you know when to reach for it, whether that means searching for an example command or writing your own. One goal of the examples that follow is just to show you what can be done, to help you learn these capabilities. You should also browse examples on other sites (
      - link "Links" [ref=e183] [cursor=pointer]:
        - /url: "#Links"
      - text: ).
    - paragraph [ref=e184]:
      - text: If you've never used perf_events before, you may want to test before production use (it has had
      - link "kernel panic" [ref=e185] [cursor=pointer]:
        - /url: http://web.eecs.utk.edu/~vweaver1/projects/perf-events/kernel_panics.html
      - text: bugs in the past). My experience has been a good one (no panics).
    - heading "4.6. Usage" [level=2] [ref=e186]
    - paragraph [ref=e187]: perf_events provides a command line tool, perf, and subcommands for various profiling activities. This is a single interface for the different instrumentation frameworks that provide the various events.
    - paragraph [ref=e188]: "The perf command alone will list the subcommands; here is perf version 4.10 (for the Linux 4.10 kernel):"
    - generic [ref=e189]: "# perf usage: perf [--version] [--help] [OPTIONS] COMMAND [ARGS] The most commonly used perf commands are: annotate Read perf.data (created by perf record) and display annotated code archive Create archive with object files with build-ids found in perf.data file bench General framework for benchmark suites buildid-cache Manage build-id cache. buildid-list List the buildids in a perf.data file config Get and set variables in a configuration file. data Data file related processing diff Read perf.data files and display the differential profile evlist List the event names in a perf.data file inject Filter to augment the events stream with additional information kmem Tool to trace/measure kernel memory properties kvm Tool to trace/measure kvm guest os list List all symbolic event types lock Analyze lock events mem Profile memory accesses record Run a command and record its profile into perf.data report Read perf.data (created by perf record) and display the profile sched Tool to trace/measure scheduler properties (latencies) script Read perf.data (created by perf record) and display trace output stat Run a command and gather performance counter statistics test Runs sanity tests. timechart Tool to visualize total system behavior during a workload top System profiling tool. probe Define new dynamic tracepoints trace strace inspired tool See 'perf help COMMAND' for more information on a specific command."
    - paragraph [ref=e190]: Apart from separate help for each subcommand, there is also documentation in the kernel source under tools/perf/Documentation. perf has evolved, with different functionality added over time, so on an older kernel you may be missing some subcommands or functionality. Also, its usage may not feel consistent as you switch between activities. It's best to think of it as a multi-tool.
    - paragraph [ref=e191]: "perf_events can instrument in three ways (now using the perf_events terminology):"
    - list [ref=e192]:
      - listitem [ref=e193]: counting events in-kernel context, where a summary of counts is printed by perf. This mode does not generate a perf.data file.
      - listitem [ref=e194]: sampling events, which writes event data to a kernel buffer, which is read at a gentle asynchronous rate by the perf command to write to the perf.data file. This file is then read by the perf report or perf script commands.
      - listitem [ref=e195]: bpf programs on events, a new feature in Linux 4.4+ kernels that can execute custom user-defined programs in kernel space, which can perform efficient filters and summaries of the data. Eg, efficiently-measured latency histograms.
    - paragraph [ref=e196]: Try starting by counting events using the perf stat command, to see if this is sufficient. This subcommand costs the least overhead.
    - paragraph [ref=e197]: "When using the sampling mode with perf record, you'll need to be a little careful about the overheads, as the capture files can quickly become hundreds of Mbytes. It depends on the rate of the event you are tracing: the more frequent, the higher the overhead and larger the perf.data size."
    - paragraph [ref=e198]:
      - text: To really cut down overhead and generate more advanced summaries, write BPF programs executed by perf. See the
      - link "eBPF" [ref=e199] [cursor=pointer]:
        - /url: "#eBPF"
      - text: section.
    - heading "4.7. Usage Examples" [level=2] [ref=e200]
    - paragraph [ref=e201]: These example sequences have been chosen to illustrate some different ways that perf is used, from gathering to reporting.
    - paragraph [ref=e202]: "Performance counter summaries, including IPC, for the gzip command:"
    - generic [ref=e203]: "# perf stat gzip largefile"
    - paragraph [ref=e204]: "Count all scheduler process events for 5 seconds, and count by tracepoint:"
    - generic [ref=e205]: "# perf stat -e 'sched:sched_process_*' -a sleep 5"
    - paragraph [ref=e206]: "Trace all scheduler process events for 5 seconds, and count by both tracepoint and process name:"
    - generic [ref=e207]: "# perf record -e 'sched:sched_process_*' -a sleep 5 # perf report"
    - paragraph [ref=e208]: "Trace all scheduler process events for 5 seconds, and dump per-event details:"
    - generic [ref=e209]: "# perf record -e 'sched:sched_process_*' -a sleep 5 # perf script"
    - paragraph [ref=e210]: "Trace read() syscalls, when requested bytes is less than 10:"
    - generic [ref=e211]: "# perf record -e 'syscalls:sys_enter_read' --filter 'count < 10' -a"
    - paragraph [ref=e212]: "Sample CPU stacks at 99 Hertz, for 5 seconds:"
    - generic [ref=e213]: "# perf record -F 99 -ag -- sleep 5 # perf report"
    - paragraph [ref=e214]: "Dynamically instrument the kernel tcp_sendmsg() function, and trace it for 5 seconds, with stack traces:"
    - generic [ref=e215]: "# perf probe --add tcp_sendmsg # perf record -e probe:tcp_sendmsg -ag -- sleep 5 # perf probe --del tcp_sendmsg # perf report"
    - paragraph [ref=e216]: Deleting the tracepoint (--del) wasn't necessary; I included it to show how to return the system to its original state.
    - heading "Caveats" [level=3] [ref=e217]
    - paragraph [ref=e218]: "The use of -p PID as a filter doesn't work properly on some older kernel versions (Linux 3.x): perf hits 100% CPU and needs to be killed. It's annoying. The workaround is to profile all CPUs (-a), and filter PIDs later."
    - heading "4.8. Special Usage" [level=2] [ref=e219]
    - paragraph [ref=e220]: "There's a number of subcommands that provide special purpose functionality. These include:"
    - list [ref=e221]:
      - listitem [ref=e222]: "perf c2c (Linux 4.10+): cache-2-cache and cacheline false sharing analysis."
      - listitem [ref=e223]: "perf kmem: kernel memory allocation analysis."
      - listitem [ref=e224]: "perf kvm: KVM virtual guest analysis."
      - listitem [ref=e225]: "perf lock: lock analysis."
      - listitem [ref=e226]: "perf mem: memory access analysis."
      - listitem [ref=e227]:
        - text: "perf sched: kernel scheduler statistics."
        - link "Examples" [ref=e228] [cursor=pointer]:
          - /url: "#SchedulerAnalysis"
        - text: .
    - paragraph [ref=e229]: These make use of perf's existing instrumentation capabilities, recording selected events and reporting them in custom ways.
    - heading "5. Events" [level=1] [ref=e230]
    - paragraph [ref=e231]:
      - text: perf_events instruments "events", which are a unified interface for different kernel instrumentation frameworks. The following map (from my
      - link "SCaLE13x talk" [ref=e232] [cursor=pointer]:
        - /url: "#SCALE13x"
      - text: ") illustrates the event sources:"
    - paragraph
    - link [ref=e234] [cursor=pointer]:
      - /url: perf_events/perf_events_map.png
      - img [ref=e235]
    - paragraph
    - paragraph [ref=e236]: "The types of events are:"
    - list [ref=e237]:
      - listitem [ref=e238]: "Hardware Events: CPU performance monitoring counters."
      - listitem [ref=e239]: "Software Events: These are low level events based on kernel counters. For example, CPU migrations, minor faults, major faults, etc."
      - listitem [ref=e240]: "Kernel Tracepoint Events: This are static kernel-level instrumentation points that are hardcoded in interesting and logical places in the kernel."
      - listitem [ref=e241]: "User Statically-Defined Tracing (USDT): These are static tracepoints for user-level programs and applications."
      - listitem [ref=e242]: "Dynamic Tracing: Software can be dynamically instrumented, creating events in any location. For kernel software, this uses the kprobes framework. For user-level software, uprobes."
      - listitem [ref=e243]:
        - text: "Timed Profiling: Snapshots can be collected at an arbitrary frequency, using"
        - generic [ref=e244]: perf record -FHz
        - text: . This is commonly used for CPU usage profiling, and works by creating custom timed interrupt events.
    - paragraph
    - paragraph [ref=e245]: Details about the events can be collected, including timestamps, the code path that led to it, and other specific details. The capabilities of perf_events are enormous, and you're likely to only ever use a fraction.
    - paragraph [ref=e246]: "Currently available events can be listed using the list subcommand:"
    - generic [ref=e247]: "# perf list List of pre-defined events (to be used in -e): cpu-cycles OR cycles [Hardware event] instructions [Hardware event] cache-references [Hardware event] cache-misses [Hardware event] branch-instructions OR branches [Hardware event] branch-misses [Hardware event] bus-cycles [Hardware event] stalled-cycles-frontend OR idle-cycles-frontend [Hardware event] stalled-cycles-backend OR idle-cycles-backend [Hardware event] ref-cycles [Hardware event] cpu-clock [Software event] task-clock [Software event] page-faults OR faults [Software event] context-switches OR cs [Software event] cpu-migrations OR migrations [Software event] minor-faults [Software event] major-faults [Software event] alignment-faults [Software event] emulation-faults [Software event] L1-dcache-loads [Hardware cache event] L1-dcache-load-misses [Hardware cache event] L1-dcache-stores [Hardware cache event] [...] rNNN [Raw hardware event descriptor] cpu/t1=v1[,t2=v2,t3 ...]/modifier [Raw hardware event descriptor] (see 'man perf-list' on how to encode it) mem:<addr>[:access] [Hardware breakpoint] probe:tcp_sendmsg [Tracepoint event] [...] sched:sched_process_exec [Tracepoint event] sched:sched_process_fork [Tracepoint event] sched:sched_process_wait [Tracepoint event] sched:sched_wait_task [Tracepoint event] sched:sched_process_exit [Tracepoint event] [...] # perf list | wc -l 657"
    - paragraph [ref=e248]: When you use dynamic tracing, you are extending this list. The probe:tcp_sendmsg tracepoint in this list is an example, which I added by instrumenting tcp_sendmsg(). Profiling (sampling) events are not listed.
    - heading "5.1. Software Events" [level=2] [ref=e249]
    - paragraph [ref=e250]: "There is a small number of fixed software events provided by perf:"
    - generic [ref=e251]: "# perf list List of pre-defined events (to be used in -e): alignment-faults [Software event] bpf-output [Software event] context-switches OR cs [Software event] cpu-clock [Software event] cpu-migrations OR migrations [Software event] dummy [Software event] emulation-faults [Software event] major-faults [Software event] minor-faults [Software event] page-faults OR faults [Software event] task-clock [Software event] [...]"
    - paragraph [ref=e252]: "These are also documented in the man page perf_event_open(2):"
    - generic [ref=e253]: "[...] PERF_COUNT_SW_CPU_CLOCK This reports the CPU clock, a high-resolution per- CPU timer. PERF_COUNT_SW_TASK_CLOCK This reports a clock count specific to the task that is running. PERF_COUNT_SW_PAGE_FAULTS This reports the number of page faults. PERF_COUNT_SW_CONTEXT_SWITCHES This counts context switches. Until Linux 2.6.34, these were all reported as user-space events, after that they are reported as happening in the kernel. PERF_COUNT_SW_CPU_MIGRATIONS This reports the number of times the process has migrated to a new CPU. PERF_COUNT_SW_PAGE_FAULTS_MIN This counts the number of minor page faults. These did not require disk I/O to handle. [...]"
    - paragraph [ref=e254]:
      - text: The kernel also supports
      - link "traecpoints" [ref=e255] [cursor=pointer]:
        - /url: "#Tracepoints"
      - text: ", which are very similar to software events, but have a different more extensible API."
    - paragraph [ref=e256]: "Software events may have a default period. This means that when you use them for sampling, you're sampling a subset of events, not tracing every event. You can check with perf record -vv:"
    - generic [ref=e257]: "# perf record -vv -e context-switches /bin/true Using CPUID GenuineIntel-6-55 ------------------------------------------------------------ perf_event_attr: type 1 size 112 config 0x3 { sample_period, sample_freq } 4000 sample_type IP|TID|TIME|PERIOD disabled 1 inherit 1 mmap 1 comm 1 freq 1 enable_on_exec 1 [...]"
    - paragraph [ref=e258]: "See the perf_event_open(2) man page for a description of these fields. This default means is that the kernel adjusts the rate of sampling so that it's capturing about 4,000 context switch events per second. If you really meant to record them all, use -c 1:"
    - generic [ref=e259]: "# perf record -vv -e context-switches -c 1 /bin/true Using CPUID GenuineIntel-6-55 ------------------------------------------------------------ perf_event_attr: type 1 size 112 config 0x3 { sample_period, sample_freq } 1 sample_type IP|TID|TIME disabled 1 inherit 1 mmap 1 comm 1 enable_on_exec 1"
    - paragraph [ref=e260]: Check the rate of events using perf stat first, so that you can estimate the volume of data you'll be capturing. Sampling a subset by default may be a good thing, especially for high frequency events like context switches.
    - paragraph [ref=e261]: Many other events (like tracepoints) have a default of 1 anyway. You'll encounter a non-1 default for many software and hardware events.
    - heading "5.2. Hardware Events (PMCs)" [level=2] [ref=e262]
    - paragraph [ref=e263]: perf_events began life as a tool for instrumenting the processor's performance monitoring unit (PMU) hardware counters, also called performance monitoring counters (PMCs), or performance instrumentation counters (PICs). These instrument low-level processor activity, for example, CPU cycles, instructions retired, memory stall cycles, level 2 cache misses, etc. Some will be listed as Hardware Cache Events.
    - paragraph [ref=e264]: "PMCs are documented in the Intel 64 and IA-32 Architectures Software Developer's Manual Volume 3B: System Programming Guide, Part 2 and the BIOS and Kernel Developer's Guide (BKDG) For AMD Family 10h Processors. There are thousands of different PMCs available."
    - paragraph [ref=e265]: "A typical processor will implement PMCs in the following way: only a few or several can be recorded at the same time, from the many thousands that are available. This is because they are a fixed hardware resource on the processor (a limited number of registers), and are programmed to begin counting the selected events."
    - paragraph [ref=e266]:
      - text: For examples of using PMCs, see
      - link "CPU Statistics" [ref=e267] [cursor=pointer]:
        - /url: "#CPUstatistics"
      - text: .
    - heading "5.3. Kernel Tracepoints" [level=2] [ref=e268]
    - paragraph [ref=e269]: These tracepoints are hard coded in interesting and logical locations of the kernel, so that higher-level behavior can be easily traced. For example, system calls, TCP events, file system I/O, disk I/O, etc. These are grouped into libraries of tracepoints; eg, "sock:" for socket events, "sched:" for CPU scheduler events. A key value of tracepoints is that they should have a stable API, so if you write tools that use them on one kernel version, they should work on later versions as well.
    - paragraph [ref=e270]: Tracepoints are usually added to kernel code by placing a macro from include/trace/events/*. XXX cover implementation.
    - paragraph [ref=e271]: "Summarizing the tracepoint library names and numbers of tracepoints, on my Linux 4.10 system:"
    - generic [ref=e272]: "# perf list | awk -F: '/Tracepoint event/ { lib[$1]++ } END { for (l in lib) { printf \" %-16.16s %d\\n\", l, lib[l] } }' | sort | column alarmtimer 4 i2c 8 page_isolation 1 swiotlb 1 block 19 iommu 7 pagemap 2 syscalls 614 btrfs 51 irq 5 power 22 task 2 cgroup 9 irq_vectors 22 printk 1 thermal 7 clk 14 jbd2 16 random 15 thermal_power_ 2 cma 2 kmem 12 ras 4 timer 13 compaction 14 libata 6 raw_syscalls 2 tlb 1 cpuhp 3 mce 1 rcu 1 udp 1 dma_fence 8 mdio 1 regmap 15 vmscan 15 exceptions 2 migrate 2 regulator 7 vsyscall 1 ext4 95 mmc 2 rpm 4 workqueue 4 fib 3 module 5 sched 24 writeback 30 fib6 1 mpx 5 scsi 5 x86_fpu 14 filelock 10 msr 3 sdt_node 1 xen 35 filemap 2 napi 1 signal 2 xfs 495 ftrace 1 net 10 skb 3 xhci-hcd 9 gpio 2 nmi 1 sock 2 huge_memory 4 oom 1 spi 7"
    - paragraph [ref=e273]: "These include:"
    - list [ref=e274]:
      - listitem [ref=e275]: "block: block device I/O"
      - listitem [ref=e276]: "ext4: file system operations"
      - listitem [ref=e277]: "kmem: kernel memory allocation events"
      - listitem [ref=e278]: "random: kernel random number generator events"
      - listitem [ref=e279]: "sched: CPU scheduler events"
      - listitem [ref=e280]: "syscalls: system call enter and exits"
      - listitem [ref=e281]: "task: task events"
    - paragraph [ref=e282]:
      - text: It's worth checking the list of tracepoints after every kernel upgrade, to see if any are new. The value of adding them
      - link "has been" [ref=e283] [cursor=pointer]:
        - /url: http://lwn.net/Articles/346470/
      - link "debated" [ref=e284] [cursor=pointer]:
        - /url: http://lwn.net/Articles/346483/
      - text: "from time to time, with it wondered how many people will use them (I do). There is a balance to aim for: I'd include the smallest number of probes that sufficiently covers common needs, and anything unusual or uncommon can be left to dynamic tracing."
    - paragraph [ref=e285]:
      - text: For examples of using tracepoints, see
      - link "Static Kernel Tracing" [ref=e286] [cursor=pointer]:
        - /url: "#StaticKernelTracing"
      - text: .
    - heading "5.4. User-Level Statically Defined Tracing (USDT)" [level=2] [ref=e287]
    - paragraph [ref=e288]:
      - text: Similar to kernel tracepoints, these are hardcoded (usually by placing macros) in the application source at logical and interesting locations, and presented (event name and arguments) as a stable API. Many applications already include tracepoints, added to support
      - link "DTrace" [ref=e289] [cursor=pointer]:
        - /url: dtrace.html
      - text: . However, many of these applications do not compile them in by default on Linux. Often you need to compile the application yourself using a --with-dtrace flag.
    - paragraph [ref=e290]: "For example, compiling USDT events with this version of Node.js:"
    - generic [ref=e291]: "$ sudo apt-get install systemtap-sdt-dev # adds \"dtrace\", used by node build $ wget https://nodejs.org/dist/v4.4.1/node-v4.4.1.tar.gz $ tar xvf node-v4.4.1.tar.gz $ cd node-v4.4.1 $ ./configure --with-dtrace $ make -j 8"
    - paragraph [ref=e292]: "To check that the resulting node binary has probes included:"
    - generic [ref=e293]: "$ readelf -n node Displaying notes found at file offset 0x00000254 with length 0x00000020: Owner Data size Description GNU 0x00000010 NT_GNU_ABI_TAG (ABI version tag) OS: Linux, ABI: 2.6.32 Displaying notes found at file offset 0x00000274 with length 0x00000024: Owner Data size Description GNU 0x00000014 NT_GNU_BUILD_ID (unique build ID bitstring) Build ID: 1e01659b0aecedadf297b2c56c4a2b536ae2308a Displaying notes found at file offset 0x00e70994 with length 0x000003c4: Owner Data size Description stapsdt 0x0000003c NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: gc__start Location: 0x0000000000dc14e4, Base: 0x000000000112e064, Semaphore: 0x000000000147095c Arguments: 4@%esi 4@%edx 8@%rdi stapsdt 0x0000003b NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: gc__done Location: 0x0000000000dc14f4, Base: 0x000000000112e064, Semaphore: 0x000000000147095e Arguments: 4@%esi 4@%edx 8@%rdi stapsdt 0x00000067 NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: http__server__response Location: 0x0000000000dc1894, Base: 0x000000000112e064, Semaphore: 0x0000000001470956 Arguments: 8@%rax 8@-1144(%rbp) -4@-1148(%rbp) -4@-1152(%rbp) stapsdt 0x00000061 NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: net__stream__end Location: 0x0000000000dc1c44, Base: 0x000000000112e064, Semaphore: 0x0000000001470952 Arguments: 8@%rax 8@-1144(%rbp) -4@-1148(%rbp) -4@-1152(%rbp) stapsdt 0x00000068 NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: net__server__connection Location: 0x0000000000dc1ff4, Base: 0x000000000112e064, Semaphore: 0x0000000001470950 Arguments: 8@%rax 8@-1144(%rbp) -4@-1148(%rbp) -4@-1152(%rbp) stapsdt 0x00000060 NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: http__client__response Location: 0x0000000000dc23c5, Base: 0x000000000112e064, Semaphore: 0x000000000147095a Arguments: 8@%rdx 8@-1144(%rbp) -4@%eax -4@-1152(%rbp) stapsdt 0x00000089 NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: http__client__request Location: 0x0000000000dc285e, Base: 0x000000000112e064, Semaphore: 0x0000000001470958 Arguments: 8@%rax 8@%rdx 8@-2184(%rbp) -4@-2188(%rbp) 8@-2232(%rbp) 8@-2240(%rbp) -4@-2192(%rbp) stapsdt 0x00000089 NT_STAPSDT (SystemTap probe descriptors) Provider: node Name: http__server__request Location: 0x0000000000dc2e69, Base: 0x000000000112e064, Semaphore: 0x0000000001470954 Arguments: 8@%r14 8@%rax 8@-4344(%rbp) -4@-4348(%rbp) 8@-4304(%rbp) 8@-4312(%rbp) -4@-4352(%rbp)"
    - paragraph [ref=e294]:
      - text: For examples of using USDT events, see
      - link "Static User Tracing" [ref=e295] [cursor=pointer]:
        - /url: "#StaticUserTracing"
      - text: .
    - heading "5.5. Dynamic Tracing" [level=2] [ref=e296]
    - paragraph [ref=e297]: "The difference between tracepoints and dynamic tracing is shown in the following figure, which illustrates the coverage of common tracepoint libraries:"
    - paragraph [ref=e298]:
      - img [ref=e299]
    - paragraph [ref=e300]: While dynamic tracing can see everything, it's also an unstable interface since it is instrumenting raw code. That means that any dynamic tracing tools you develop may break after a kernel patch or update. Try to use the static tracepoints first, since their interface should be much more stable. They can also be easier to use and understand, since they have been designed with a tracing end-user in mind.
    - paragraph [ref=e301]: One benefit of dynamic tracing is that it can be enabled on a live system without restarting anything. You can take an already-running kernel or application and then begin dynamic instrumentation, which (safely) patches instructions in memory to add instrumentation. That means there is zero overhead or tax for this feature until you begin using it. One moment your binary is running unmodified and at full speed, and the next, it's running some extra instrumentation instructions that you dynamically added. Those instructions should eventually be removed once you've finished using your session of dynamic tracing.
    - paragraph [ref=e302]: The overhead while dynamic tracing is in use, and extra instructions are being executed, is relative to the frequency of instrumented events multiplied by the work done on each instrumentation.
    - paragraph [ref=e303]:
      - text: For examples of using dynamic tracing, see
      - link "6.5. Dynamic Tracing" [ref=e304] [cursor=pointer]:
        - /url: "#DynamicTracingEg"
      - text: .
    - heading "6. Examples" [level=1] [ref=e305]
    - paragraph [ref=e306]: These are some examples of perf_events, collected from a variety of 3.x Linux systems.
    - heading "6.1. CPU Statistics" [level=2] [ref=e307]
    - paragraph [ref=e308]: "The perf stat command instruments and summarizes key CPU counters (PMCs). This is from perf version 3.5.7.2:"
    - generic [ref=e309]: "# perf stat gzip file1 Performance counter stats for 'gzip file1': 1920.159821 task-clock # 0.991 CPUs utilized 13 context-switches # 0.007 K/sec 0 CPU-migrations # 0.000 K/sec 258 page-faults # 0.134 K/sec 5,649,595,479 cycles # 2.942 GHz [83.43%] 1,808,339,931 stalled-cycles-frontend # 32.01% frontend cycles idle [83.54%] 1,171,884,577 stalled-cycles-backend # 20.74% backend cycles idle [66.77%] 8,625,207,199 instructions # 1.53 insns per cycle # 0.21 stalled cycles per insn [83.51%] 1,488,797,176 branches # 775.351 M/sec [82.58%] 53,395,139 branch-misses # 3.59% of all branches [83.78%] 1.936842598 seconds time elapsed"
    - paragraph [ref=e310]: "This includes instructions per cycle (IPC), labled \"insns per cycle\", or in earlier versions, \"IPC\". This is a commonly examined metric, either IPC or its invert, CPI. Higher IPC values mean higher instruction throughput, and lower values indicate more stall cycles. I'd generally interpret high IPC values (eg, over 1.0) as good, indicating optimal processing of work. However, I'd want to double check what the instructions are, in case this is due to a spin loop: a high rate of instructions, but a low rate of actual work completed."
    - paragraph [ref=e311]: "There are some advanced metrics now included in perf stat: frontend cycles idle, backend cycles idle, and stalled cycles per insn. To really understand these, you'll need some knowledge of CPU microarchitecture."
    - heading "CPU Microarchitecture" [level=3] [ref=e312]
    - paragraph [ref=e313]:
      - text: The frontend and backend metrics refer to the CPU pipeline, and are also based on stall counts. The frontend processes CPU instructions, in order. It involves instruction fetch, along with branch prediction, and decode. The decoded instructions become micro-operations (uops) which the backend processes, and it may do so out of order. For a longer summary of these components, see Shannon Cepeda's great posts on
      - link "frontend" [ref=e314] [cursor=pointer]:
        - /url: http://software.intel.com/en-us/blogs/2011/11/22/pipeline-speak-learning-more-about-intel-microarchitecture-codename-sandy-bridge
      - text: and
      - link "backend" [ref=e315] [cursor=pointer]:
        - /url: http://software.intel.com/en-us/blogs/2011/12/01/pipeline-speak-part-2-the-second-part-of-the-sandy-bridge-pipeline
      - text: .
    - paragraph [ref=e316]: The backend can also process multiple uops in parallel; for modern processors, three or four. Along with pipelining, this is how IPC can become greater than one, as more than one instruction can be completed ("retired") per CPU cycle.
    - paragraph [ref=e317]: "Stalled cycles per instruction is similar to IPC (inverted), however, only counting stalled cycles, which will be for memory or resource bus access. This makes it easy to interpret: stalls are latency, reduce stalls. I really like it as a metric, and hope it becomes as commonplace as IPC/CPI. Lets call it SCPI."
    - heading "Detailed Mode" [level=3] [ref=e318]
    - paragraph [ref=e319]: "There is a \"detailed\" mode for perf stat:"
    - generic [ref=e320]: "# perf stat -d gzip file1 Performance counter stats for 'gzip file1': 1610.719530 task-clock # 0.998 CPUs utilized 20 context-switches # 0.012 K/sec 0 CPU-migrations # 0.000 K/sec 258 page-faults # 0.160 K/sec 5,491,605,997 cycles # 3.409 GHz [40.18%] 1,654,551,151 stalled-cycles-frontend # 30.13% frontend cycles idle [40.80%] 1,025,280,350 stalled-cycles-backend # 18.67% backend cycles idle [40.34%] 8,644,643,951 instructions # 1.57 insns per cycle # 0.19 stalled cycles per insn [50.89%] 1,492,911,665 branches # 926.860 M/sec [50.69%] 53,471,580 branch-misses # 3.58% of all branches [51.21%] 1,938,889,736 L1-dcache-loads # 1203.741 M/sec [49.68%] 154,380,395 L1-dcache-load-misses # 7.96% of all L1-dcache hits [49.66%] 0 LLC-loads # 0.000 K/sec [39.27%] 0 LLC-load-misses # 0.00% of all LL-cache hits [39.61%] 1.614165346 seconds time elapsed"
    - paragraph [ref=e321]: This includes additional counters for Level 1 data cache events, and last level cache (LLC) events.
    - heading "Specific Counters" [level=3] [ref=e322]
    - paragraph [ref=e323]: "Hardware cache event counters, seen in perf list, can be instrumented. Eg:"
    - generic [ref=e324]: "# perf list | grep L1-dcache L1-dcache-loads [Hardware cache event] L1-dcache-load-misses [Hardware cache event] L1-dcache-stores [Hardware cache event] L1-dcache-store-misses [Hardware cache event] L1-dcache-prefetches [Hardware cache event] L1-dcache-prefetch-misses [Hardware cache event] # perf stat -e L1-dcache-loads,L1-dcache-load-misses,L1-dcache-stores gzip file1 Performance counter stats for 'gzip file1': 1,947,551,657 L1-dcache-loads 153,829,652 L1-dcache-misses # 7.90% of all L1-dcache hits 1,171,475,286 L1-dcache-stores 1.538038091 seconds time elapsed"
    - paragraph [ref=e325]: The percentage printed is a convenient calculation that perf_events has included, based on the counters I specified. If you include the "cycles" and "instructions" counters, it will include an IPC calculation in the output.
    - paragraph [ref=e326]: These hardware events that can be measured are often specific to the processor model. Many may not be available from within a virtualized environment.
    - heading "Raw Counters" [level=3] [ref=e327]
    - paragraph [ref=e328]: "The Intel 64 and IA-32 Architectures Software Developer's Manual Volume 3B: System Programming Guide, Part 2 and the BIOS and Kernel Developer's Guide (BKDG) For AMD Family 10h Processors are full of interesting counters, but most cannot be found in perf list. If you find one you want to instrument, you can specify it as a raw event with the format: rUUEE, where UU == umask, and EE == event number. Here's an example where I've added a couple of raw counters:"
    - generic [ref=e329]: "# perf stat -e cycles,instructions,r80a2,r2b1 gzip file1 Performance counter stats for 'gzip file1': 5,586,963,328 cycles # 0.000 GHz 8,608,237,932 instructions # 1.54 insns per cycle 9,448,159 raw 0x80a2 11,855,777,803 raw 0x2b1 1.588618969 seconds time elapsed"
    - paragraph [ref=e330]: "If I did this right, then r80a2 has instrumented RESOURCE_STALLS.OTHER, and r2b1 has instrumented UOPS_DISPATCHED.CORE: the number of uops dispatched each cycle. It's easy to mess this up, and you'll want to double check that you are on the right page of the manual for your processor."
    - paragraph [ref=e331]:
      - text: If you do find an awesome raw counter, please
      - link "suggest" [ref=e332] [cursor=pointer]:
        - /url: http://dir.gmane.org/gmane.linux.kernel.perf.user
      - text: it be added as an alias in perf_events, so we all can find it in perf list.
    - heading "Other Options" [level=3] [ref=e333]
    - paragraph [ref=e334]: "The perf subcommands, especially perf stat, have an extensive option set which can be listed using \"-h\". I've included the full output for perf stat here from version 3.9.3, not as a reference, but as an illustration of the interface:"
    - generic [ref=e335]: "# perf stat -h usage: perf stat [<options>] [<command>] -e, --event <event> event selector. use 'perf list' to list available events --filter <filter> event filter -i, --no-inherit child tasks do not inherit counters -p, --pid <pid> stat events on existing process id -t, --tid <tid> stat events on existing thread id -a, --all-cpus system-wide collection from all CPUs -g, --group put the counters into a counter group -c, --scale scale/normalize counters -v, --verbose be more verbose (show counter open errors, etc) -r, --repeat <n> repeat command and print average + stddev (max: 100) -n, --null null run - dont start any counters -d, --detailed detailed run - start a lot of events -S, --sync call sync() before starting a run -B, --big-num print large numbers with thousands' separators -C, --cpu <cpu> list of cpus to monitor in system-wide -A, --no-aggr disable CPU count aggregation -x, --field-separator <separator> print counts with custom separator -G, --cgroup <name> monitor event in cgroup name only -o, --output <file> output file name --append append to the output file --log-fd <n> log output to fd, instead of stderr --pre <command> command to run prior to the measured command --post <command> command to run after to the measured command -I, --interval-print <n> print counts at regular interval in ms (>= 100) --aggr-socket aggregate counts per processor socket"
    - paragraph [ref=e336]: Options such as --repeat, --sync, --pre, and --post can be quite useful when doing automated testing or micro-benchmarking.
    - heading "6.2. Timed Profiling" [level=2] [ref=e337]
    - paragraph [ref=e338]: perf_events can profile CPU usage based on sampling the instruction pointer or stack trace at a fixed interval (timed profiling).
    - paragraph [ref=e339]: "Sampling CPU stacks at 99 Hertz (-F 99), for the entire system (-a, for all CPUs), with stack traces (-g, for call graphs), for 10 seconds:"
    - generic [ref=e340]: "# perf record -F 99 -a -g -- sleep 30 [ perf record: Woken up 9 times to write data ] [ perf record: Captured and wrote 3.135 MB perf.data (~136971 samples) ] # ls -lh perf.data -rw------- 1 root root 3.2M Jan 26 07:26 perf.data"
    - paragraph [ref=e341]: "The choice of 99 Hertz, instead of 100 Hertz, is to avoid accidentally sampling in lockstep with some periodic activity, which would produce skewed results. This is also coarse: you may want to increase that to higher rates (eg, up to 997 Hertz) for finer resolution, especially if you are sampling short bursts of activity and you'd still like enough resolution to be useful. Bear in mind that higher frequencies means higher overhead."
    - paragraph [ref=e342]: "The perf.data file can be processed in a variety of ways. On recent versions, the perf report command launches an ncurses navigator for call graph inspection. Older versions of perf (or if you use --stdio in the new version) print the call graph as a tree, annotated with percentages:"
    - generic [ref=e343]: "# perf report --stdio # ======== # captured on: Mon Jan 26 07:26:40 2014 # hostname : dev2 # os release : 3.8.6-ubuntu-12-opt # perf version : 3.8.6 # arch : x86_64 # nrcpus online : 8 # nrcpus avail : 8 # cpudesc : Intel(R) Xeon(R) CPU X5675 @ 3.07GHz # cpuid : GenuineIntel,6,44,2 # total memory : 8182008 kB # cmdline : /usr/bin/perf record -F 99 -a -g -- sleep 30 # event : name = cpu-clock, type = 1, config = 0x0, config1 = 0x0, config2 = ... # HEADER_CPU_TOPOLOGY info available, use -I to display # HEADER_NUMA_TOPOLOGY info available, use -I to display # pmu mappings: software = 1, breakpoint = 5 # ======== # # Samples: 22K of event 'cpu-clock' # Event count (approx.): 22751 # # Overhead Command Shared Object Symbol # ........ ....... ................. ............................... # 94.12% dd [kernel.kallsyms] [k] _raw_spin_unlock_irqrestore | --- _raw_spin_unlock_irqrestore | |--96.67%-- extract_buf | extract_entropy_user | urandom_read | vfs_read | sys_read | system_call_fastpath | read | |--1.69%-- account | | | |--99.72%-- extract_entropy_user | | urandom_read | | vfs_read | | sys_read | | system_call_fastpath | | read | --0.28%-- [...] | |--1.60%-- mix_pool_bytes.constprop.17 [...]"
    - paragraph [ref=e344]: This tree starts with the on-CPU functions and works back through the ancestry. This approach is called a "callee based call graph". This can be flipped by using -G for an "inverted call graph", or by using the "caller" option to -g/--call-graph, instead of the "callee" default.
    - paragraph [ref=e345]: "The hottest (most frequent) stack trace in this perf call graph occurred in 90.99% of samples, which is the product of the overhead percentage and top stack leaf (94.12% x 96.67%, which are relative rates). perf report can also be run with \"-g graph\" to show absolute overhead rates, in which case \"90.99%\" is directly displayed on the stack leaf:"
    - generic [ref=e346]: 94.12% dd [kernel.kallsyms] [k] _raw_spin_unlock_irqrestore | --- _raw_spin_unlock_irqrestore | |--90.99%-- extract_buf [...]
    - paragraph [ref=e347]:
      - text: If user-level stacks look incomplete, you can try perf record with "--call-graph dwarf" as a different technique to unwind them. See the
      - link "Stacks" [ref=e348] [cursor=pointer]:
        - /url: "#StackTraces"
      - text: section.
    - paragraph [ref=e349]:
      - text: The output from perf report can be many pages long, which can become cumbersome to read. Try generating
      - link "Flame Graphs" [ref=e350] [cursor=pointer]:
        - /url: "#FlameGraphs"
      - text: from the same data.
    - heading "6.3. Event Profiling" [level=2] [ref=e351]
    - paragraph [ref=e352]: "Apart from sampling at a timed interval, taking samples triggered by CPU hardware counters is another form of CPU profiling, which can be used to shed more light on cache misses, memory stall cycles, and other low-level processor events. The available events can be found using perf list:"
    - generic [ref=e353]: "# perf list | grep Hardware cpu-cycles OR cycles [Hardware event] instructions [Hardware event] cache-references [Hardware event] cache-misses [Hardware event] branch-instructions OR branches [Hardware event] branch-misses [Hardware event] bus-cycles [Hardware event] stalled-cycles-frontend OR idle-cycles-frontend [Hardware event] stalled-cycles-backend OR idle-cycles-backend [Hardware event] ref-cycles [Hardware event] L1-dcache-loads [Hardware cache event] L1-dcache-load-misses [Hardware cache event] L1-dcache-stores [Hardware cache event] L1-dcache-store-misses [Hardware cache event] [...]"
    - paragraph [ref=e354]: For many of these, gathering a stack on every occurrence would induce far too much overhead, and would slow down the system and change the performance characteristics of the target. It's usually sufficient to only instrument a small fraction of their occurrences, rather than all of them. This can be done by specifying a threshold for triggering event collection, using "-c" and a count.
    - paragraph [ref=e355]: "For example, the following one-liner instruments Level 1 data cache load misses, collecting a stack trace for one in every 10,000 occurrences:"
    - generic [ref=e356]: "# perf record -e L1-dcache-load-misses -c 10000 -ag -- sleep 5"
    - paragraph [ref=e357]: The mechanics of "-c count" are implemented by the processor, which only interrupts the kernel when the threshold has been reached.
    - paragraph [ref=e358]: See the earlier Raw Counters section for an example of specifying a custom counter, and the next section about skew.
    - heading "Skew and PEBS" [level=3] [ref=e359]
    - paragraph [ref=e360]:
      - text: "There's a problem with event profiling that you don't really encounter with CPU profiling (timed sampling). With timed sampling, it doesn't matter if there was a small sub-microsecond delay between the interrupt and reading the instruction pointer (IP). Some CPU profilers introduce this jitter on purpose, as another way to avoid lockstep sampling. But for event profiling, it does matter: if you're trying to capture the IP on some PMC event, and there's a delay between the PMC overflow and capturing the IP, then the IP will point to the wrong address. This is skew. Another contributing problem is that micro-ops are processed in parallel and out-of-order, while the instruction pointer points to the resumption instruction, not the instruction that caused the event. I've talked about this"
      - link "before" [ref=e361] [cursor=pointer]:
        - /url: https://www.slideshare.net/brendangregg/scale2015-linux-perfprofiling/63
      - text: .
    - paragraph [ref=e362]:
      - text: The solution is "precise sampling", which on Intel is PEBS (Precise Event-Based Sampling), and on AMD it is IBS (Instruction-Based Sampling). These use CPU hardware support to capture the real state of the CPU at the time of the event. perf can use precise sampling by adding a :p modifier to the PMC event name, eg, "-e instructions:p". The more p's, the more accurate. Here are the docs from
      - link "tools/perf/Documentation/perf-list.txt" [ref=e363] [cursor=pointer]:
        - /url: https://github.com/torvalds/linux/blob/master/tools/perf/Documentation/perf-list.txt
      - text: ":"
    - generic [ref=e364]: "The 'p' modifier can be used for specifying how precise the instruction address should be. The 'p' modifier can be specified multiple times: 0 - SAMPLE_IP can have arbitrary skid 1 - SAMPLE_IP must have constant skid 2 - SAMPLE_IP requested to have 0 skid 3 - SAMPLE_IP must have 0 skid"
    - paragraph [ref=e365]: In some cases, perf will default to using precise sampling without you needing to specify it. Run "perf record -vv ..." to see the value of "precise_ip". Also note that only some PMCs support PEBS.
    - paragraph [ref=e366]: "If PEBS isn't working at all for you, check dmesg:"
    - generic [ref=e367]: "# dmesg | grep -i pebs [ 0.387014] Performance Events: PEBS fmt1+, SandyBridge events, 16-deep LBR, full-width counters, Intel PMU driver. [ 0.387034] core: PEBS disabled due to CPU errata, please upgrade microcode"
    - paragraph [ref=e368]: "The fix (on Intel):"
    - generic [ref=e369]: "# apt-get install -y intel-microcode [...] intel-microcode: microcode will be updated at next boot Processing triggers for initramfs-tools (0.125ubuntu5) ... update-initramfs: Generating /boot/initrd.img-4.8.0-41-generic # reboot (system reboots) # dmesg | grep -i pebs [ 0.386596] Performance Events: PEBS fmt1+, SandyBridge events, 16-deep LBR, full-width counters, Intel PMU driver. #"
    - paragraph [ref=e370]: "XXX: Need to cover more PEBS problems and other caveats."
    - heading "6.4. Static Kernel Tracing" [level=2] [ref=e371]
    - paragraph [ref=e372]: "The following examples demonstrate static tracing: the instrumentation of tracepoints and other static events."
    - heading "Counting Syscalls" [level=3] [ref=e373]
    - paragraph [ref=e374]: "The following simple one-liner counts system calls for the executed command, and prints a summary (of non-zero counts):"
    - generic [ref=e375]: "# perf stat -e 'syscalls:sys_enter_*' gzip file1 2>&1 | awk '$1 != 0' Performance counter stats for 'gzip file1': 1 syscalls:sys_enter_utimensat 1 syscalls:sys_enter_unlink 5 syscalls:sys_enter_newfstat 1,603 syscalls:sys_enter_read 3,201 syscalls:sys_enter_write 5 syscalls:sys_enter_access 1 syscalls:sys_enter_fchmod 1 syscalls:sys_enter_fchown 6 syscalls:sys_enter_open 9 syscalls:sys_enter_close 8 syscalls:sys_enter_mprotect 1 syscalls:sys_enter_brk 1 syscalls:sys_enter_munmap 1 syscalls:sys_enter_set_robust_list 1 syscalls:sys_enter_futex 1 syscalls:sys_enter_getrlimit 5 syscalls:sys_enter_rt_sigprocmask 14 syscalls:sys_enter_rt_sigaction 1 syscalls:sys_enter_exit_group 1 syscalls:sys_enter_set_tid_address 14 syscalls:sys_enter_mmap 1.543990940 seconds time elapsed"
    - paragraph [ref=e376]: In this case, a gzip command was analyzed. The report shows that there were 3,201 write() syscalls, and half that number of read() syscalls. Many of the other syscalls will be due to process and library initialization.
    - paragraph [ref=e377]: A similar report can be seen using strace -c, the system call tracer, however it may induce much higher overhead than perf, as perf buffers data in-kernel.
    - heading "perf vs strace" [level=3] [ref=e378]
    - paragraph [ref=e379]: "To explain the difference a little further: the current implementation of strace uses ptrace(2) to attach to the target process and stop it during system calls, like a debugger. This is violent, and can cause serious overhead. To demonstrate this, the following syscall-heavy program was run by itself, with perf, and with strace. I've only included the line of output that shows its performance:"
    - generic [ref=e380]: "# dd if=/dev/zero of=/dev/null bs=512 count=10000k 5242880000 bytes (5.2 GB) copied, 3.53031 s, 1.5 GB/s # perf stat -e 'syscalls:sys_enter_*' dd if=/dev/zero of=/dev/null bs=512 count=10000k 5242880000 bytes (5.2 GB) copied, 9.14225 s, 573 MB/s # strace -c dd if=/dev/zero of=/dev/null bs=512 count=10000k 5242880000 bytes (5.2 GB) copied, 218.915 s, 23.9 MB/s"
    - paragraph [ref=e381]:
      - text: With perf, the program ran 2.5x slower. But
      - generic [ref=e382]: with strace, it ran 62x slower
      - text: ". That's likely to be a worst-case result: if syscalls are not so frequent, the difference between the tools will not be as great."
    - paragraph [ref=e383]: Recent version of perf have included a trace subcommand, to provide some similar functionality to strace, but with much lower overhead.
    - heading "New Processes" [level=3] [ref=e384]
    - paragraph [ref=e385]: "Tracing new processes triggered by a \"man ls\":"
    - generic [ref=e386]: "# perf record -e sched:sched_process_exec -a ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.064 MB perf.data (~2788 samples) ] # perf report -n --sort comm --stdio [...] # Overhead Samples Command # ........ ............ ....... # 11.11% 1 troff 11.11% 1 tbl 11.11% 1 preconv 11.11% 1 pager 11.11% 1 nroff 11.11% 1 man 11.11% 1 locale 11.11% 1 grotty 11.11% 1 groff"
    - paragraph [ref=e387]: Nine different commands were executed, each once. I used -n to print the "Samples" column, and "--sort comm" to customize the remaining columns.
    - paragraph [ref=e388]: "This works by tracing sched:sched_process_exec, when a process runs exec() to execute a different binary. This is often how new processes are created, but not always. An application may fork() to create a pool of worker processes, but not exec() a different binary. An application may also reexec: call exec() again, on itself, usually to clean up its address space. In that case, it's will be seen by this exec tracepoint, but it's not a new process."
    - paragraph [ref=e389]: The sched:sched_process_fork tracepoint can be traced to only catch new processes, created via fork(). The downside is that the process identified is the parent, not the new target, as the new process has yet to exec() it's final program.
    - heading "Outbound Connections" [level=3] [ref=e390]
    - paragraph [ref=e391]: There can be times when it's useful to double check what network connections are initiated by a server, from which processes, and why. You might be surprised. These connections can be important to understand, as they can be a source of latency.
    - paragraph [ref=e392]: For this example, I have a completely idle ubuntu server, and while tracing I'll login to it using ssh. I'm going to trace outbound connections via the connect() syscall. Given that I'm performing an inbound connection over SSH, will there be any outbound connections at all?
    - generic [ref=e393]: "# perf record -e syscalls:sys_enter_connect -a ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.057 MB perf.data (~2489 samples) ] # perf report --stdio # ======== # captured on: Tue Jan 28 10:53:38 2014 # hostname : ubuntu # os release : 3.5.0-23-generic # perf version : 3.5.7.2 # arch : x86_64 # nrcpus online : 2 # nrcpus avail : 2 # cpudesc : Intel(R) Core(TM) i7-3820QM CPU @ 2.70GHz # cpuid : GenuineIntel,6,58,9 # total memory : 1011932 kB # cmdline : /usr/bin/perf_3.5.0-23 record -e syscalls:sys_enter_connect -a # event : name = syscalls:sys_enter_connect, type = 2, config = 0x38b, ... # HEADER_CPU_TOPOLOGY info available, use -I to display # HEADER_NUMA_TOPOLOGY info available, use -I to display # ======== # # Samples: 21 of event 'syscalls:sys_enter_connect' # Event count (approx.): 21 # # Overhead Command Shared Object Symbol # ........ ....... .................. ........................... # 52.38% sshd libc-2.15.so [.] __GI___connect_internal 19.05% groups libc-2.15.so [.] __GI___connect_internal 9.52% sshd libpthread-2.15.so [.] __connect_internal 9.52% mesg libc-2.15.so [.] __GI___connect_internal 9.52% bash libc-2.15.so [.] __GI___connect_internal"
    - paragraph [ref=e394]: The report shows that sshd, groups, mesg, and bash are all performing connect() syscalls. Ring a bell?
    - paragraph [ref=e395]: "The stack traces that led to the connect() can explain why:"
    - generic [ref=e396]: "# perf record -e syscalls:sys_enter_connect -ag ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.057 MB perf.data (~2499 samples) ] # perf report --stdio [...] 55.00% sshd libc-2.15.so [.] __GI___connect_internal | --- __GI___connect_internal | |--27.27%-- add_one_listen_addr.isra.0 | |--27.27%-- __nscd_get_mapping | __nscd_get_map_ref | |--27.27%-- __nscd_open_socket --18.18%-- [...] 20.00% groups libc-2.15.so [.] __GI___connect_internal | --- __GI___connect_internal | |--50.00%-- __nscd_get_mapping | __nscd_get_map_ref | --50.00%-- __nscd_open_socket 10.00% mesg libc-2.15.so [.] __GI___connect_internal | --- __GI___connect_internal | |--50.00%-- __nscd_get_mapping | __nscd_get_map_ref | --50.00%-- __nscd_open_socket 10.00% bash libc-2.15.so [.] __GI___connect_internal | --- __GI___connect_internal | |--50.00%-- __nscd_get_mapping | __nscd_get_map_ref | --50.00%-- __nscd_open_socket 5.00% sshd libpthread-2.15.so [.] __connect_internal | --- __connect_internal"
    - paragraph [ref=e397]:
      - text: "Ah, these are nscd calls: the name service cache daemon. If you see hexadecimal numbers and not function names, you will need to install debug info: see the earlier section on"
      - link "Symbols" [ref=e398] [cursor=pointer]:
        - /url: "#Symbols"
      - text: . These nscd calls are likely triggered by calling getaddrinfo(), which server software may be using to resolve IP addresses for logging, or for matching hostnames in config files. Browsing the stack traces should identify why.
    - paragraph [ref=e399]:
      - text: "For sshd, this was called via add_one_listen_addr(): a name that was only visible after adding the openssh-server-dbgsym package. Unfortunately, the stack trace doesn't continue after add_one_listen_add(). I can browse the OpenSSH code to figure out the reasons we're calling into add_one_listen_add(), or, I can get the stack traces to work. See the earlier section on"
      - link "Stack Traces" [ref=e400] [cursor=pointer]:
        - /url: "#StackTraces"
      - text: .
    - paragraph [ref=e401]: I took a quick look at the OpenSSH code, and it looks like this code-path is due to parsing ListenAddress from the sshd_config file, which can contain either an IP address or a hostname.
    - heading "Socket Buffers" [level=3] [ref=e402]
    - paragraph [ref=e403]: Tracing the consumption of socket buffers, and the stack traces, is one way to identify what is leading to socket or network I/O.
    - generic [ref=e404]: "# perf record -e 'skb:consume_skb' -ag ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.065 MB perf.data (~2851 samples) ] # perf report [...] 74.42% swapper [kernel.kallsyms] [k] consume_skb | --- consume_skb arp_process arp_rcv __netif_receive_skb_core __netif_receive_skb netif_receive_skb virtnet_poll net_rx_action __do_softirq irq_exit do_IRQ ret_from_intr default_idle cpu_idle start_secondary 25.58% sshd [kernel.kallsyms] [k] consume_skb | --- consume_skb dev_kfree_skb_any free_old_xmit_skbs.isra.24 start_xmit dev_hard_start_xmit sch_direct_xmit dev_queue_xmit ip_finish_output ip_output ip_local_out ip_queue_xmit tcp_transmit_skb tcp_write_xmit __tcp_push_pending_frames tcp_sendmsg inet_sendmsg sock_aio_write do_sync_write vfs_write sys_write system_call_fastpath __write_nocancel"
    - paragraph [ref=e405]: The swapper stack shows the network receive path, triggered by an interrupt. The sshd path shows writes.
    - heading "6.5. Static User Tracing" [level=2] [ref=e406]
    - paragraph [ref=e407]: "Support was added in later 4.x series kernels. The following demonstrates Linux 4.10 (with an additional patchset), and tracing the Node.js USDT probes:"
    - generic [ref=e408]: "# perf buildid-cache --add `which node` # perf list | grep sdt_node sdt_node:gc__done [SDT event] sdt_node:gc__start [SDT event] sdt_node:http__client__request [SDT event] sdt_node:http__client__response [SDT event] sdt_node:http__server__request [SDT event] sdt_node:http__server__response [SDT event] sdt_node:net__server__connection [SDT event] sdt_node:net__stream__end [SDT event] # perf record -e sdt_node:http__server__request -a ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.446 MB perf.data (3 samples) ] # perf script node 7646 [002] 361.012364: sdt_node:http__server__request: (dc2e69) node 7646 [002] 361.204718: sdt_node:http__server__request: (dc2e69) node 7646 [002] 361.363043: sdt_node:http__server__request: (dc2e69)"
    - paragraph [ref=e409]: XXX fill me in, including how to use arguments.
    - paragraph [ref=e410]:
      - text: If you are on an older kernel, say, Linux 4.4-4.9, you can probably get these to work with adjustments (I've even hacked them up with
      - link "ftrace" [ref=e411] [cursor=pointer]:
        - /url: http://www.brendangregg.com/blog/2015-07-03/hacking-linux-usdt-ftrace.html
      - text: for older kernels), but since they have been in development, I haven't seen documentation outside of lkml, so you'll need to figure it out. (On this kernel range, you might find more documentation for tracing these with
      - link "bcc/eBPF" [ref=e412] [cursor=pointer]:
        - /url: ebpf.html#bcc
      - text: ", including using the trace.py tool.)"
    - heading "6.6. Dynamic Tracing" [level=2] [ref=e413]
    - paragraph [ref=e414]: For kernel analysis, I'm using CONFIG_KPROBES=y and CONFIG_KPROBE_EVENTS=y, to enable kernel dynamic tracing, and CONFIG_FRAME_POINTER=y, for frame pointer-based kernel stacks. For user-level analysis, CONFIG_UPROBES=y and CONFIG_UPROBE_EVENTS=y, for user-level dynamic tracing.
    - 'heading "Kernel: tcp_sendmsg()" [level=3] [ref=e415]'
    - paragraph [ref=e416]: "This example shows instrumenting the kernel tcp_sendmsg() function on the Linux 3.9.3 kernel:"
    - generic [ref=e417]: "# perf probe --add tcp_sendmsg Failed to find path of kernel module. Added new event: probe:tcp_sendmsg (on tcp_sendmsg) You can now use it in all perf tools, such as: perf record -e probe:tcp_sendmsg -aR sleep 1"
    - paragraph [ref=e418]: "This adds a new tracepoint event. It suggests using the -R option, to collect raw sample records, which is already the default for tracepoints. Tracing this event for 5 seconds, recording stack traces:"
    - generic [ref=e419]: "# perf record -e probe:tcp_sendmsg -a -g -- sleep 5 [ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.228 MB perf.data (~9974 samples) ]"
    - paragraph [ref=e420]: "And the report:"
    - generic [ref=e421]: "# perf report --stdio # ======== # captured on: Fri Jan 31 20:10:14 2014 # hostname : pgbackup # os release : 3.9.3-ubuntu-12-opt # perf version : 3.9.3 # arch : x86_64 # nrcpus online : 8 # nrcpus avail : 8 # cpudesc : Intel(R) Xeon(R) CPU E5-2670 0 @ 2.60GHz # cpuid : GenuineIntel,6,45,7 # total memory : 8179104 kB # cmdline : /lib/modules/3.9.3/build/tools/perf/perf record -e probe:tcp_sendmsg -a -g -- sleep 5 # event : name = probe:tcp_sendmsg, type = 2, config = 0x3b2, config1 = 0x0, config2 = 0x0, ... # HEADER_CPU_TOPOLOGY info available, use -I to display # HEADER_NUMA_TOPOLOGY info available, use -I to display # pmu mappings: software = 1, tracepoint = 2, breakpoint = 5 # ======== # # Samples: 12 of event 'probe:tcp_sendmsg' # Event count (approx.): 12 # # Overhead Command Shared Object Symbol # ........ ....... ................. ............... # 100.00% sshd [kernel.kallsyms] [k] tcp_sendmsg | --- tcp_sendmsg sock_aio_write do_sync_write vfs_write sys_write system_call_fastpath __write_nocancel | |--8.33%-- 0x50f00000001b810 --91.67%-- [...]"
    - paragraph [ref=e422]: This shows the path from the write() system call to tcp_sendmsg().
    - paragraph [ref=e423]: You can delete these dynamic tracepoints if you want after use, using perf probe --del.
    - 'heading "Kernel: tcp_sendmsg() with size" [level=3] [ref=e424]'
    - paragraph [ref=e425]: If your kernel has debuginfo (CONFIG_DEBUG_INFO=y), you can fish out kernel variables from functions. This is a simple example of examining a size_t (integer), on Linux 3.13.1.
    - paragraph [ref=e426]: "Listing variables available for tcp_sendmsg():"
    - generic [ref=e427]: "# perf probe -V tcp_sendmsg Available variables at tcp_sendmsg @<tcp_sendmsg+0> size_t size struct kiocb* iocb struct msghdr* msg struct sock* sk"
    - paragraph [ref=e428]: "Creating a probe for tcp_sendmsg() with the \"size\" variable:"
    - generic [ref=e429]: "# perf probe --add 'tcp_sendmsg size' Added new event: probe:tcp_sendmsg (on tcp_sendmsg with size) You can now use it in all perf tools, such as: perf record -e probe:tcp_sendmsg -aR sleep 1"
    - paragraph [ref=e430]: "Tracing this probe:"
    - generic [ref=e431]: "# perf record -e probe:tcp_sendmsg -a ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.052 MB perf.data (~2252 samples) ] # perf script # ======== # captured on: Fri Jan 31 23:49:55 2014 # hostname : dev1 # os release : 3.13.1-ubuntu-12-opt # perf version : 3.13.1 # arch : x86_64 # nrcpus online : 2 # nrcpus avail : 2 # cpudesc : Intel(R) Xeon(R) CPU E5645 @ 2.40GHz # cpuid : GenuineIntel,6,44,2 # total memory : 1796024 kB # cmdline : /usr/bin/perf record -e probe:tcp_sendmsg -a # event : name = probe:tcp_sendmsg, type = 2, config = 0x1dd, config1 = 0x0, config2 = ... # HEADER_CPU_TOPOLOGY info available, use -I to display # HEADER_NUMA_TOPOLOGY info available, use -I to display # pmu mappings: software = 1, tracepoint = 2, breakpoint = 5 # ======== # sshd 1301 [001] 502.424719: probe:tcp_sendmsg: (ffffffff81505d80) size=b0 sshd 1301 [001] 502.424814: probe:tcp_sendmsg: (ffffffff81505d80) size=40 sshd 2371 [000] 502.952590: probe:tcp_sendmsg: (ffffffff81505d80) size=27 sshd 2372 [000] 503.025023: probe:tcp_sendmsg: (ffffffff81505d80) size=3c0 sshd 2372 [001] 503.203776: probe:tcp_sendmsg: (ffffffff81505d80) size=98 sshd 2372 [001] 503.281312: probe:tcp_sendmsg: (ffffffff81505d80) size=2d0 sshd 2372 [001] 503.461358: probe:tcp_sendmsg: (ffffffff81505d80) size=30 sshd 2372 [001] 503.670239: probe:tcp_sendmsg: (ffffffff81505d80) size=40 sshd 2372 [001] 503.742565: probe:tcp_sendmsg: (ffffffff81505d80) size=140 sshd 2372 [001] 503.822005: probe:tcp_sendmsg: (ffffffff81505d80) size=20 sshd 2371 [000] 504.118728: probe:tcp_sendmsg: (ffffffff81505d80) size=30 sshd 2371 [000] 504.192575: probe:tcp_sendmsg: (ffffffff81505d80) size=70 [...]"
    - paragraph [ref=e432]: The size is shown as hexadecimal.
    - 'heading "Kernel: tcp_sendmsg() line number and local variable" [level=3] [ref=e433]'
    - paragraph [ref=e434]: "With debuginfo, perf_events can create tracepoints for lines within kernel functions. Listing available line probes for tcp_sendmsg():"
    - generic [ref=e435]: "# perf probe -L tcp_sendmsg <tcp_sendmsg@/mnt/src/linux-3.14.5/net/ipv4/tcp.c:0> 0 int tcp_sendmsg(struct kiocb *iocb, struct sock *sk, struct msghdr *msg, size_t size) 2 { struct iovec *iov; struct tcp_sock *tp = tcp_sk(sk); struct sk_buff *skb; 6 int iovlen, flags, err, copied = 0; 7 int mss_now = 0, size_goal, copied_syn = 0, offset = 0; bool sg; long timeo; [...] 79 while (seglen > 0) { int copy = 0; 81 int max = size_goal; skb = tcp_write_queue_tail(sk); 84 if (tcp_send_head(sk)) { 85 if (skb->ip_summed == CHECKSUM_NONE) max = mss_now; 87 copy = max - skb->len; } 90 if (copy <= 0) { new_segment: [...]"
    - paragraph [ref=e436]: "This is Linux 3.14.5; your kernel version may look different. Lets check what variables are available on line 81:"
    - generic [ref=e437]: "# perf probe -V tcp_sendmsg:81 Available variables at tcp_sendmsg:81 @<tcp_sendmsg+537> bool sg int copied int copied_syn int flags int mss_now int offset int size_goal long int timeo size_t seglen struct iovec* iov struct sock* sk unsigned char* from"
    - paragraph [ref=e438]: "Now lets trace line 81, with the seglen variable that is checked in the loop:"
    - generic [ref=e439]: "# perf probe --add 'tcp_sendmsg:81 seglen' Added new event: probe:tcp_sendmsg (on tcp_sendmsg:81 with seglen) You can now use it in all perf tools, such as: perf record -e probe:tcp_sendmsg -aR sleep 1 # perf record -e probe:tcp_sendmsg -a ^C[ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.188 MB perf.data (~8200 samples) ] # perf script sshd 4652 [001] 2082360.931086: probe:tcp_sendmsg: (ffffffff81642ca9) seglen=0x80 app_plugin.pl 2400 [001] 2082360.970489: probe:tcp_sendmsg: (ffffffff81642ca9) seglen=0x20 postgres 2422 [000] 2082360.970703: probe:tcp_sendmsg: (ffffffff81642ca9) seglen=0x52 app_plugin.pl 2400 [000] 2082360.970890: probe:tcp_sendmsg: (ffffffff81642ca9) seglen=0x7b postgres 2422 [001] 2082360.971099: probe:tcp_sendmsg: (ffffffff81642ca9) seglen=0xb app_plugin.pl 2400 [000] 2082360.971140: probe:tcp_sendmsg: (ffffffff81642ca9) seglen=0x55 [...]"
    - paragraph [ref=e440]: This is pretty amazing. Remember that you can also include in-kernel filtering using --filter, to match only the data you want.
    - 'heading "User: malloc()" [level=3] [ref=e441]'
    - paragraph [ref=e442]: While this is an interesting example, I want to say right off the bat that malloc() calls are very frequent, so you will need to consider the overheads of tracing calls like this.
    - paragraph [ref=e443]: "Adding a libc malloc() probe:"
    - generic [ref=e444]: "# perf probe -x /lib/x86_64-linux-gnu/libc-2.15.so --add malloc Added new event: probe_libc:malloc (on 0x82f20) You can now use it in all perf tools, such as: perf record -e probe_libc:malloc -aR sleep 1"
    - paragraph [ref=e445]: "Tracing it system-wide:"
    - generic [ref=e446]: "# perf record -e probe_libc:malloc -a ^C[ perf record: Woken up 12 times to write data ] [ perf record: Captured and wrote 3.522 MB perf.data (~153866 samples) ]"
    - paragraph [ref=e447]: "The report:"
    - generic [ref=e448]: "# perf report -n [...] # Samples: 45K of event 'probe_libc:malloc' # Event count (approx.): 45158 # # Overhead Samples Command Shared Object Symbol # ........ ............ ............... ............. .......... # 42.72% 19292 apt-config libc-2.15.so [.] malloc 19.71% 8902 grep libc-2.15.so [.] malloc 7.88% 3557 sshd libc-2.15.so [.] malloc 6.25% 2824 sed libc-2.15.so [.] malloc 6.06% 2738 which libc-2.15.so [.] malloc 4.12% 1862 update-motd-upd libc-2.15.so [.] malloc 3.72% 1680 stat libc-2.15.so [.] malloc 1.68% 758 login libc-2.15.so [.] malloc 1.21% 546 run-parts libc-2.15.so [.] malloc 1.21% 545 ls libc-2.15.so [.] malloc 0.80% 360 dircolors libc-2.15.so [.] malloc 0.56% 252 tr libc-2.15.so [.] malloc 0.54% 242 top libc-2.15.so [.] malloc 0.49% 222 irqbalance libc-2.15.so [.] malloc 0.44% 200 dpkg libc-2.15.so [.] malloc 0.38% 173 lesspipe libc-2.15.so [.] malloc 0.29% 130 update-motd-fsc libc-2.15.so [.] malloc 0.25% 112 uname libc-2.15.so [.] malloc 0.24% 108 cut libc-2.15.so [.] malloc 0.23% 104 groups libc-2.15.so [.] malloc 0.21% 94 release-upgrade libc-2.15.so [.] malloc 0.18% 82 00-header libc-2.15.so [.] malloc 0.14% 62 mesg libc-2.15.so [.] malloc 0.09% 42 update-motd-reb libc-2.15.so [.] malloc 0.09% 40 date libc-2.15.so [.] malloc 0.08% 35 bash libc-2.15.so [.] malloc 0.08% 35 basename libc-2.15.so [.] malloc 0.08% 34 dirname libc-2.15.so [.] malloc 0.06% 29 sh libc-2.15.so [.] malloc 0.06% 26 99-footer libc-2.15.so [.] malloc 0.05% 24 cat libc-2.15.so [.] malloc 0.04% 18 expr libc-2.15.so [.] malloc 0.04% 17 rsyslogd libc-2.15.so [.] malloc 0.03% 12 stty libc-2.15.so [.] malloc 0.00% 1 cron libc-2.15.so [.] malloc"
    - paragraph [ref=e449]: This shows the most malloc() calls were by apt-config, while I was tracing.
    - 'heading "User: malloc() with size" [level=3] [ref=e450]'
    - paragraph [ref=e451]: "As of the Linux 3.13.1 kernel, this is not supported yet:"
    - generic [ref=e452]: "# perf probe -x /lib/x86_64-linux-gnu/libc-2.15.so --add 'malloc size' Debuginfo-analysis is not yet supported with -x/--exec option. Error: Failed to add events. (-38)"
    - paragraph [ref=e453]: "As a workaround, you can access the registers (on Linux 3.7+). For example, on x86_64:"
    - generic [ref=e454]: "# perf probe -x /lib64/libc-2.17.so '--add=malloc size=%di' probe_libc:malloc (on 0x800c0 with size=%di)"
    - paragraph [ref=e455]:
      - text: These registers ("%di" etc) are dependent on your processor architecture. To figure out which ones to use, see the
      - link "X86 calling conventions" [ref=e456] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/X86_calling_conventions#System_V_AMD64_ABI
      - text: on Wikipedia, or page 24 of the
      - link "AMD64 ABI" [ref=e457] [cursor=pointer]:
        - /url: http://x86-64.org/documentation/abi.pdf
      - text: (PDF). (Thanks Jose E. Nunez for digging out these references.)
    - heading "6.7. Scheduler Analysis" [level=2] [ref=e458]
    - paragraph [ref=e459]: The perf sched subcommand provides a number of tools for analyzing kernel CPU scheduler behavior. You can use this to identify and quantify issues of scheduler latency.
    - paragraph [ref=e460]: "The current overhead of this tool (as of up to Linux 4.10) may be noticeable, as it instruments and dumps scheduler events to the perf.data file for later analysis. For example:"
    - generic [ref=e461]: "# perf sched record -- sleep 1 [ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 1.886 MB perf.data (13502 samples) ]"
    - paragraph [ref=e462]: "That's 1.9 Mbytes for one second, including 13,502 samples. The size and rate will be relative to your workload and number of CPUs (this example is an 8 CPU server running a software build). How this is written to the file system has been optimized: it only woke up one time to read the event buffers and write them to disk, which greatly reduces overhead. That said, there are still significant overheads with instrumenting all scheduler events and writing event data to the file system. These events:"
    - generic [ref=e463]: "# perf script --header # ======== # captured on: Sun Feb 26 19:40:00 2017 # hostname : bgregg-xenial # os release : 4.10-virtual # perf version : 4.10 # arch : x86_64 # nrcpus online : 8 # nrcpus avail : 8 # cpudesc : Intel(R) Xeon(R) CPU E5-2680 v2 @ 2.80GHz # cpuid : GenuineIntel,6,62,4 # total memory : 15401700 kB # cmdline : /usr/bin/perf sched record -- sleep 1 # event : name = sched:sched_switch, , id = { 2752, 2753, 2754, 2755, 2756, 2757, 2758, 2759 }, type = 2, size = 11... # event : name = sched:sched_stat_wait, , id = { 2760, 2761, 2762, 2763, 2764, 2765, 2766, 2767 }, type = 2, size =... # event : name = sched:sched_stat_sleep, , id = { 2768, 2769, 2770, 2771, 2772, 2773, 2774, 2775 }, type = 2, size ... # event : name = sched:sched_stat_iowait, , id = { 2776, 2777, 2778, 2779, 2780, 2781, 2782, 2783 }, type = 2, size... # event : name = sched:sched_stat_runtime, , id = { 2784, 2785, 2786, 2787, 2788, 2789, 2790, 2791 }, type = 2, siz... # event : name = sched:sched_process_fork, , id = { 2792, 2793, 2794, 2795, 2796, 2797, 2798, 2799 }, type = 2, siz... # event : name = sched:sched_wakeup, , id = { 2800, 2801, 2802, 2803, 2804, 2805, 2806, 2807 }, type = 2, size = 11... # event : name = sched:sched_wakeup_new, , id = { 2808, 2809, 2810, 2811, 2812, 2813, 2814, 2815 }, type = 2, size ... # event : name = sched:sched_migrate_task, , id = { 2816, 2817, 2818, 2819, 2820, 2821, 2822, 2823 }, type = 2, siz... # HEADER_CPU_TOPOLOGY info available, use -I to display # HEADER_NUMA_TOPOLOGY info available, use -I to display # pmu mappings: breakpoint = 5, power = 7, software = 1, tracepoint = 2, msr = 6 # HEADER_CACHE info available, use -I to display # missing features: HEADER_BRANCH_STACK HEADER_GROUP_DESC HEADER_AUXTRACE HEADER_STAT # ======== # perf 16984 [005] 991962.879966: sched:sched_wakeup: comm=perf pid=16999 prio=120 target_cpu=005 [...]"
    - paragraph [ref=e464]:
      - text: If overhead is a problem, you can use my
      - link "eBPF/bcc Tools" [ref=e465] [cursor=pointer]:
        - /url: ebpf.html#bcc
      - text: including runqlat and runqlen which use in-kernel summaries of scheduler events, reducing overhead further. An advantage of perf sched dumping all events is that you aren't limited to the summary. If you caught an intermittent event, you can analyze those recorded events in custom ways until you understood the issue, rather than needing to catch it a second time.
    - paragraph [ref=e466]: "The captured trace file can be reported in a number of ways, summarized by the help message:"
    - generic [ref=e467]:
      - text: "# perf sched -h Usage: perf sched ["
      - generic [ref=e468]: "] {record|latency|map|replay|script|timehist} -D, --dump-raw-trace dump raw trace in ASCII -f, --force don't complain, do it -i, --input input file name -v, --verbose be more verbose (show symbol address, etc)"
    - paragraph [ref=e469]: "perf sched latency will summarize scheduler latencies by task, including average and maximum delay:"
    - generic [ref=e470]: "# perf sched latency ----------------------------------------------------------------------------------------------------------------- Task | Runtime ms | Switches | Average delay ms | Maximum delay ms | Maximum delay at | ----------------------------------------------------------------------------------------------------------------- cat:(6) | 12.002 ms | 6 | avg: 17.541 ms | max: 29.702 ms | max at: 991962.948070 s ar:17043 | 3.191 ms | 1 | avg: 13.638 ms | max: 13.638 ms | max at: 991963.048070 s rm:(10) | 20.955 ms | 10 | avg: 11.212 ms | max: 19.598 ms | max at: 991963.404069 s objdump:(6) | 35.870 ms | 8 | avg: 10.969 ms | max: 16.509 ms | max at: 991963.424443 s :17008:17008 | 462.213 ms | 50 | avg: 10.464 ms | max: 35.999 ms | max at: 991963.120069 s grep:(7) | 21.655 ms | 11 | avg: 9.465 ms | max: 24.502 ms | max at: 991963.464082 s fixdep:(6) | 81.066 ms | 8 | avg: 9.023 ms | max: 19.521 ms | max at: 991963.120068 s mv:(10) | 30.249 ms | 14 | avg: 8.380 ms | max: 21.688 ms | max at: 991963.200073 s ld:(3) | 14.353 ms | 6 | avg: 7.376 ms | max: 15.498 ms | max at: 991963.452070 s recordmcount:(7) | 14.629 ms | 9 | avg: 7.155 ms | max: 18.964 ms | max at: 991963.292100 s svstat:17067 | 1.862 ms | 1 | avg: 6.142 ms | max: 6.142 ms | max at: 991963.280069 s cc1:(21) | 6013.457 ms | 1138 | avg: 5.305 ms | max: 44.001 ms | max at: 991963.436070 s gcc:(18) | 43.596 ms | 40 | avg: 3.905 ms | max: 26.994 ms | max at: 991963.380069 s ps:17073 | 27.158 ms | 4 | avg: 3.751 ms | max: 8.000 ms | max at: 991963.332070 s [...]"
    - paragraph [ref=e471]: "To shed some light as to how this is instrumented and calculated, I'll show the events that led to the top event's \"Maximum delay at\" of 29.702 ms. Here are the raw events from perf sched script:"
    - generic [ref=e472]: "sh 17028 [001] 991962.918368: sched:sched_wakeup_new: comm=sh pid=17030 prio=120 target_cpu=002 [...] cc1 16819 [002] 991962.948070: sched:sched_switch: prev_comm=cc1 prev_pid=16819 prev_prio=120 prev_state=R ==> next_comm=sh next_pid=17030 next_prio=120 [...]"
    - paragraph [ref=e473]: The time from the wakeup (991962.918368, which is in seconds) to the context switch (991962.948070) is 29.702 ms. This process is listed as "sh" (shell) in the raw events, but execs "cat" soon after, so is shown as "cat" in the perf sched latency output.
    - paragraph [ref=e474]: "perf sched map shows all CPUs and context-switch events, with columns representing what each CPU was doing and when. It's the kind of data you see visualized in scheduler analysis GUIs (including perf timechart, with the layout rotated 90 degrees). Example output:"
    - generic [ref=e475]: "# perf sched map *A0 991962.879971 secs A0 => perf:16999 A0 *B0 991962.880070 secs B0 => cc1:16863 *C0 A0 B0 991962.880070 secs C0 => :17023:17023 *D0 C0 A0 B0 991962.880078 secs D0 => ksoftirqd/0:6 D0 C0 *E0 A0 B0 991962.880081 secs E0 => ksoftirqd/3:28 D0 C0 *F0 A0 B0 991962.880093 secs F0 => :17022:17022 *G0 C0 F0 A0 B0 991962.880108 secs G0 => :17016:17016 G0 C0 F0 *H0 B0 991962.880256 secs H0 => migration/5:39 G0 C0 F0 *I0 B0 991962.880276 secs I0 => perf:16984 G0 C0 F0 *J0 B0 991962.880687 secs J0 => cc1:16996 G0 C0 *K0 J0 B0 991962.881839 secs K0 => cc1:16945 G0 C0 K0 J0 *L0 B0 991962.881841 secs L0 => :17020:17020 G0 C0 K0 J0 *M0 B0 991962.882289 secs M0 => make:16637 G0 C0 K0 J0 *N0 B0 991962.883102 secs N0 => make:16545 G0 *O0 K0 J0 N0 B0 991962.883880 secs O0 => cc1:16819 G0 *A0 O0 K0 J0 N0 B0 991962.884069 secs G0 A0 O0 K0 *P0 J0 N0 B0 991962.884076 secs P0 => rcu_sched:7 G0 A0 O0 K0 *Q0 J0 N0 B0 991962.884084 secs Q0 => cc1:16831 G0 A0 O0 K0 Q0 J0 *R0 B0 991962.884843 secs R0 => cc1:16825 G0 *S0 O0 K0 Q0 J0 R0 B0 991962.885636 secs S0 => cc1:16900 G0 S0 O0 *T0 Q0 J0 R0 B0 991962.886893 secs T0 => :17014:17014 G0 S0 O0 *K0 Q0 J0 R0 B0 991962.886917 secs [...]"
    - paragraph [ref=e476]: This is an 8 CPU system, and you can see the 8 columns for each CPU starting from the left. Some CPU columns begin blank, as we've yet to trace an event on that CPU at the start of the profile. They quickly become populated.
    - paragraph [ref=e477]: The two character codes you see ("A0", "C0") are identifiers for tasks, which are mapped on the right ("=>"). This is more compact than using process (task) IDs. The "*" shows which CPU had the context switch event, and the new event that was running. For example, the very last line shows that at 991962.886917 (seconds) CPU 4 context-switched to K0 (a "cc1" process, PID 16945).
    - paragraph [ref=e478]: "That example was from a busy system. Here's an idle system:"
    - generic [ref=e479]: "# perf sched map *A0 993552.887633 secs A0 => perf:26596 *. A0 993552.887781 secs . => swapper:0 . *B0 993552.887843 secs B0 => migration/5:39 . *. 993552.887858 secs . . *A0 993552.887861 secs . *C0 A0 993552.887903 secs C0 => bash:26622 . *. A0 993552.888020 secs . *D0 . A0 993552.888074 secs D0 => rcu_sched:7 . *. . A0 993552.888082 secs . . *C0 A0 993552.888143 secs . *. . C0 A0 993552.888173 secs . . . *B0 A0 993552.888439 secs . . . *. A0 993552.888454 secs . *C0 . . A0 993552.888457 secs . C0 . . *. 993552.889257 secs . *. . . . 993552.889764 secs . . *E0 . . 993552.889767 secs E0 => bash:7902 [...]"
    - paragraph [ref=e480]: Idle CPUs are shown as ".".
    - paragraph [ref=e481]: Remember to examine the timestamp column to make sense of this visualization (GUIs use that as a dimension, which is easier to comprehend, but here the numbers are just listed). It's also only showing context switch events, and not scheduler latency. The newer timehist command has a visualization (-V) that can include wakeup events.
    - paragraph [ref=e482]: "perf sched timehist was added in Linux 4.10, and shows the scheduler latency by event, including the time the task was waiting to be woken up (wait time) and the scheduler latency after wakeup to running (sch delay). It's the scheduler latency that we're more interested in tuning. Example output:"
    - generic [ref=e483]: "# perf sched timehist Samples do not have callchains. time cpu task name wait time sch delay run time [tid/pid] (msec) (msec) (msec) --------------- ------ ------------------------------ --------- --------- --------- 991962.879971 [0005] perf[16984] 0.000 0.000 0.000 991962.880070 [0007] :17008[17008] 0.000 0.000 0.000 991962.880070 [0002] cc1[16880] 0.000 0.000 0.000 991962.880078 [0000] cc1[16881] 0.000 0.000 0.000 991962.880081 [0003] cc1[16945] 0.000 0.000 0.000 991962.880093 [0003] ksoftirqd/3[28] 0.000 0.007 0.012 991962.880108 [0000] ksoftirqd/0[6] 0.000 0.007 0.030 991962.880256 [0005] perf[16999] 0.000 0.005 0.285 991962.880276 [0005] migration/5[39] 0.000 0.007 0.019 991962.880687 [0005] perf[16984] 0.304 0.000 0.411 991962.881839 [0003] cat[17022] 0.000 0.000 1.746 991962.881841 [0006] cc1[16825] 0.000 0.000 0.000 [...] 991963.885740 [0001] :17008[17008] 25.613 0.000 0.057 991963.886009 [0001] sleep[16999] 1000.104 0.006 0.269 991963.886018 [0005] cc1[17083] 19.998 0.000 9.948"
    - paragraph [ref=e484]: "This output includes the sleep command run to set the duration of perf itself to one second. Note that sleep's wait time is 1000.104 milliseconds because I had run \"sleep 1\": that's the time it was asleep waiting its timer wakeup event. Its scheduler latency was only 0.006 milliseconds, and its time on-CPU was 0.269 milliseconds."
    - paragraph [ref=e485]: "There are a number of options to timehist, including -V to add a CPU visualization column, -M to add migration events, and -w for wakeup events. For example:"
    - generic [ref=e486]: "# perf sched timehist -MVw Samples do not have callchains. time cpu 012345678 task name wait time sch delay run time [tid/pid] (msec) (msec) (msec) --------------- ------ --------- ------------------ --------- --------- --------- 991962.879966 [0005] perf[16984] awakened: perf[16999] 991962.879971 [0005] s perf[16984] 0.000 0.000 0.000 991962.880070 [0007] s :17008[17008] 0.000 0.000 0.000 991962.880070 [0002] s cc1[16880] 0.000 0.000 0.000 991962.880071 [0000] cc1[16881] awakened: ksoftirqd/0[6] 991962.880073 [0003] cc1[16945] awakened: ksoftirqd/3[28] 991962.880078 [0000] s cc1[16881] 0.000 0.000 0.000 991962.880081 [0003] s cc1[16945] 0.000 0.000 0.000 991962.880093 [0003] s ksoftirqd/3[28] 0.000 0.007 0.012 991962.880108 [0000] s ksoftirqd/0[6] 0.000 0.007 0.030 991962.880249 [0005] perf[16999] awakened: migration/5[39] 991962.880256 [0005] s perf[16999] 0.000 0.005 0.285 991962.880264 [0005] m migration/5[39] migrated: perf[16999] cpu 5 => 1 991962.880276 [0005] s migration/5[39] 0.000 0.007 0.019 991962.880682 [0005] m perf[16984] migrated: cc1[16996] cpu 0 => 5 991962.880687 [0005] s perf[16984] 0.304 0.000 0.411 991962.881834 [0003] cat[17022] awakened: :17020 [...] 991963.885734 [0001] :17008[17008] awakened: sleep[16999] 991963.885740 [0001] s :17008[17008] 25.613 0.000 0.057 991963.886005 [0001] sleep[16999] awakened: perf[16984] 991963.886009 [0001] s sleep[16999] 1000.104 0.006 0.269 991963.886018 [0005] s cc1[17083] 19.998 0.000 9.948"
    - paragraph [ref=e487]: The CPU visualization column ("012345678") has "s" for context-switch events, and "m" for migration events, showing the CPU of the event. If you run perf sched record -g, then the stack traces are appended on the right in a single line (not shown here).
    - paragraph [ref=e488]: "The last events in that output include those related to the \"sleep 1\" command used to time perf. The wakeup happened at 991963.885734, and at 991963.885740 (6 microseconds later) CPU 1 begins to context-switch to the sleep process. The column for that event still shows \":17008[17008]\" for what was on-CPU, but the target of the context switch (sleep) is not shown. It is in the raw events:"
    - generic [ref=e489]: ":17008 17008 [001] 991963.885740: sched:sched_switch: prev_comm=cc1 prev_pid=17008 prev_prio=120 prev_state=R ==> next_comm=sleep next_pid=16999 next_prio=120"
    - paragraph [ref=e490]: "The 991963.886005 event shows that the perf command received a wakeup while sleep was running (almost certainly sleep waking up its parent process because it terminated), and then we have the context switch on 991963.886009 where sleep stops running, and a summary is printed out: 1000.104 ms waiting (the \"sleep 1\"), with 0.006 ms scheduler latency, and 0.269 ms of CPU runtime."
    - paragraph [ref=e491]: "Here I've decorated the timehist output with the details of the context switch destination in red:"
    - generic [ref=e492]: "991963.885734 [0001] :17008[17008] awakened: sleep[16999] 991963.885740 [0001] s :17008[17008] 25.613 0.000 0.057 next: sleep[16999] 991963.886005 [0001] sleep[16999] awakened: perf[16984] 991963.886009 [0001] s sleep[16999] 1000.104 0.006 0.269 next: cc1[17008] 991963.886018 [0005] s cc1[17083] 19.998 0.000 9.948 next: perf[16984]"
    - paragraph [ref=e493]: When sleep finished, a waiting "cc1" process then executed. perf ran on the following context switch, and is the last event in the profile (perf terminated). I've added this as a -n/--next option to perf (should arrive in Linux 4.11 or 4.12).
    - paragraph [ref=e494]: "perf sched script dumps all events (similar to perf script):"
    - generic [ref=e495]: "# perf sched script perf 16984 [005] 991962.879960: sched:sched_stat_runtime: comm=perf pid=16984 runtime=3901506 [ns] vruntime=165... perf 16984 [005] 991962.879966: sched:sched_wakeup: comm=perf pid=16999 prio=120 target_cpu=005 perf 16984 [005] 991962.879971: sched:sched_switch: prev_comm=perf prev_pid=16984 prev_prio=120 prev_stat... perf 16999 [005] 991962.880058: sched:sched_stat_runtime: comm=perf pid=16999 runtime=98309 [ns] vruntime=16405... cc1 16881 [000] 991962.880058: sched:sched_stat_runtime: comm=cc1 pid=16881 runtime=3999231 [ns] vruntime=7897... :17024 17024 [004] 991962.880058: sched:sched_stat_runtime: comm=cc1 pid=17024 runtime=3866637 [ns] vruntime=7810... cc1 16900 [001] 991962.880058: sched:sched_stat_runtime: comm=cc1 pid=16900 runtime=3006028 [ns] vruntime=7772... cc1 16825 [006] 991962.880058: sched:sched_stat_runtime: comm=cc1 pid=16825 runtime=3999423 [ns] vruntime=7876..."
    - paragraph [ref=e496]: Each of these events ("sched:sched_stat_runtime" etc) are tracepoints you can instrument directly using perf record.
    - paragraph [ref=e497]: As I've shown earlier, this raw output can be useful for digging further than the summary commands.
    - paragraph [ref=e498]: "perf sched replay will take the recorded scheduler events, and then simulate the workload by spawning threads with similar runtimes and context switches. Useful for testing and developing scheduler changes and configuration. Don't put too much faith in this (and other) workload replayers: they can be a useful load generator, but it's difficult to simulate the real workload completely. Here I'm running replay with -r -1, to repeat the workload:"
    - generic [ref=e499]: "# perf sched replay -r -1 run measurement overhead: 84 nsecs sleep measurement overhead: 146710 nsecs the run test took 1000005 nsecs the sleep test took 1107773 nsecs nr_run_events: 4175 nr_sleep_events: 4710 nr_wakeup_events: 2138 task 0 ( swapper: 0), nr_events: 13 task 1 ( swapper: 1), nr_events: 1 task 2 ( swapper: 2), nr_events: 1 task 3 ( kthreadd: 4), nr_events: 1 task 4 ( kthreadd: 6), nr_events: 29 [...] task 530 ( sh: 17145), nr_events: 4 task 531 ( sh: 17146), nr_events: 7 task 532 ( sh: 17147), nr_events: 4 task 533 ( make: 17148), nr_events: 10 task 534 ( sh: 17149), nr_events: 1 ------------------------------------------------------------ #1 : 965.996, ravg: 966.00, cpu: 798.24 / 798.24 #2 : 902.647, ravg: 966.00, cpu: 1157.53 / 798.24 #3 : 945.482, ravg: 966.00, cpu: 925.25 / 798.24 #4 : 943.541, ravg: 966.00, cpu: 761.72 / 798.24 #5 : 914.643, ravg: 966.00, cpu: 1604.32 / 798.24 [...]"
    - heading "6.8. eBPF" [level=2] [ref=e500]
    - paragraph [ref=e501]: As of Linux 4.4, perf has some enhanced BPF support (aka eBPF or just "BPF"), with more in later kernels. BPF makes perf tracing programmatic, and takes perf from being a counting & sampling-with-post-processing tracer, to a fully in-kernel programmable tracer.
    - paragraph [ref=e502]:
      - text: eBPF is currently a little restricted and difficult to use from perf. It's getting better all the time. A different and currently easier way to access eBPF is via the bcc Python interface, which is described on my
      - link "eBPF Tools" [ref=e503] [cursor=pointer]:
        - /url: ebpf.html
      - text: page. On this page, I'll discuss perf.
    - heading "Prerequisites" [level=3] [ref=e504]
    - paragraph [ref=e505]: Linux 4.4 at least. Newer versions have more perf/BPF features, so the newer the better. Also clang (eg, apt-get install clang).
    - heading "kmem_cache_alloc from Example" [level=3] [ref=e506]
    - paragraph [ref=e507]: "This program traces the kernel kmem_cache_alloc() function, only if its calling function matches a specified range, filtered in kernel context. You can imagine doing this for efficiency: instead of tracing all allocations, which can be very frequent and add significant overhead, you filter for just a range of kernel calling functions of interest, such as a kernel module. I'll loosely match tcp functions as an example, which are in memory at these addresses:"
    - generic [ref=e508]: "# grep tcp /proc/kallsyms | more [...] ffffffff817c1bb0 t tcp_get_info_chrono_stats ffffffff817c1c60 T tcp_init_sock ffffffff817c1e30 t tcp_splice_data_recv ffffffff817c1e70 t tcp_push ffffffff817c20a0 t tcp_send_mss ffffffff817c2170 t tcp_recv_skb ffffffff817c2250 t tcp_cleanup_rbuf [...] ffffffff818524f0 T tcp6_proc_exit ffffffff81852510 T tcpv6_exit ffffffff818648a0 t tcp6_gro_complete ffffffff81864910 t tcp6_gro_receive ffffffff81864ae0 t tcp6_gso_segment ffffffff8187bd89 t tcp_v4_inbound_md5_hash"
    - paragraph [ref=e509]: I'll assume these functions are contiguous, so that by tracing the range 0xffffffff817c1bb0 to 0xffffffff8187bd89, I'm matching much of tcp.
    - paragraph [ref=e510]: "Here is my BPF program, kca_from.c:"
    - generic [ref=e511]: "#include <uapi/linux/bpf.h> #include <uapi/linux/ptrace.h> #define SEC(NAME) __attribute__((section(NAME), used)) /* * Edit the following to match the instruction address range you want to * sample. Eg, look in /proc/kallsyms. The addresses will change for each * kernel version and build. */ #define RANGE_START 0xffffffff817c1bb0 #define RANGE_END 0xffffffff8187bd89 struct bpf_map_def { unsigned int type; unsigned int key_size; unsigned int value_size; unsigned int max_entries; }; static int (*probe_read)(void *dst, int size, void *src) = (void *)BPF_FUNC_probe_read; static int (*get_smp_processor_id)(void) = (void *)BPF_FUNC_get_smp_processor_id; static int (*perf_event_output)(void *, struct bpf_map_def *, int, void *, unsigned long) = (void *)BPF_FUNC_perf_event_output; struct bpf_map_def SEC(\"maps\") channel = { .type = BPF_MAP_TYPE_PERF_EVENT_ARRAY, .key_size = sizeof(int), .value_size = sizeof(u32), .max_entries = __NR_CPUS__, }; SEC(\"func=kmem_cache_alloc\") int func(struct pt_regs *ctx) { u64 ret = 0; // x86_64 specific: probe_read(&ret, sizeof(ret), (void *)(ctx->bp+8)); if (ret >= RANGE_START && ret < RANGE_END) { perf_event_output(ctx, &channel, get_smp_processor_id(), &ret, sizeof(ret)); } return 0; } char _license[] SEC(\"license\") = \"GPL\"; int _version SEC(\"version\") = LINUX_VERSION_CODE;"
    - paragraph [ref=e512]: "Now I'll execute it, then dump the events:"
    - generic [ref=e513]: "# perf record -e bpf-output/no-inherit,name=evt/ -e ./kca_from.c/map:channel.event=evt/ -a -- sleep 1 bpf: builtin compilation failed: -95, try external compiler [ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.214 MB perf.data (3 samples) ] # perf script testserver00001 14337 [003] 481432.395181: 0 evt: ffffffff81210f51 kmem_cache_alloc (/lib/modules/...) BPF output: 0000: 0f b4 7c 81 ff ff ff ff ..|..... 0008: 00 00 00 00 .... redis-server 1871 [005] 481432.395258: 0 evt: ffffffff81210f51 kmem_cache_alloc (/lib/modules/...) BPF output: 0000: 14 55 7c 81 ff ff ff ff .U|..... 0008: 00 00 00 00 .... redis-server 1871 [005] 481432.395456: 0 evt: ffffffff81210f51 kmem_cache_alloc (/lib/modules/...) BPF output: 0000: fe dc 7d 81 ff ff ff ff ..}..... 0008: 00 00 00 00 ...."
    - paragraph [ref=e514]: "It worked: the \"BPF output\" records contain addresses in our range: 0xffffffff817cb40f, and so on. kmem_cache_alloc() is a frequently called function, so that it only matched a few entries in one second of tracing is an indication it is working (I can also relax that range to confirm it)."
    - paragraph [ref=e515]: "Adding stack traces with -g:"
    - generic [ref=e516]: "# perf record -e bpf-output/no-inherit,name=evt/ -e ./kca_from.c/map:channel.event=evt/ -a -g -- sleep 1 bpf: builtin compilation failed: -95, try external compiler [ perf record: Woken up 1 times to write data ] [ perf record: Captured and wrote 0.215 MB perf.data (3 samples) ] # perf script testserver00001 16744 [002] 481518.262579: 0 evt: 410f51 kmem_cache_alloc (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9cb40f tcp_conn_request (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9da243 tcp_v4_conn_request (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9d0936 tcp_rcv_state_process (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9db102 tcp_v4_do_rcv (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9dcabf tcp_v4_rcv (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9b4af4 ip_local_deliver_finish (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9b4dff ip_local_deliver (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9b477b ip_rcv_finish (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9b50fb ip_rcv (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 97119e __netif_receive_skb_core (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 971708 __netif_receive_skb (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9725df process_backlog (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 971c8e net_rx_action (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) a8e58d __do_softirq (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) a8c9ac do_softirq_own_stack (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 28a061 do_softirq.part.18 (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 28a0ed __local_bh_enable_ip (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9b8ff3 ip_finish_output2 (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9b9f43 ip_finish_output (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9ba9f6 ip_output (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9ba155 ip_local_out (/lib/modules/4.10.0-rc8-virtual/build/vmlinux) 9ba48a ip_queue_xmit (/lib/modules/4.10.0-rc8-vir