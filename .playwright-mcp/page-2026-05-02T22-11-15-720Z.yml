                    - img [ref=e686]
                - paragraph [ref=e688]:
                  - text: Requires the "perf" command to be installed. This is in the linux-tools-common package. After installing that, perf may tell you to install an additional linux-tools package (linux-tools-
                  - emphasis [ref=e689]: kernel_version
                  - text: ). perf can also be built under tools/perf in the kernel source. See
                  - link "perf_events Prerequisites" [ref=e690] [cursor=pointer]:
                    - /url: http://www.brendangregg.com/perf.html#Prerequisites
                  - text: for more details about getting perf_events to work fully.
