                - paragraph [ref=e676]: The intent is as few as possible. Eg, a Linux 3.2 server without debuginfo. See the tool man page for specifics.
                - generic [ref=e677]:
                  - heading "ftrace" [level=3] [ref=e678]
                  - 'link "Permalink: ftrace" [ref=e679] [cursor=pointer]':
                    - /url: "#ftrace"
                    - img [ref=e680]
                - paragraph [ref=e682]: FTRACE configured in the kernel. You may already have this configured and available in your kernel version, as FTRACE was first added in 2.6.27. This requires CONFIG_FTRACE and other FTRACE options depending on the tool. Some tools (eg, funccount) require CONFIG_FUNCTION_PROFILER.
                - generic [ref=e683]:
                  - heading "perf_events" [level=3] [ref=e684]
                  - 'link "Permalink: perf_events" [ref=e685] [cursor=pointer]':
