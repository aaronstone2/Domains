                  - button "Copy" [ref=e721] [cursor=pointer]:
                    - img [ref=e722]
                - paragraph [ref=e725]: "Or use the raw links on github to download individual scripts. Eg:"
                - generic [ref=e726]:
                  - code [ref=e728]: wget https://raw.githubusercontent.com/brendangregg/perf-tools/master/iosnoop
                  - button "Copy" [ref=e730] [cursor=pointer]:
                    - img [ref=e731]
                - paragraph [ref=e734]: This preserves tabs (which copy-n-paste can mess up).
                - generic [ref=e735]:
                  - heading "Warnings" [level=2] [ref=e736]
                  - 'link "Permalink: Warnings" [ref=e737] [cursor=pointer]':
                    - /url: "#warnings"
                    - img [ref=e738]
                - paragraph [ref=e740]: Ftrace was first added to Linux 2.6.27, and perf_events to Linux 2.6.31. These early versions had kernel bugs, and lockups and panics have been reported on 2.6.32 series kernels. This includes CentOS 6.x. If you must analyze older kernels, these tools may only be useful in a fault-tolerant environment, such as a lab with simulated issues. These tools have been primarily developed on Linux 3.2 and later kernels.
                - paragraph [ref=e741]: Depending on the tool, there may also be overhead incurred. See the next section.
                - generic [ref=e742]:
                  - heading "Internals and Overhead" [level=2] [ref=e743]
                  - 'link "Permalink: Internals and Overhead" [ref=e744] [cursor=pointer]':
                    - /url: "#internals-and-overhead"
                    - img [ref=e745]
                - paragraph [ref=e747]: perf_events is evolving. This collection began development circa Linux 3.16, with Linux 3.2 servers as the main target, at a time when perf_events lacks certain programmatic capabilities (eg, custom in-kernel aggregations). It's possible these will be added in a forthcoming kernel release. Until then, many of these tools employ workarounds, tricks, and hacks in order to work. Some of these tools pass event data to user space for post-processing, which costs much higher overhead than in-kernel aggregations. The overhead of each tool is described in its man page.
                - paragraph [ref=e748]:
                  - strong [ref=e749]: WARNING
                  - text: ": In"
                  - emphasis [ref=e750]: extreme
                  - text: cases, your target application may run 5x slower when using these tools. Depending on the tool and kernel version, there may also be the risk of kernel panics. Read the program header for warnings, and test before use.
                - paragraph [ref=e751]: If the overhead is a problem, these tools can be improved. If a tool doesn't already, it could be rewritten in C to use perf_events_open() and mmap() for the trace buffer. It could also implement frequency counts in C, and operate on mmap() directly, rather than using awk/Perl/Python. Additional improvements are possible for ftrace-based tools, such as use of snapshots and per-instance buffers.
                - paragraph [ref=e752]: Some of these tools are intended as short-term workarounds until more kernel capabilities exist, at which point they can be substantially rewritten. Older versions of these tools will be kept in this repository, for older kernel versions.
                - paragraph [ref=e753]: As my main target is a fleet of Linux 3.2 servers that do not have debuginfo, these tools try not to require it. At times, this makes the tool more brittle than it needs to be, as I'm employing workarounds (that may be kernel version and platform specific) instead of using debuginfo information (which can be generic). See the man page for detailed prerequisites for each tool.
                - paragraph [ref=e754]: I've tried to use perf_events ("perf") where possible, since that interface has been developed for multi-user use. For various reasons I've often needed to use ftrace instead. ftrace is surprisingly powerful (thanks Steven Rostedt!), and not all of its features are exposed via perf, or in common usage. This tool collection is in some ways a demonstration of hidden Linux features using ftrace.
                - paragraph [ref=e755]: Since things are changing, it's very possible you may find some tools don't work on your Linux kernel version. Some expertise and assembly will be required to fix them.
