                    - /url: "#debugfs"
                    - img [ref=e694]
                - paragraph [ref=e696]: "Requires a kernel with CONFIG_DEBUG_FS option enabled. As with FTRACE, this may already be enabled (debugfs was added in 2.6.10-rc3). The debugfs also needs to be mounted:"
