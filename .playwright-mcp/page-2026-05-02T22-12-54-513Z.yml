    - heading "4. eBPF" [level=1] [ref=e123]
    - generic [ref=e124]:
      - link [ref=e125] [cursor=pointer]:
        - /url: eBPF/pony_ebpf01.png
        - img [ref=e126]
      - generic [ref=e128]: eBPF unofficial logo
    - paragraph [ref=e129]: "BPF originated as a technology for optimizing packet filters. If you run tcpdump with an expression (matching on a host or port), it gets compiled into optimal BPF bytecode which is executed by an in-kernel sandboxed virtual machine. Extended BPF (aka eBPF, which I keep calling \"enhanced BPF\" by accident, but it can also be called just BPF) extended what this BPF virtual machine could do: allowing it to run on events other than packets, and do actions other than filtering."
    - paragraph [ref=e130]: "eBPF can be used to for software defined networks, DDoS mitigation (early packet drop), improving network performance (eXpress Data Path), intrusion detection, and more. On this page I'm focusing on its use for observability tools, where it is used as shown in the following workflow:"
    - paragraph
    - link [ref=e132] [cursor=pointer]:
      - /url: eBPF/linux_ebpf_internals.png
      - img [ref=e133]
    - paragraph
    - paragraph [ref=e134]: "Our observability tool has BPF code to perform certain actions: measure latency, summarize as a histogram, grab stack traces, etc. That BPF code is compiled to BPF byte code and then sent to the kernel, where a verifier may reject it if it is deemed unsafe (which includes not allowing loops or backwards branches). If the BPF bytecode is accepted, it can then be attached to different event sources:"
    - list [ref=e135]:
      - listitem [ref=e136]: "kprobes: kernel dynamic tracing."
      - listitem [ref=e137]: "uprobes: user level dynamic tracing."
      - listitem [ref=e138]: "tracepoints: kernel static tracing."
      - listitem [ref=e139]: "perf_events: timed sampling and PMCs."
    - paragraph [ref=e140]: "The BPF program has two ways to pass measured data back to user space: either per-event details, or via a BPF map. BPF maps can implement arrays, associative arrays, and histograms, and are suited for passing summary statistics."
    - heading "4.1. Prerequisites" [level=2] [ref=e141]
    - paragraph [ref=e142]: "A Linux kernel compiled with CONFIG_BPF_SYSCALL (eg, Ubuntu does this), and at least the 4.4 kernel (eg, Ubuntu Xenial) so that histogram, statistic, and per-event tracing is supported. The following diagram shows other features with the Linux version eBPF supported arrived in green:"
    - paragraph
    - link [ref=e144] [cursor=pointer]:
      - /url: eBPF/linux_ebpf_support.png
      - img [ref=e145]
    - paragraph
    - heading "4.2. Front Ends" [level=2] [ref=e146]
