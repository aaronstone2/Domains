    - paragraph [ref=e200]: "I've previously summarized these on three dimensions: ease of use, scope & capability, and stage of development. Here are the BPF front-ends vs the standard built-in Linux tracers (ftrace and perf):"
    - link [ref=e202] [cursor=pointer]:
      - /url: eBPF/ebpf_tracing_landscape_jan2019.png
      - img [ref=e203]
    - paragraph [ref=e204]:
      - text: I've shown perf+BPF separately to classic
      - link "perf" [ref=e205] [cursor=pointer]:
        - /url: perf.html
      - text: and ftrace.
    - heading "5. BCC" [level=1] [ref=e206]
    - paragraph [ref=e207]:
      - text: BPF Compiler Collection is on
      - link "github.com/iovisor/bcc" [ref=e208] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc
      - text: ", and provides a large collection of tracing examples tools, as well as C, Python, and lua interfaces for developing them. The diagram on the top right of this page illustrates these bcc tools."
    - paragraph [ref=e209]: Prerequisites are the same as eBPF above, and Python. If you are on an older kernel (between 4.1 and 4.8) and the bcc tool you want to run doesn't work, take a look in bcc's tools/old directory, which might have a legacy version that employs workarounds.
    - paragraph [ref=e210]: Example tracing code can be found in the bcc /examples/tracing directory, and in the tools, under the /tools directory. Each tool also has an example .txt file in /tools, and a man page in /man/man8.
    - paragraph [ref=e211]:
      - text: I contributed many tools to bcc, including their man pages and examples files, as well as some bcc capabilities and fixes. I also created the
      - link "tool" [ref=e212] [cursor=pointer]:
        - /url: Perf/bcc_tracing_tools.pg
      - text: and
      - link "events" [ref=e213] [cursor=pointer]:
        - /url: Perf/linux_ebpf_support.png
      - text: diagrams, the
      - link "Tutorial" [ref=e214] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/docs/tutorial.md
      - text: ", the"
      - link "Developer's Tutorial" [ref=e215] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/docs/tutorial_bcc_python_developer.md
      - text: ", the"
      - link "Reference Guide" [ref=e216] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/docs/reference_guide.md
      - text: ", and published many"
      - link "posts" [ref=e217] [cursor=pointer]:
        - /url: http://www.brendangregg.com/blog/
      - text: on bcc/eBPF. I'll summarize some content here, but I've written and published a lot more detail in those resources for those wishing to dig deeper.
    - paragraph [ref=e218]:
      - text: "Update 04-Nov-2020: The Python interface is now considered deprecated in favor of the new C libbpf interface. For more information see my"
      - link "future of BPF perf tools" [ref=e219] [cursor=pointer]:
        - /url: http://www.brendangregg.com/blog/2020-11-04/bpf-co-re-btf-libbpf.html
      - text: post.
    - 'heading "5.1. bcc: Installation" [level=2] [ref=e220]'
    - paragraph [ref=e221]:
      - text: See the
      - link "bcc install instructions" [ref=e222] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/INSTALL.md
      - text: "for getting started on different Linux distros. Here are recent Ubuntu instructions, as an example:"
    - generic [ref=e223]: "# echo \"deb [trusted=yes] https://repo.iovisor.org/apt/xenial xenial-nightly main\" | \\ sudo tee /etc/apt/sources.list.d/iovisor.list # sudo apt-get update # sudo apt-get install bpfcc-tools # or the old package name: bcc-tools"
    - paragraph [ref=e224]: bcc tools will be installed under /usr/share/bcc/tools.
    - 'heading "5.2. bcc: General Performance Checklist" [level=2] [ref=e225]'
    - paragraph [ref=e226]:
      - text: This checklist can be useful if you don't know where to start. It tours various bcc tools to analyze different targets, which may unearth activity you were previously unaware of. I first included this in the
      - link "bcc tutorial" [ref=e227] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/docs/tutorial.md
      - text: ", after a Linux basics checklist of standard tools. It's assumed you've already run such basics (dmesg, vmstat, iostat, top, etc) and now want to dig deeper."
    - heading "1. execsnoop" [level=3] [ref=e228]
    - paragraph [ref=e229]: "Trace new processes via exec() syscalls, and print the parent process name and other details:"
    - generic [ref=e230]: "# execsnoop PCOMM PID RET ARGS bash 15887 0 /usr/bin/man ls preconv 15894 0 /usr/bin/preconv -e UTF-8 man 15896 0 /usr/bin/tbl man 15897 0 /usr/bin/nroff -mandoc -rLL=169n -rLT=169n -Tutf8 man 15898 0 /usr/bin/pager -s nroff 15900 0 /usr/bin/locale charmap nroff 15901 0 /usr/bin/groff -mtty-char -Tutf8 -mandoc -rLL=169n -rLT=169n groff 15902 0 /usr/bin/troff -mtty-char -mandoc -rLL=169n -rLT=169n -Tutf8 groff 15903 0 /usr/bin/grotty [...]"
    - heading "2. opensnoop" [level=3] [ref=e231]
    - paragraph [ref=e232]: "Trace open() syscalls and print process name and path name details:"
    - generic [ref=e233]: "# opensnoop PID COMM FD ERR PATH 27159 catalina.sh 3 0 /apps/tomcat8/bin/setclasspath.sh 4057 redis-server 5 0 /proc/4057/stat 2360 redis-server 5 0 /proc/2360/stat 30668 sshd 4 0 /proc/sys/kernel/ngroups_max 30668 sshd 4 0 /etc/group 30668 sshd 4 0 /root/.ssh/authorized_keys 30668 sshd 4 0 /root/.ssh/authorized_keys 30668 sshd -1 2 /var/run/nologin 30668 sshd -1 2 /etc/nologin 30668 sshd 4 0 /etc/login.defs 30668 sshd 4 0 /etc/passwd 30668 sshd 4 0 /etc/shadow 30668 sshd 4 0 /etc/localtime 4510 snmp-pass 4 0 /proc/cpuinfo [...]"
    - heading "3. ext4slower" [level=3] [ref=e234]
    - paragraph [ref=e235]: "Trace slow ext4 operations that are slower than a provided threshold (bcc has versions of this for btrfs, XFS, and ZFS as well):"
    - generic [ref=e236]: "# ext4slower 1 Tracing ext4 operations slower than 1 ms TIME COMM PID T BYTES OFF_KB LAT(ms) FILENAME 06:49:17 bash 3616 R 128 0 7.75 cksum 06:49:17 cksum 3616 R 39552 0 1.34 [ 06:49:17 cksum 3616 R 96 0 5.36 2to3-2.7 06:49:17 cksum 3616 R 96 0 14.94 2to3-3.4 06:49:17 cksum 3616 R 10320 0 6.82 411toppm 06:49:17 cksum 3616 R 65536 0 4.01 a2p 06:49:17 cksum 3616 R 55400 0 8.77 ab 06:49:17 cksum 3616 R 36792 0 16.34 aclocal-1.14 06:49:17 cksum 3616 R 15008 0 19.31 acpi_listen 06:49:17 cksum 3616 R 6123 0 17.23 add-apt-repository 06:49:17 cksum 3616 R 6280 0 18.40 addpart 06:49:17 cksum 3616 R 27696 0 2.16 addr2line 06:49:17 cksum 3616 R 58080 0 10.11 ag"
