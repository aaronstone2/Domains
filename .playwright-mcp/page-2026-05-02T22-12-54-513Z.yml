    - heading "10. gethostlatency" [level=3] [ref=e255]
    - paragraph [ref=e256]: "Show latency for getaddrinfo/gethostbyname[2] library calls, system wide:"
    - generic [ref=e257]: "# gethostlatency TIME PID COMM LATms HOST 06:10:24 28011 wget 90.00 www.iovisor.org 06:10:28 28127 wget 0.00 www.iovisor.org 06:10:41 28404 wget 9.00 www.netflix.com 06:10:48 28544 curl 35.00 www.netflix.com.au 06:11:10 29054 curl 31.00 www.plumgrid.com 06:11:16 29195 curl 3.00 www.facebook.com 06:11:24 25313 wget 3.00 www.usenix.org 06:11:25 29404 curl 72.00 foo 06:11:28 29475 curl 1.00 foo [...]"
    - heading "11. runqlat" [level=3] [ref=e258]
    - paragraph [ref=e259]: "Show run queue (scheduler) latency as a histogram, every 5 seconds:"
    - generic [ref=e260]: "# runqlat -m 5 Tracing run queue latency... Hit Ctrl-C to end. msecs : count distribution 0 -> 1 : 2085 |****************************************| 2 -> 3 : 8 | | 4 -> 7 : 20 | | 8 -> 15 : 191 |*** | 16 -> 31 : 420 |******** | msecs : count distribution 0 -> 1 : 1798 |****************************************| 2 -> 3 : 11 | | 4 -> 7 : 45 |* | 8 -> 15 : 441 |********* | 16 -> 31 : 1030 |********************** | msecs : count distribution 0 -> 1 : 1588 |****************************************| 2 -> 3 : 7 | | 4 -> 7 : 49 |* | 8 -> 15 : 556 |************** | 16 -> 31 : 1206 |****************************** | [...]"
