    - paragraph [ref=e66]: On this page I'll describe eBPF, the front-ends, and demonstrate some of the tracing tools I've developed.
    - heading "1. Screenshot" [level=1] [ref=e67]
    - paragraph [ref=e68]: "Starting with a screenshot, here's an example of tracing and showing block (disk) I/O as a latency heat map:"
    - paragraph
    - link [ref=e70] [cursor=pointer]:
      - /url: eBPF/tracex3_heatmap_01.png
      - img [ref=e71]
    - paragraph
    - paragraph [ref=e72]:
      - text: I added some annotations to that screenshot. If you are new to this visualization, see my page on
      - link "latency heat maps" [ref=e73] [cursor=pointer]:
        - /url: /HeatMaps/latency.html
      - text: .
    - paragraph [ref=e74]: This uses kernel dynamic tracing (kprobes) to instrument functions for the issue and completion of block device I/O. Custom eBPF programs execute when these kprobes are hit, which record timestamps on the issue of I/O, fetch them on completion, calculate the delta time, and then store this in a log 2 histogram. The user space program reads this histogram array periodically, once per second, and draws the heat map. The summarization is all done in kernel context, for efficiency.
    - heading "2. One Liners" [level=1] [ref=e75]
    - paragraph [ref=e76]:
      - text: Useful one-liners using the
      - link "bcc" [ref=e77] [cursor=pointer]:
        - /url: "#bcc"
      - text: "(eBPF) tools:"
    - heading "Single Purpose Tools" [level=3] [ref=e78]
    - generic [ref=e79]: "# Trace new processes: execsnoop # Trace file opens with process and filename: opensnoop # Summarize block I/O (disk) latency as a power-of-2 distribution by disk: biolatency -D # Summarize block I/O size as a power-of-2 distribution by program name: bitesize # Trace common ext4 file system operations slower than 1 millisecond: ext4slower 1 # Trace TCP active connections (connect()) with IP address and ports: tcpconnect # Trace TCP passive connections (accept()) with IP address and ports: tcpaccept # Trace TCP connections to local port 80, with session duration: tcplife -L 80 # Trace TCP retransmissions with IP addresses and TCP state: tcpretrans # Sample stack traces at 49 Hertz for 10 seconds, emit folded format (for flame graphs): profile -fd -F 49 10 # Trace details and latency of resolver DNS lookups: gethostlatency # Trace commands issued in all running bash shells: bashreadline"
    - 'heading "Multi Tools: Kernel Dynamic Tracing" [level=3] [ref=e80]'
    - generic [ref=e81]: "# Count \"tcp_send*\" kernel function, print output every second: funccount -i 1 'tcp_send*' # Count \"vfs_*\" calls for PID 185: funccount -p 185 'vfs_*' # Trace file names opened, using dynamic tracing of the kernel do_sys_open() function: trace 'p::do_sys_open \"%s\", arg2' # Same as before (\"p:: is assumed if not specified): trace 'do_sys_open \"%s\", arg2' # Trace the return of the kernel do_sys_open() funciton, and print the retval: trace 'r::do_sys_open \"ret: %d\", retval' # Trace do_nanosleep() kernel function and the second argument (mode), with kernel stack traces: trace -K 'do_nanosleep \"mode: %d\", arg2' # Trace do_nanosleep() mode by providing the prototype (no debuginfo required): trace 'do_nanosleep(struct hrtimer_sleeper *t, enum hrtimer_mode mode) \"mode: %d\", mode' # Trace do_nanosleep() with the task address (may be NULL), noting the dereference: trace 'do_nanosleep(struct hrtimer_sleeper *t, enum hrtimer_mode mode) \"task: %x\", t->task' # Frequency count tcp_sendmsg() size: argdist -C 'p::tcp_sendmsg(struct sock *sk, struct msghdr *msg, size_t size):u32:size' # Summarize tcp_sendmsg() size as a power-of-2 histogram: argdist -H 'p::tcp_sendmsg(struct sock *sk, struct msghdr *msg, size_t size):u32:size' # Frequency count stack traces that lead to the submit_bio() function (disk I/O issue): stackcount submit_bio # Summarize the latency (time taken) by the vfs_read() function for PID 181: funclatency -p 181 -u vfs_read"
    - 'heading "Multi Tools: User Level Dynamic Tracing" [level=3] [ref=e82]'
    - generic [ref=e83]: "# Trace the libc library function nanosleep() and print the requested sleep details: trace 'p:c:nanosleep(struct timespec *req) \"%d sec %d nsec\", req->tv_sec, req->tv_nsec' # Count the libc write() call for PID 181 by file descriptor: argdist -p 181 -C 'p:c:write(int fd):int:fd' # Summarize the latency (time taken) by libc getaddrinfo(), as a power-of-2 histogram in microseconds: funclatency.py -u 'c:getaddrinfo'"
    - 'heading "Multi Tools: Kernel Static Tracing" [level=3] [ref=e84]'
    - generic [ref=e85]: "# Count stack traces that led to issuing block I/O, tracing its kernel tracepoint: stackcount t:block:block_rq_insert"
    - paragraph [ref=e86]: Under construction...
    - 'heading "Multi Tools: User Statically Defined Tracing (USDT)" [level=3] [ref=e87]'
    - generic [ref=e88]: "# Trace the pthread_create USDT probe, and print arg1 as hex: trace 'u:pthread:pthread_create \"%x\", arg1'"
    - paragraph [ref=e89]: Under construction...
    - paragraph [ref=e90]: These one-liners demonstrate various capabilities of bcc/eBPF. You can also print these out as a cheatsheet.
