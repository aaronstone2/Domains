    - paragraph [ref=e18]: This page shows examples of performance analysis tools using enhancements to BPF (Berkeley Packet Filter) which were added to the Linux 4.x series kernels, allowing BPF to do much more than just filtering packets. These enhancements allow custom analysis programs to be executed on Linux dynamic tracing, static tracing, and profiling events.
    - paragraph [ref=e19]:
      - text: The main and recommended front-ends for BPF tracing are
      - link "BCC" [ref=e20] [cursor=pointer]:
        - /url: "#bcc"
      - text: and
      - link "bpftrace" [ref=e21] [cursor=pointer]:
        - /url: "#bpftrace"
      - text: ": BCC for complex tools and daemons, and bpftrace for one-liners and short scripts. If you are looking for tools to run, try BCC then bpftrace. If you want to program your own, start with bpftrace, and only use BCC if needed. I've ported many of my older tracing tools to both BCC and bpftrace, and their repositories provide over 100 tools between them. I also developed over 100 more for my book:"
      - 'link "BPF Performance Tools: Linux System and Application Observability" [ref=e22] [cursor=pointer]':
        - /url: bpf-performance-tools-book.html
      - text: .
    - paragraph [ref=e23]: "eBPF tracing is suited for answering questions like:"
    - list [ref=e24]:
      - listitem [ref=e25]: Are any ext4 operations taking longer than 50 ms?
      - listitem [ref=e26]: What is run queue latency, as a histogram?
      - listitem [ref=e27]: Which packets and apps are experiencing TCP retransmits? Trace efficiently (without tracing send/receive).
      - listitem [ref=e28]: What is the stack trace when threads block (off-CPU), and how long do they block for?
    - paragraph [ref=e29]: "eBPF can also be used for security modules and software defined networks. I'm not covering those here (yet, anyway). Also note: eBPF is often called just \"BPF\", especially on lkml."
    - paragraph [ref=e30]:
