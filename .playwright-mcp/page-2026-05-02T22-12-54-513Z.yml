    - heading "10. Acknowledgements" [level=1] [ref=e678]
    - paragraph [ref=e679]:
      - text: "Many people have worked on tracers and contributed in different ways over the years to get to where we are today, including those who worked on the Linux frameworks that bcc/eBPF makes use of: tracepoints, kprobes, uprobes, ftrace, and perf_events. The most recent contributors include Alexei Starovoitov and Daniel Borkmann, who have lead eBPF development, and Brenden Blanco and Yonghong Song, who have lead bcc development. Many of the single purpose bcc tools were written by me (execsnoop, opensnoop, biolatency, ext4slower, tcpconnect, gethostlatency, etc), and two of the most important multi-tools (trace and argdist) were written by Sasha Goldshtein. I wrote a longer list of acknowledgements at the end of"
      - link "this post" [ref=e680] [cursor=pointer]:
        - /url: /blog/2016-10-27/dtrace-for-linux-2016.html
      - text: . Thank you everyone!
