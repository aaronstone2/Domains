    - paragraph [ref=e381]: The ASCII histogram shows the distribution of the latency, helping you see if it is multi-modal, or if there are latency outliers.
    - 'heading "6.3. bpftrace: Programming Summary" [level=2] [ref=e382]'
    - paragraph [ref=e383]:
      - text: This is a summary/cheat sheet for programming in bpftrace. See the
      - link "bpftrace reference guide" [ref=e384] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace/blob/master/docs/reference_guide.md
      - text: for more information.
    - paragraph [ref=e385]:
      - text: "This is also available as a separate page you can print out:"
      - link "bpftrace cheat sheet" [ref=e386] [cursor=pointer]:
        - /url: BPF/bpftrace-cheat-sheet.html
      - text: .
    - heading "Syntax" [level=3] [ref=e387]
    - generic [ref=e388]: "probe[,probe,...] /filter/ { action }"
    - paragraph [ref=e389]: The probe specifies what events to instrument, the filter is optional and can filter down the events based on a boolean expression, and the action is the mini program that runs.
    - paragraph [ref=e390]: "Here's hello world:"
    - generic [ref=e391]: "# bpftrace -e 'BEGIN { printf(\"Hello eBPF!\\n\"); }'"
    - paragraph [ref=e392]: The probe is BEGIN, a special probe that runs at the beginning of the program (like awk). There's no filter. The action is a printf() statement.
    - paragraph [ref=e393]: "Now a real example:"
    - generic [ref=e394]: "# bpftrace -e 'kretprobe:vfs_read /pid == 181/ { @bytes = hist(retval); }'"
    - paragraph [ref=e395]: This uses a kretprobe to instrument the return of the sys_read() kernel function. If the PID is 181, a special map variable @bytes is populated with a log2 histogram function with the return value retval of sys_read(). This produces a histogram of the returned read size for PID 181. Is your app doing lots of 1 byte reads? Maybe that can be optimized.
