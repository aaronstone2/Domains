    - 'heading "5.3. bcc: Tools" [level=2] [ref=e264]'
    - paragraph
    - link [ref=e266] [cursor=pointer]:
      - /url: Perf/bcc_tracing_tools.png
      - img [ref=e267]
    - paragraph
    - paragraph [ref=e268]:
      - text: The
      - link "bcc tools" [ref=e269] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc#tools
      - text: section on github lists these with short descriptions. These tools are mostly for performance observability and debugging.
    - paragraph [ref=e270]: "There are two types of tools:"
    - list [ref=e271]:
      - listitem [ref=e272]: "Single purpose: These tools do one thing and do it well (Unix philosophy). They include execsnoop, opensnoop, ext4slower, biolatency, tcpconnect, oomkill, runqlat, etc. They should be easy to learn and use. Most of the previous examples in the General Performance Checklist were single purpose."
      - listitem [ref=e273]: "Multi-tools: These are powerful tools that can do many things, provided you know which arguments and options to use. They featured in the one-liners section earlier on this page, and include trace, argdist, funccount, funclatency, and stackcount."
    - paragraph [ref=e274]: "Each tool has three related parts. Using biolatency as an example:"
    - heading "1/3. The source" [level=3] [ref=e275]
    - generic [ref=e276]:
      - text: "$ more libbpf-tools/biolatency.c // SPDX-License-Identifier: (LGPL-2.1 OR BSD-2-Clause) // Copyright (c) 2020 Wenbo Zhang // // Based on biolatency(8) from BCC by Brendan Gregg. // 15-Jun-2020 Wenbo Zhang Created this. #include"
      - generic [ref=e277]:
        - text: "#include"
        - generic [ref=e278]:
          - text: "#include"
          - generic [ref=e279]:
            - text: "#include"
            - generic [ref=e280]:
              - text: "#include"
              - generic [ref=e281]:
                - text: "#include"
                - generic [ref=e282]:
                  - text: "#include"
                  - generic [ref=e283]: "#include #include \"blk_types.h\" #include \"biolatency.h\" #include \"biolatency.skel.h\" #include \"trace_helpers.h\" #define ARRAY_SIZE(x) (sizeof(x) / sizeof(*(x))) static struct env { char *disk; time_t interval; int times; [...]"
    - paragraph [ref=e284]: This is the user-space component; in libbpf-tools there is also a biolatency.h header file and a biolatency.bpf.c for kernel BPF code.
    - paragraph [ref=e285]: "Note that bcc also includes the older deprecated versions in Python; E.g.:"
    - generic [ref=e286]: "$ more tools/biolatency.py #!/usr/bin/python # @lint-avoid-python-3-compatibility-imports # # biolatency Summarize block device I/O latency as a histogram. # For Linux, uses BCC, eBPF. # # USAGE: biolatency [-h] [-T] [-Q] [-m] [-D] [interval] [count] # # Copyright (c) 2015 Brendan Gregg. # Licensed under the Apache License, Version 2.0 (the \"License\") # # 20-Sep-2015 Brendan Gregg Created this. [...]"
    - paragraph [ref=e287]: "Tools should begin with a block comment to describe basics: what the tool does, its synopsis, major change history."
    - heading "2/3. An examples file" [level=3] [ref=e288]
    - generic [ref=e289]: "$ more tools/biolatency_example.txt Demonstrations of biolatency, the Linux eBPF/bcc version. biolatency traces block device I/O (disk I/O), and records the distribution of I/O latency (time), printing this as a histogram when Ctrl-C is hit. For example: # ./biolatency Tracing block device I/O... Hit Ctrl-C to end. ^C usecs : count distribution 0 -> 1 : 0 | | 2 -> 3 : 0 | | 4 -> 7 : 0 | | 8 -> 15 : 0 | | 16 -> 31 : 0 | | 32 -> 63 : 0 | | 64 -> 127 : 1 | | 128 -> 255 : 12 |******** | 256 -> 511 : 15 |********** | 512 -> 1023 : 43 |******************************* | 1024 -> 2047 : 52 |**************************************| 2048 -> 4095 : 47 |********************************** | 4096 -> 8191 : 52 |**************************************| 8192 -> 16383 : 36 |************************** | 16384 -> 32767 : 15 |********** | 32768 -> 65535 : 2 |* | 65536 -> 131071 : 2 |* | The latency of the disk I/O is measured from the issue to the device to its completion. A -Q option can be used to include time queued in the kernel. This example output shows a large mode of latency from about 128 microseconds to about 32767 microseconds (33 milliseconds). The bulk of the I/O was between 1 and 8 ms, which is the expected block device latency for rotational storage devices. The highest latency seen while tracing was between 65 and 131 milliseconds: the last row printed, for which there were 2 I/O. [...]"
    - paragraph [ref=e290]: There are detailed examples files in the /tools directory, which include tool output and discussion of what it means.
    - heading "3/3. A man page" [level=3] [ref=e291]
    - generic [ref=e292]: $ nroff -man man/man8/biolatency.8 | more biolatency(8) biolatency(8) NAME biolatency - Summarize block device I/O latency as a histogram. SYNOPSIS biolatency [-h] [-T] [-Q] [-m] [-D] [interval [count]] DESCRIPTION biolatency traces block device I/O (disk I/O), and records the distri- bution of I/O latency (time). This is printed as a histogram either on Ctrl-C, or after a given interval in seconds. The latency of the disk I/O is measured from the issue to the device to its completion. A -Q option can be used to include time queued in the kernel. This tool uses in-kernel eBPF maps for storing timestamps and the his- togram, for efficiency. This works by tracing various kernel blk_*() functions using dynamic tracing, and will need updating to match any changes to these func- tions. Since this uses BPF, only the root user can use this tool. REQUIREMENTS CONFIG_BPF and bcc. OPTIONS -h Print usage message. -T Include timestamps on output. [...]
    - paragraph [ref=e293]: The man pages are the reference for what the tool does, what options it has, what the output means including column definitions, and any caveats including overhead.
    - 'heading "5.4. bcc: Programming" [level=2] [ref=e294]'
    - 'heading "5.4.1. bcc: Programming: libbpf C" [level=2] [ref=e295]'
    - paragraph [ref=e296]: Under construction.
    - 'heading "5.4.2. bcc: Programming: Python" [level=2] [ref=e297]'
    - paragraph [ref=e298]:
      - text: While this is generally deprecated, especially with observability tools that have been moving to libbpf C, you may still find a use case where Python is the best fit. Start with the
      - link "bcc Python Developer Tutorial" [ref=e299] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/docs/tutorial_bcc_python_developer.md
      - text: . It has over 15 lessons that cover all the functions and caveats you'll likely run into. Also see the
      - link "bcc Reference Guide" [ref=e300] [cursor=pointer]:
        - /url: https://github.com/iovisor/bcc/blob/master/docs/reference_guide.md
      - text: ", which explains the API for the eBPF C and the bcc Python. I created both of these. My goal was to be practical and terse: show real examples and code snippets, cover internals and caveats, and do so as briefly as possible. If you hit page down once or twice, you'll hit the next heading, as I've deliberately kept sections short to avoid a wall of text."
    - paragraph [ref=e301]: For people who have more of a casual interest in how bcc/BPF is programmed, I'll summarize key things to know next, and then explain the code from one tool in detail.
    - heading "5 Things To Know" [level=3] [ref=e302]
    - paragraph [ref=e303]: "If you want to dive into coding without reading those references, here's five things to know:"
    - list [ref=e304]:
      - listitem [ref=e305]: "eBPF C is restricted: no unbounded loops or kernel function calls. You can only use the bpf_* functions (and some compiler built-ins)."
      - listitem [ref=e306]: All memory must be read onto the BPF stack first before manipulation via bpf_probe_read(), which does necessary checks. If you want to dereference a->b->c->d, then just try doing it first, as bcc has a rewriter that may turn it into the necessary bpf_probe_read()s. If it doesn't work, add explicit bpf_probe_reads()s.
      - listitem [ref=e307]: "There are 3 ways to output data from kernel to user:"
      - list [ref=e308]:
        - listitem [ref=e309]: "bpf_trace_printk(). Debugging only, this writes to trace_pipe and can clash with other programs and tracers. It's very simple, so I've used it early on in the tutorial, but you should use the following instead:"
        - listitem [ref=e310]: BPF_PERF_OUTPUT(). A way to sending per-event details to user space, via a custom struct you define. (The Python program currently needs a ct version of the struct definition – this should be automatic one day.)
        - listitem [ref=e311]: BPF_HISTOGRAM() or other BPF maps. Maps are a key-value hash from which more advanced data structures can be built. They can be used for summary statistics or histograms, and read periodically from user space (efficient).
      - listitem [ref=e312]: Use static tracepoints (tracepoints/USDT) instead of dynamic tracing (kprobes/uprobes) wherever possible. It's often not possible, but do try. Dynamic tracing is an unstable API, so your programs will break if the code it's instrumenting changes from one release to another.
      - listitem [ref=e313]: Check for bcc developments or switch to bpftrace. Compared to bpftrace, bcc Python is far more verbose and laborious to code.
    - 'heading "Tool example: biolatency.py" [level=3] [ref=e314]'
    - paragraph [ref=e315]:
      - text: The following are all the lines from my original
      - link "biolatency.py" [ref=e316] [cursor=pointer]:
        - /url: eBPF/biolatency.txt
      - text: "tool, enumerated and commented:"
    - generic [ref=e317]: "1 #!/usr/bin/python 2 # @lint-avoid-python-3-compatibility-imports"
    - paragraph [ref=e318]: "Line 1: we're Python. Line 2: I believe suppress a lint warning (these were added for another major companies' build environment)."
    - generic [ref=e319]: "3 # 4 # biolatency Summarize block device I/O latency as a histogram. 5 # For Linux, uses BCC, eBPF. 6 # 7 # USAGE: biolatency [-h] [-T] [-Q] [-m] [-D] [interval] [count] 8 # 9 # Copyright (c) 2015 Brendan Gregg. 10 # Licensed under the Apache License, Version 2.0 (the \"License\") 11 # 12 # 20-Sep-2015 Brendan Gregg Created this."
    - paragraph [ref=e320]: "I have a certain style to my header comments. Line 4 names the tool, and hase a single sentence description. Line 5 adds any caveats: for Linux only, uses BCC/eBPF. It then has a synopsis line, copyright, and a history of major changes."
    - generic [ref=e321]: 13 14 from __future__ import print_function 15 from bcc import BPF 16 from time import sleep, strftime 17 import argparse
    - paragraph [ref=e322]: Note that we import BPF, which we'll use to interact with eBPF in the kernel.
    - generic [ref=e323]: "18 19 # arguments 20 examples = \"\"\"examples: 21 ./biolatency # summarize block I/O latency as a histogram 22 ./biolatency 1 10 # print 1 second summaries, 10 times 23 ./biolatency -mT 1 # 1s summaries, milliseconds, and timestamps 24 ./biolatency -Q # include OS queued time in I/O time 25 ./biolatency -D # show each disk device separately 26 \"\"\" 27 parser = argparse.ArgumentParser( 28 description=\"Summarize block device I/O latency as a histogram\", 29 formatter_class=argparse.RawDescriptionHelpFormatter, 30 epilog=examples) 31 parser.add_argument(\"-T\", \"--timestamp\", action=\"store_true\", 32 help=\"include timestamp on output\") 33 parser.add_argument(\"-Q\", \"--queued\", action=\"store_true\", 34 help=\"include OS queued time in I/O time\") 35 parser.add_argument(\"-m\", \"--milliseconds\", action=\"store_true\", 36 help=\"millisecond histogram\") 37 parser.add_argument(\"-D\", \"--disks\", action=\"store_true\", 38 help=\"print a histogram per disk device\") 39 parser.add_argument(\"interval\", nargs=\"?\", default=99999999, 40 help=\"output interval, in seconds\") 41 parser.add_argument(\"count\", nargs=\"?\", default=99999999, 42 help=\"number of outputs\") 43 args = parser.parse_args() 44 countdown = int(args.count) 45 debug = 0 46"
    - paragraph [ref=e324]: Lines 19 to 44 are argument processing. I'm using Python's argparse here.
    - paragraph [ref=e325]: My intent is to make this a Unix-like tool, something similar to vmstat/iostat, to make it easy for others to recognize and learn. Hence the style of options and arguments, and also to do one thing and do it well. In this case, showing disk I/O latency as a histogram. I could have added a mode to dump per-event details, but made that a separate tool, biosnoop.py.
    - paragraph [ref=e326]: You may be writing bcc/eBPF for other reasons, including agents to other monitoring software, and don't need to worry about the user interface.
    - generic [ref=e327]: "47 # define BPF program 48 bpf_text = \"\"\" 49 #include <uapi/linux/ptrace.h>> 50 #include <linux/blkdev.h> 51 52 typedef struct disk_key { 53 char disk[DISK_NAME_LEN]; 54 u64 slot; 55 } disk_key_t; 56 BPF_HASH(start, struct request *); 57 STORAGE 58 59 // time block I/O 60 int trace_req_start(struct pt_regs *ctx, struct request *req) 61 { 62 u64 ts = bpf_ktime_get_ns(); 63 start.update(&req, &ts); 64 return 0; 65 } 66 67 // output 68 int trace_req_completion(struct pt_regs *ctx, struct request *req) 69 { 70 u64 *tsp, delta; 71 72 // fetch timestamp and calculate delta 73 tsp = start.lookup(&req); 74 if (tsp == 0) { 75 return 0; // missed issue 76 } 77 delta = bpf_ktime_get_ns() - *tsp; 78 FACTOR 79 80 // store as histogram 81 STORE 82 83 start.delete(&req); 84 return 0; 85 } 86 \"\"\""
    - paragraph [ref=e328]: The eBPF program is declared as an inline C assigned to the variable bpf_text.
    - paragraph [ref=e329]: Line 56 declares a hash array caled "start", which uses a struct request pointer as the key. The trace_req_start() function fetches a timestamp using bpf_ktime_get_ns() and then stores it in this hash, keyed by *req (I'm just using that pointer address as a UUID). The trace_req_completion() function then does a lookup on the hash with its *req, to fetch the start time of the request, which is then used to calculate the delta time on line 77. Line 83 deletes the timestamp from the hash.
    - paragraph [ref=e330]: The prototypes to these functions begin with a struct pt_regs * for registers, and then as many of the probed function arguments as you want to include. I've included the first function argument in each, struct request *.
    - paragraph [ref=e331]: "This program also declares storage for the output data and stores it, but there's a problem: biolatency has a -D option to emit per-disk histograms, instead of one histogram for everything, and this changes the storage code. So this eBPF program contains the text STORAGE and STORE (and FACTOR) which are merely strings that we'll search and replace with code next, depending on the options. I'd rather avoid code-that-writes-code if possible, since it makes it harder to debug."
    - generic [ref=e332]: "87 88 # code substitutions 89 if args.milliseconds: 90 bpf_text = bpf_text.replace('FACTOR', 'delta /= 1000000;') 91 label = \"msecs\" 92 else: 93 bpf_text = bpf_text.replace('FACTOR', 'delta /= 1000;') 94 label = \"usecs\" 95 if args.disks: 96 bpf_text = bpf_text.replace('STORAGE', 97 'BPF_HISTOGRAM(dist, disk_key_t);') 98 bpf_text = bpf_text.replace('STORE', 99 'disk_key_t key = {.slot = bpf_log2l(delta)}; ' + 100 'bpf_probe_read(&key.disk, sizeof(key.disk), ' + 101 'req->rq_disk->disk_name); dist.increment(key);') 102 else: 103 bpf_text = bpf_text.replace('STORAGE', 'BPF_HISTOGRAM(dist);') 104 bpf_text = bpf_text.replace('STORE', 105 'dist.increment(bpf_log2l(delta));')"
    - paragraph [ref=e333]: The FACTOR code just changes the units of the time we're recording, depending on the -m option.
    - paragraph [ref=e334]: "Line 95 checks if per-disk has been requested (-D), and if so, replaces the STORAGE and STORE strings with code to do per-disk histograms. It uses the disk_key struct declared on line 52 which is the disk name and the slot (bucket) in the power-of-2 histogram. Line 99 takes the delta time and turns it into the power-of-2 slot index using the bpf_log2l() helper function. Lines 100 and 101 fetch the disk name via bpf_probe_read(), which is how all data is copied onto BPF's stack for operation. Line 101 includes many dereferences: req->rq_disk, rq_disk->disk_name: bcc's rewriter has transparently turned these into bpf_probe_read()s as well."
    - paragraph [ref=e335]: Lines 103 to 105 deal with the single histogram case (not per-disk). A histogram is declared named "dist" using the BPF_HISTOGRAM macro. The slot (bucket) is found using the bpf_log2l() helper function, and then incremented in the histogram.
    - paragraph [ref=e336]: This example is a little gritty, which is both good (realistic) and bad (intimidating). See the tutorial I linked to earlier for more simple examples.
    - generic [ref=e337]: "106 if debug: 107 print(bpf_text)"
    - paragraph [ref=e338]: Since I have code that writes code, I need a way to debug the final output. If debug is set, print it out.
    - generic [ref=e339]: "108 109 # load BPF program 110 b = BPF(text=bpf_text) 111 if args.queued: 112 b.attach_kprobe(event=\"blk_account_io_start\", fn_name=\"trace_req_start\") 113 else: 114 b.attach_kprobe(event=\"blk_start_request\", fn_name=\"trace_req_start\") 115 b.attach_kprobe(event=\"blk_mq_start_request\", fn_name=\"trace_req_start\") 116 b.attach_kprobe(event=\"blk_account_io_completion\", 117 fn_name=\"trace_req_completion\") 118"
    - paragraph [ref=e340]: Line 110 loads the eBPF program.
    - paragraph [ref=e341]: Since this program was written before eBPF had tracepoint support, I wrote it to use kprobes (kernel dynamic tracing). It should be rewritten to use tracepoints, as they are a stable API, although that then also requires a later kernel version (Linux 4.7+).
    - paragraph [ref=e342]: "biolatency.py has a -Q option to included time queued in the kernel. We can see how it's implemented in this code. If it is set, line 112 attaches our eBPF trace_req_start() function with a kprobe on the blk_account_io_start() kernel function, which tracks the request when it's first queued in the kernel. If not set, lnes 114 and 115 attach our eBPF function to different kernel functions, which is when the disk I/O is issued (it can be either of these). This only works because the first argument to any of these kernels functions is the same: struct request *. If their arguments were different, I'd need separate eBPF functions for each to handle that."
    - generic [ref=e343]: "119 print(\"Tracing block device I/O... Hit Ctrl-C to end.\") 120 121 # output 122 exiting = 0 if args.interval else 1 123 dist = b.get_table(\"dist\")"
    - paragraph [ref=e344]: Line 123 fetches the "dist" histogram that was declared and populated by the STORAGE/STORE code.
    - generic [ref=e345]: "124 while (1): 125 try: 126 sleep(int(args.interval)) 127 except KeyboardInterrupt: 128 exiting = 1 129 130 print() 131 if args.timestamp: 132 print(\"%-8s\\n\" % strftime(\"%H:%M:%S\"), end=\"\") 133 134 dist.print_log2_hist(label, \"disk\") 135 dist.clear() 136 137 countdown -= 1 138 if exiting or countdown == 0: 139 exit()"
    - paragraph [ref=e346]: This has logic for printing every interval, a certain number of times (countdown). Lines 131 and 132 print a timestamp if the -T option was used.
    - paragraph [ref=e347]: Line 134 prints the histogram, or histograms if we're doing per-disk. The first argument is the label variable, which contains "usecs" or "msecs", and decorates the column of values in the output. The second argument is labels the secondary key, if dist has per-disk histograms. How print_log2_hist() can identify whether this is a single histogram or has a secondary key, I'll leave as an adventurous exercise in code spelunking of bcc and eBPF internals.
    - paragraph [ref=e348]: Line 135 clears the histogram, ready for the next interval.
    - paragraph [ref=e349]: "Here is some sample output:"
    - generic [ref=e350]: "# biolatency Tracing block device I/O... Hit Ctrl-C to end. ^C usecs : count distribution 0 -> 1 : 0 | | 2 -> 3 : 0 | | 4 -> 7 : 0 | | 8 -> 15 : 0 | | 16 -> 31 : 0 | | 32 -> 63 : 0 | | 64 -> 127 : 1 | | 128 -> 255 : 12 |******** | 256 -> 511 : 15 |********** | 512 -> 1023 : 43 |******************************* | 1024 -> 2047 : 52 |**************************************| 2048 -> 4095 : 47 |********************************** | 4096 -> 8191 : 52 |**************************************| 8192 -> 16383 : 36 |************************** | 16384 -> 32767 : 15 |********** | 32768 -> 65535 : 2 |* | 65536 -> 131071 : 2 |* |"
    - paragraph [ref=e351]: "Per-disk output:"
    - generic [ref=e352]: "# biolatency -D Tracing block device I/O... Hit Ctrl-C to end. ^C disk = 'xvdb' usecs : count distribution 0 -> 1 : 0 | | 2 -> 3 : 0 | | 4 -> 7 : 0 | | 8 -> 15 : 0 | | 16 -> 31 : 0 | | 32 -> 63 : 0 | | 64 -> 127 : 18 |**** | 128 -> 255 : 167 |****************************************| 256 -> 511 : 90 |********************* | disk = 'xvdc' usecs : count distribution 0 -> 1 : 0 | | 2 -> 3 : 0 | | 4 -> 7 : 0 | | 8 -> 15 : 0 | | 16 -> 31 : 0 | | 32 -> 63 : 0 | | 64 -> 127 : 22 |**** | 128 -> 255 : 179 |****************************************| 256 -> 511 : 88 |******************* | disk = 'xvda1' usecs : count distribution 0 -> 1 : 0 | | 2 -> 3 : 0 | | 4 -> 7 : 0 | | 8 -> 15 : 0 | | 16 -> 31 : 0 | | 32 -> 63 : 0 | | 64 -> 127 : 0 | | 128 -> 255 : 0 | | 256 -> 511 : 167 |****************************************| 512 -> 1023 : 44 |********** | 1024 -> 2047 : 9 |** | 2048 -> 4095 : 4 | | 4096 -> 8191 : 34 |******** | 8192 -> 16383 : 44 |********** | 16384 -> 32767 : 33 |******* | 32768 -> 65535 : 1 | | 65536 -> 131071 : 1 | |"
    - paragraph [ref=e353]: From the output we can see that xvdb and xvdc have similar latency histograms, whereas xvda1 is quite different and bimodal, with a higher latency mode between 4 and 32 milliseconds.
    - heading "6. bpftrace" [level=1] [ref=e354]
    - paragraph [ref=e355]:
      - text: bpftrace is at
      - link "github.com/iovisor/bpftrace" [ref=e356] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace
      - text: ", and is a high-level front-end for BPF tracing, which uses libraries from"
      - link "bcc" [ref=e357] [cursor=pointer]:
        - /url: "#bcc"
      - text: . bpftrace is ideal for ad hoc instrumentation with powerful custom one-liners and short scripts, whereas bcc is ideal for complex tools and daemons. bpftrace was created by
      - link "Alastair Robertson" [ref=e358] [cursor=pointer]:
        - /url: http://ajor.co.uk/
      - text: as a spare time project.
    - paragraph [ref=e359]:
      - text: I contributed many capabilities and fixes to bpftrace, as well as tools and their example files and man pages. I also created the bpftrace
      - link "One-Liners Tutorial" [ref=e360] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace/blob/master/docs/tutorial_one_liners.md
      - text: ", the"
      - link "Reference Guide" [ref=e361] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace/blob/master/docs/reference_guide.md
      - text: ", and the"
      - link "Internals Development Guide" [ref=e362] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace/blob/master/docs/internals_development.md
      - text: ", and published blog"
      - link "posts" [ref=e363] [cursor=pointer]:
        - /url: http://www.brendangregg.com/blog/
      - text: . I'll summarize bpftrace here, but I've written and published a lot more detail in those resources for those wishing to dig deeper.
    - 'heading "6.1. bpftrace: Installation" [level=2] [ref=e364]'
    - paragraph [ref=e365]:
      - text: See the
      - link "bpftrace install instructions" [ref=e366] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace/blob/master/INSTALL.md
      - text: "for getting started on different Linux distros. One of these might be possible!:"
    - generic [ref=e367]: "# snap install bpftrace # yum install bpftrace # apt-get install bpftrace"
    - paragraph [ref=e368]: But these are still under development, and you may need to refer to the full instructions in the previous link to get it to work. The only place I know where it "just works" is within some large tech companies who have built it in their internal repos.
    - paragraph [ref=e369]: "To test if your install works, try a basic one-liner:"
    - generic [ref=e370]: "# sudo bpftrace -e 'BEGIN { printf(\"Hello BPF!\\n\"); exit(); }' Attaching 1 probe... Hello BPF!"
    - 'heading "6.2. bpftrace: One-Liners" [level=2] [ref=e371]'
    - paragraph [ref=e372]:
      - text: The following are from my
      - link "One-Liners Tutorial" [ref=e373] [cursor=pointer]:
        - /url: https://github.com/iovisor/bpftrace/blob/master/docs/tutorial_one_liners.md
      - text: ", which has more details on each:"
    - generic [ref=e374]: "1. Listing probes bpftrace -l 'tracepoint:syscalls:sys_enter_*' 2. Hello world bpftrace -e 'BEGIN { printf(\"hello world\\n\"); }' 3. File opens bpftrace -e 'tracepoint:syscalls:sys_enter_open { printf(\"%s %s\\n\", comm, str(args->filename)); }' 4. Syscall counts by process bpftrace -e 'tracepoint:raw_syscalls:sys_enter { @[comm] = count(); }' 5. Distribution of read() bytes bpftrace -e 'tracepoint:syscalls:sys_exit_read /pid == 18644/ { @bytes = hist(args->retval); }' 6. Kernel dynamic tracing of read() bytes bpftrace -e 'kretprobe:vfs_read { @bytes = lhist(retval, 0, 2000, 200); }' 7. Timing read()s bpftrace -e 'kprobe:vfs_read { @start[tid] = nsecs; } kretprobe:vfs_read /@start[tid]/ { @ns[comm] = hist(nsecs - @start[tid]); delete(@start[tid]); }' 8. Count process-level events bpftrace -e 'tracepoint:sched:sched* { @[name] = count(); } interval:s:5 { exit(); }' 9. Profile on-CPU kernel stacks bpftrace -e 'profile:hz:99 { @[stack] = count(); }' 10. Scheduler tracing bpftrace -e 'tracepoint:sched:sched_switch { @[stack] = count(); }' 11. Block I/O tracing bpftrace -e 'tracepoint:block:block_rq_complete { @ = hist(args->nr_sector * 512); }'"
    - paragraph [ref=e375]: If you can run and understand these one-liners, you'll have learned a lot of bpftrace.
    - paragraph [ref=e376]: "Here is some output of file opens:"
    - generic [ref=e377]: "# bpftrace -e 'tracepoint:syscalls:sys_enter_open { printf(\"%s %s\\n\", comm, str(args->filename)); }' Attaching 1 probe... snmpd /proc/net/dev snmpd /proc/net/if_inet6 snmpd /sys/class/net/docker0/device/vendor snmpd /proc/sys/net/ipv4/neigh/docker0/retrans_time_ms snmpd /proc/sys/net/ipv6/neigh/docker0/retrans_time_ms snmpd /proc/sys/net/ipv6/conf/docker0/forwarding snmpd /proc/sys/net/ipv6/neigh/docker0/base_reachable_time_ms snmpd /sys/class/net/eth0/device/vendor snmpd /sys/class/net/eth0/device/device snmpd /proc/sys/net/ipv4/neigh/eth0/retrans_time_ms snmpd /proc/sys/net/ipv6/neigh/eth0/retrans_time_ms snmpd /proc/sys/net/ipv6/conf/eth0/forwarding snmpd /proc/sys/net/ipv6/neigh/eth0/base_reachable_time_ms snmpd /sys/class/net/lo/device/vendor snmpd /proc/sys/net/ipv4/neigh/lo/retrans_time_ms snmpd /proc/sys/net/ipv6/neigh/lo/retrans_time_ms snmpd /proc/sys/net/ipv6/conf/lo/forwarding snmpd /proc/sys/net/ipv6/neigh/lo/base_reachable_time_ms snmp-pass /proc/cpuinfo snmp-pass /proc/stat"
    - paragraph [ref=e378]: Tracing which files have been opened can be a quick way to locate config files, log files, data files, libraries, and other things of interest.
