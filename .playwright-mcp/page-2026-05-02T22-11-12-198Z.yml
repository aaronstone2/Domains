                    - img "License" [ref=e808]
                - paragraph [ref=e809]:
                  - text: bpftrace is a general purpose tracing tool and language for Linux. It leverages
                  - link "eBPF" [ref=e810] [cursor=pointer]:
                    - /url: https://ebpf.io/what-is-ebpf/
                  - text: to provide powerful, efficient tracing capabilities with minimal overhead. bpftrace uses
                  - link "LLVM" [ref=e811] [cursor=pointer]:
                    - /url: https://llvm.org/
                  - text: as a compiler backend, and
                  - link "libbpf" [ref=e812] [cursor=pointer]:
                    - /url: https://github.com/libbpf/libbpf
                  - text: for interacting with the Linux BPF subsystem, including kernel dynamic tracing (
                  - link "kprobes" [ref=e813] [cursor=pointer]:
                    - /url: https://docs.kernel.org/trace/kprobes.html
                  - text: ","
                  - link "hardware and software perf events" [ref=e814] [cursor=pointer]:
                    - /url: https://docs.ebpf.io/linux/program-type/BPF_PROG_TYPE_PERF_EVENT/
                  - text: ), user-level dynamic tracing (
                  - link "USDT" [ref=e815] [cursor=pointer]:
                    - /url: https://docs.ebpf.io/linux/concepts/usdt/
                  - text: ","
                  - link "uprobes" [ref=e816] [cursor=pointer]:
                    - /url: https://docs.ebpf.io/linux/program-type/BPF_PROG_TYPE_KPROBE/
                  - text: ), tracepoints (
                  - link "regular" [ref=e817] [cursor=pointer]:
                    - /url: https://docs.ebpf.io/linux/program-type/BPF_PROG_TYPE_TRACEPOINT/
                  - text: ","
                  - link "raw" [ref=e818] [cursor=pointer]:
                    - /url: https://docs.ebpf.io/linux/program-type/BPF_PROG_TYPE_RAW_TRACEPOINT/
                  - text: ), and
                  - link "more" [ref=e819] [cursor=pointer]:
                    - /url: https://docs.ebpf.io/linux/program-type/BPF_PROG_TYPE_TRACING/
                  - text: . The bpftrace language is inspired by awk, C, and predecessor tracers such as DTrace and SystemTap.
                - paragraph [ref=e820]:
                  - text: Visit
                  - strong [ref=e821]:
                    - link "bpftrace.org" [ref=e822] [cursor=pointer]:
