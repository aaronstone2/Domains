                    - generic [ref=e124]:
                      - heading "Definition" [level=2] [ref=e125]
                      - text: Pyramidal systems refer to a particular type of resistance training in which sets are performed with increasing (or decreasing) weight, in such a way that the number of repetitions is low when the weight is high (and vice versa). Multiple implementations exist such as the light-to-heavy, triangle or asymmetric triangle system. They are similar to traditional training, but with slightly different impact on training volume, endurance or power outcome. Therefore, pyramidal systems are ideal candidates for practitioners willing to tune their training routine.
                    - generic [ref=e127]:
                      - text: "Keywords:"
                      - link "resistance training" [ref=e128] [cursor=pointer]:
                        - /url: /search?q=resistance+training
                      - text: ;
                      - link "pyramidal systems" [ref=e129] [cursor=pointer]:
