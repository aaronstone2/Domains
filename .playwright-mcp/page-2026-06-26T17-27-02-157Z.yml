                    - generic [ref=e137]:
                      - heading "1. Introduction" [level=2] [ref=e138]
                      - generic [ref=e139]:
                        - text: Resistance training refers to a specialized method of conditioning which involves the progressive use of a wide range of resistive loads and a variety of training modalities designed to enhance health, fitness, and sports performance [
                        - link "1" [ref=e140] [cursor=pointer]:
                          - /url: "#B1-encyclopedia-01-00035"
                        - text: "]. Muscular resistance exercises usually consist of one or multiple sets of repetitions spaced by resting time using the same or different resistance. Although one set requires less time to be executed than multiple sets, performing multiple sets results in greater strength and hypertrophy ["
                        - link "2" [ref=e141] [cursor=pointer]:
                          - /url: "#B2-encyclopedia-01-00035"
                        - text: ","
                        - link "3" [ref=e142] [cursor=pointer]:
                          - /url: "#B3-encyclopedia-01-00035"
                        - text: "]. Fitness enthusiasts and researchers have created several multiset training systems, such as circuits, drop and strip, superset, and pyramidal training. A ubiquitous recommendation from domain references, such as the American College of Sports Medicine (ACSM) or National Strength and Conditioning Association (NSCA), is to perform two to three sets with 8 to 12 repetitions at 67–85% of the one-repetition maximum (1RM) ["
                        - link "4" [ref=e143] [cursor=pointer]:
                          - /url: "#B4-encyclopedia-01-00035"
                        - text: ","
                        - link "5" [ref=e144] [cursor=pointer]:
                          - /url: "#B5-encyclopedia-01-00035"
                        - text: "]. The present research refers to such a style of training as traditional training. Traditional training varies according to athletes’ level and trainability, such as age and previous training experience. In particular, regular variation of the training program, such as changing the training method or volume, is necessary to maintain the progression. This is because the body quickly adapts to resistance training, and thus changes are necessary for continual progression to occur ["
                        - link "6" [ref=e145] [cursor=pointer]:
                          - /url: "#B6-encyclopedia-01-00035"
                        - text: "]. Regarding age, experts recommend tailoring the physical activity to the subject’s limitations and chronic conditions ["
                        - link "7" [ref=e146] [cursor=pointer]:
                          - /url: "#B7-encyclopedia-01-00035"
                        - text: "]. Having several resistance training methods to draw on allows the routine to be adapted to the practitioner’s physical condition and avoids a plateau in progression. The pyramidal system of training refers to methods in which sets are performed with increasing (or decreasing) weights and repetitions, in such a way that the number of repetitions is low when the weight is high (and vice versa) ["
                        - link "8" [ref=e147] [cursor=pointer]:
                          - /url: "#B8-encyclopedia-01-00035"
                        - text: "]. In this article, we conduct a narrative review of the pyramidal method. Methodology for this review is presented in"
                        - link "Section 2" [ref=e148] [cursor=pointer]:
                          - /url: "#sec2-encyclopedia-01-00035"
                        - text: .
                        - link "Section 3" [ref=e149] [cursor=pointer]:
                          - /url: "#sec3-encyclopedia-01-00035"
                        - text: presents the physiological adaptations to pyramidal training, while
                        - link "Section 4" [ref=e150] [cursor=pointer]:
                          - /url: "#sec4-encyclopedia-01-00035"
                        - text: ","
                        - link "Section 5" [ref=e151] [cursor=pointer]:
                          - /url: "#sec5-encyclopedia-01-00035"
                        - text: and
                        - link "Section 6" [ref=e152] [cursor=pointer]:
                          - /url: "#sec6-encyclopedia-01-00035"
                        - text: define then draw comparisons of pyramidal systems, one to each other and with traditional training. The discussion and conclusion are presented in
                        - link "Section 7" [ref=e153] [cursor=pointer]:
                          - /url: "#sec7-encyclopedia-01-00035"
                        - text: .
                    - generic [ref=e154]:
                      - heading "2. Method" [level=2] [ref=e155]
                      - generic [ref=e156]: "In order to conduct this narrative review, studies were searched in Scholar (Google, Mountain View, CA, USA) and PubMed (NCBI, Bethesda, MD, USA) by using combinations of the following keywords: “Adaptation”, “Cardiovascular”, “Comparison”, “Heavy-to-Light”, “Light-to-Heavy”, “Pyramid”, “Pyramidal”, “Resistance”, “Sport”, “Strength”, “System”, “Training”, “Triangle”. We then restricted the scope of the search to resistance and strength training and removed from the analysis all studies focusing on the domain of endurance sport, formation, and cognition. All types of publication, except for opinion and poster, were considered."
                    - generic [ref=e157]:
                      - heading "3. Physiological Adaptation to Pyramidal Resistance Training" [level=2] [ref=e158]
                      - generic [ref=e159]:
                        - text: The body’s adaptation to pyramidal and, in general, resistance training occurs in many systems, including the cardiovascular, endocrine, nervous, and immune systems. An exhaustive literature review is presented in Fleck et al. [
                        - link "8" [ref=e160] [cursor=pointer]:
                          - /url: "#B8-encyclopedia-01-00035"
                        - text: "] and Schoenfeld ["
                        - link "9" [ref=e161] [cursor=pointer]:
                          - /url: "#B9-encyclopedia-01-00035"
                        - text: "]. The following sections describe these adaptations."
                      - generic [ref=e162]:
                        - heading "3.1. Anaerobic Adaptations" [level=3] [ref=e163]
                        - generic [ref=e164]:
                          - text: Resistance training usually involves short and intense bouts of exercise (<2 min), and, therefore, relies heavily on the anaerobic pathway for energy production. Energy is produced through the degradation of creatine phosphate and glucose into ATP without the need of oxygen. These reactions are fast compared with the aerobic pathway, though they deliver significantly less energy. Resistance training results in the augmentation of the creatine, glycogen, and ATP concentration, leading to an improved anaerobic pathway [
                          - link "10" [ref=e165] [cursor=pointer]:
                            - /url: "#B10-encyclopedia-01-00035"
                          - text: "]."
                      - generic [ref=e166]:
                        - heading "3.2. Aerobic Adaptations" [level=3] [ref=e167]
                        - generic [ref=e168]: The mitochondria are micro-organisms that are present in the body’s cells. They are responsible for the conversion of glucose and fat into ATP using oxygen. In general, training increases the number of mitochondria inside the muscular cells, which results in a higher proportion of energy expenditure from the aerobic pathway during exercise, thereby sparing muscle glycogen and creatine reserve. This effect is sustained by the redirection of blood flow to the working muscles while exercising, which, supported by an improved cardiac output function, ensures the continued delivery of oxygen, liver glycogen, and fat.
                        - generic [ref=e169]:
                          - text: Although the improvement in fat metabolism and the aerobic pathway is less pronounced in resistance versus endurance training, it is known that resistance training enhances local muscle endurance [
                          - link "8" [ref=e170] [cursor=pointer]:
                            - /url: "#B8-encyclopedia-01-00035"
                          - text: "]. This results in an increased ability to perform repetitions during a set, which in turn produces higher hypertrophy and strength, as these training outcomes tend to increase as a function of the training volume."
                        - generic [ref=e171]:
                          - text: Pyramidal methods likely enhance aerobic energy mechanisms, thereby enhancing local endurance more so compared with traditional training, as first sets are performed with less weight, which allows for more repetitions to be performed. Mohammadi et al. [
                          - link "11" [ref=e172] [cursor=pointer]:
                            - /url: "#B11-encyclopedia-01-00035"
                          - text: "] and Omidbakhsh et al. ["
                          - link "12" [ref=e173] [cursor=pointer]:
                            - /url: "#B12-encyclopedia-01-00035"
                          - text: "] demonstrated that pyramidal methods efficiently enhance wrestling athletes’ endurance. However, to the best of our knowledge, endurance outcome in traditional versus pyramidal resistance training was never compared."
                      - generic [ref=e174]:
                        - heading "3.3. Neural Adaptations" [level=3] [ref=e175]
                        - generic [ref=e176]:
                          - text: The expected effect of the pyramidal method and, in general, resistance training is an increase in strength due to neural and muscular adaptation. Neural adaptations occur first in beginners, causing changes in the motor unit firing pattern [
                          - link "13" [ref=e177] [cursor=pointer]:
                            - /url: "#B13-encyclopedia-01-00035"
                          - text: "]. In practice, this means that strength depends on the number of myofibers that motor units can recruit to perform a movement while releasing antagonist muscle and protecting joints."
                      - generic [ref=e178]:
                        - heading "3.4. Muscular Adaptations" [level=3] [ref=e179]
                        - generic [ref=e180]:
                          - text: High-intensity training, such as training to failure, causes micro-myofiber lesions, which results in soreness and muscle catabolism. This sets off a chain of myogenic events leading to an increase in myofiber size (hypertrophy) and—to a lesser and controversial extent—an increase in their number (hyperplasia). Hypertrophy is likely mediated by satellite cells, which activate when sufficient mechanical stimuli are imposed on skeletal muscles. Satellite cells then proliferate and fuse to existing cells or create new myofibers [
                          - link "9" [ref=e181] [cursor=pointer]:
                            - /url: "#B9-encyclopedia-01-00035"
                          - text: ","
                          - link "14" [ref=e182] [cursor=pointer]:
                            - /url: "#B14-encyclopedia-01-00035"
                          - text: "]."
                        - generic [ref=e183]:
                          - text: Blood occlusion through asphyxia during exercise likely contributes to hypertrophy [
                          - link "15" [ref=e184] [cursor=pointer]:
                            - /url: "#B15-encyclopedia-01-00035"
                          - text: "]. It is possible that blood occlusion inhibits myostatin ["
                          - link "16" [ref=e185] [cursor=pointer]:
                            - /url: "#B16-encyclopedia-01-00035"
                          - text: "], which is known to play a role in cachexia. Although pyramidal training is suspected of impacting microvascular oxygenation during exercise, recent findings suggest that microvascular oxygenation is similar in pyramidal and traditional training ["
                          - link "17" [ref=e186] [cursor=pointer]:
                            - /url: "#B17-encyclopedia-01-00035"
                          - text: "]."
                        - generic [ref=e187]: Resistance training also changes muscle composition by stimulating type IIA and type IIX myofibers. Both allow for quick force production and muscle contraction but are less resistant to fatigue compared to type I fibers, which are typically associated with endurance. However, type IIA fibers incorporate more mitochondria and, therefore, are more resistant to fatigue than type IIX fibers. Hypertrophy applies to all fiber types, although type I fibers are impacted to a lesser extent.
                        - generic [ref=e188]:
                          - text: As demonstrated in
                          - link "Section 6.1" [ref=e189] [cursor=pointer]:
                            - /url: "#sec6dot1-encyclopedia-01-00035"
                          - text: ", muscular adaptations to resistance and pyramidal training are similar."
                      - generic [ref=e190]:
                        - heading "3.5. Endocrinal Adaptations" [level=3] [ref=e191]
                        - generic [ref=e192]:
                          - text: Hormones and cytokines, such as insulin, growth hormone, or testosterone, are upstream regulators of muscle anabolism. In general, hormonal regulation of hypertrophy is complex and the importance of hormones in the physiological adaptations resulting from exercise should be considered with caution [
                          - link "9" [ref=e193] [cursor=pointer]:
                            - /url: "#B9-encyclopedia-01-00035"
                          - text: ","
                          - link "10" [ref=e194] [cursor=pointer]:
                            - /url: "#B10-encyclopedia-01-00035"
                          - text: "]."
                        - generic [ref=e195]:
                          - text: For example, although testosterone is a well-known anabolic hormone, the testosterone level of elite athletes is lower than the reference range for non-elite men. Further, powerlifters have a lower testosterone level on average compared with levels recorded in other sports, such as skiing or basketball [
                          - link "18" [ref=e196] [cursor=pointer]:
                            - /url: "#B18-encyclopedia-01-00035"
                          - text: "]. These surprising findings suggest that it is rather the sensitivity threshold to testosterone that increases in training. Ribeiro et al. ["
                          - link "19" [ref=e197] [cursor=pointer]:
                            - /url: "#B19-encyclopedia-01-00035"
                          - text: "] have shown that, for older women, blood concentration of testosterone and insulin was similar in pyramidal and traditional training. Results are hardly generalizable, though, because only older women participated in the study. Nevertheless, to the best of our knowledge, hormonal response induced by pyramidal and traditional training are comparable."
                      - generic [ref=e198]:
                        - heading "3.6. Cardiovascular Adaptations" [level=3] [ref=e199]
                        - generic [ref=e200]:
                          - text: Although resistance training is not a type of cardiovascular training, the compression of blood vessels along with the Valsalva maneuver produces extreme blood pressure [
                          - link "20" [ref=e201] [cursor=pointer]:
                            - /url: "#B20-encyclopedia-01-00035"
                          - text: "]. This response is attenuated in trained athletes during exercises ["
                          - link "21" [ref=e202] [cursor=pointer]:
                            - /url: "#B21-encyclopedia-01-00035"
                          - text: "]. The impact of resistance training on cardiovascular function was outlined in recent studies, with positive effects on blood pressure noted at rest ["
                          - link "22" [ref=e203] [cursor=pointer]:
                            - /url: "#B22-encyclopedia-01-00035"
                          - text: "], although the underlying mechanisms for this remain under investigation ["
                          - link "23" [ref=e204] [cursor=pointer]:
                            - /url: "#B23-encyclopedia-01-00035"
                          - text: "]. One study ["
                          - link "24" [ref=e205] [cursor=pointer]:
                            - /url: "#B24-encyclopedia-01-00035"
                          - text: "] found that the pyramidal method specifically reduced blood viscosity, thereby diminishing cardiovascular risk factors."
                        - generic [ref=e206]:
                          - text: Despite these positive effects, there is an increase in aortic stiffness when performing high-intensity resistance training [
                          - link "25" [ref=e207] [cursor=pointer]:
                            - /url: "#B25-encyclopedia-01-00035"
                          - text: ","
                          - link "26" [ref=e208] [cursor=pointer]:
                            - /url: "#B26-encyclopedia-01-00035"
                          - text: ","
                          - link "27" [ref=e209] [cursor=pointer]:
                            - /url: "#B27-encyclopedia-01-00035"
                          - text: "]. Aortic stiffness is associated with lower muscular strength ["
                          - link "28" [ref=e210] [cursor=pointer]:
                            - /url: "#B28-encyclopedia-01-00035"
                          - text: "] and is an established risk factor for cardiovascular morbidity. The mechanisms that underlie the loss of aortic compliance following strength training are not clear ["
                          - link "15" [ref=e211] [cursor=pointer]:
                            - /url: "#B15-encyclopedia-01-00035"
                          - text: "], though this can be compensated for by adding an aerobic component to the training ["
                          - link "29" [ref=e212] [cursor=pointer]:
                            - /url: "#B29-encyclopedia-01-00035"
                          - text: ","
                          - link "30" [ref=e213] [cursor=pointer]:
                            - /url: "#B30-encyclopedia-01-00035"
                          - text: "]. In this respect, the effects of pyramidal training on aortic compliance deserve further investigation, particularly because of its impact on endurance, that is, aerobic capacity."
                    - generic [ref=e214]:
                      - heading "4. Classification of Pyramidal Training Systems" [level=2] [ref=e215]
                      - generic [ref=e216]: "To our knowledge, there are five common pyramidal systems, which are defined as follows:"
                      - list [ref=e218]:
                        - listitem [ref=e219]:
                          - generic [ref=e220]: "Half-triangle pyramid:"
                          - generic [ref=e222]:
                            - term [ref=e223]: ○
                            - definition [ref=e224]:
                              - generic [ref=e225]: "Heavy-to-light (HL): the practitioner decreases the weight between sets while increasing the number of repetitions."
                            - term [ref=e226]: ○
                            - definition [ref=e227]:
                              - generic [ref=e228]: "Light-to-Heavy (LH): the practitioner increases the weight between sets while decreasing the number of repetitions."
                        - listitem [ref=e229]:
                          - generic [ref=e230]: "Triangle pyramid: a combination of HL and LH protocols, as follows:"
                          - generic [ref=e232]:
                            - term [ref=e233]: ○
                            - definition [ref=e234]:
                              - generic [ref=e235]: "Double progressive system or reversed pyramid (RP): a combination of an HL pyramid followed by an LH pyramid, except that only the number of repetitions increases in the first phase while the weight remains the same."
                            - term [ref=e236]: ○
                            - definition [ref=e237]:
                              - generic [ref=e238]: "Symmetric pyramid (SYM): a combination of an LH pyramid followed by an HL pyramid in which sets from the LH phase are applied in reverse order in the HL phase."
                            - term [ref=e239]: ○
                            - definition [ref=e240]:
                              - generic [ref=e241]: "Asymmetric or diagonal pyramid (ASYM): similar to SYM pyramid, except the number, weight, and repetition number of sets differ between the first and second phases."
                      - generic [ref=e242]:
                        - text: Examples of pyramidal training protocols are described in
                        - link "Table 1" [ref=e243] [cursor=pointer]:
                          - /url: "#table_body_display_encyclopedia-01-00035-t001"
                        - text: .
                      - generic [ref=e244]:
                        - generic [ref=e245]: Table 1. Training volume difference * between pyramidal and resistance training, depending on if the training targets strength endurance (green), hypertrophy (orange) or maximum strength (red).
                        - generic [ref=e247] [cursor=pointer]:
                          - img [ref=e248]
                          - link [ref=e249]:
                            - /url: "#table_body_display_encyclopedia-01-00035-t001"
                    - generic [ref=e250]:
                      - heading "5. Training Volume of Pyramidal Methods" [level=2] [ref=e251]
                      - generic [ref=e252]:
                        - text: Training volume refers to the amount of work (in joules) performed during a given period, such as one training session or one week [
                        - link "8" [ref=e253] [cursor=pointer]:
                          - /url: "#B8-encyclopedia-01-00035"
                        - text: "]. For example, an exercise performed once a week, consisting of 10 squats at 100 kg, results in 9800 N/week. Assuming that the vertical distance traveled by the weight during the exercise is around 0.5 m, the resulting amount of work is equal to 4900 J/week. When comparing training volumes produced by a practitioner on the same exercise, such traveled distance is always identical and thus the training volume can be estimated by only multiplying the weight with the number of repetitions—that is, 9800 N/week in our example."
                      - generic [ref=e254]:
                        - text: There is a clear relationship between training volume and outcomes, such as increases in strength and power, decreases in body fat, and improved motor performance. It has been suggested that the training volume is more important than the training frequency and number of sets in terms of strength gains [
                        - link "8" [ref=e255] [cursor=pointer]:
                          - /url: "#B8-encyclopedia-01-00035"
                        - text: "]. A recent meta-analysis ["
                        - link "31" [ref=e256] [cursor=pointer]:
                          - /url: "#B31-encyclopedia-01-00035"
                        - text: "] demonstrated that an increase in resistance training volume produced higher hypertrophy and concluded that a dose-dependent effect was responsible. The same conclusion has also been applied to endurance training ["
                        - link "32" [ref=e257] [cursor=pointer]:
                          - /url: "#B32-encyclopedia-01-00035"
                        - text: "], although this is more controversial ["
                        - link "33" [ref=e258] [cursor=pointer]:
                          - /url: "#B33-encyclopedia-01-00035"
                        - text: "]. Costill et al. ["
                        - link "33" [ref=e259] [cursor=pointer]:
                          - /url: "#B33-encyclopedia-01-00035"
                        - text: "] studied the implication of short versus long training sessions on swimming performance (assessed by the 25 and 400 yard tests). Training consisted of intermittent bouts of exercise (i.e., interval training) in all four of the swimming strokes. The study showed that swimmers who trained 3 h per day did not improve their performance compared to swimmers who trained only 1.5 h per day. However, it could be that the test was not adapted to the training provided, or swimmers from the first group were overtrained. In sum, all training outcomes are dose-dependent on training volume unless the training volume exceeds athletes’ capacity to rest and compensate."
                        - link "Table 1" [ref=e260] [cursor=pointer]:
                          - /url: "#table_body_display_encyclopedia-01-00035-t001"
                        - text: illustrates the training volume across the different types of pyramidal training. The table adopts the training volume classification of the NCSA [
                        - link "5" [ref=e261] [cursor=pointer]:
                          - /url: "#B5-encyclopedia-01-00035"
                        - text: "], that is, maximum strength (for repetitions ≤ 6 and weight ≥ 85% 1RM), hypertrophy (for repetitions and weight respectively in the ranges 6–12 and 67–85% 1RM) and strength endurance (for repetitions ≥ 12 and weight ≤ 67% 1RM)."
                    - generic [ref=e262]:
                      - heading "6. Comparison of Pyramidal Training Systems" [level=2] [ref=e263]
                      - generic [ref=e264]: "Training with heavy or light weights results in different muscular adaptations: endurance, strength, hypertrophy, or power. Therefore, pyramidal training is a priori a very complete method of producing all these adaptations within a single exercise compared with traditional training. Having said that, there are significant differences between different pyramidal systems."
                      - generic [ref=e265]:
                        - heading "6.1. Comparison with Traditional Training" [level=3] [ref=e266]
                        - generic [ref=e267]:
                          - text: Evidence suggests that half-triangle pyramids and traditional training are equivalent in terms of strength gains and muscle hypertrophy. Angleri et al. [
                          - link "34" [ref=e268] [cursor=pointer]:
                            - /url: "#B34-encyclopedia-01-00035"
                          - text: "] conducted a randomized intrasubject study over 12 weeks of leg training. Participants trained one leg with traditional training and the other leg using the drop-set or LH system. The study showed that LH and drop-set systems did not result in a significantly greater increase in 1RM or muscle cross-section area compared with traditional training. All subjects in the study were already well trained. However, interestingly, the same results were observed in another population. In an eight-week full-body randomized training crossover study ["
                          - link "35" [ref=e269] [cursor=pointer]:
                            - /url: "#B35-encyclopedia-01-00035"
                          - text: "], Ribeiro et al. showed that there was no difference between the increase in muscle quality between an 8-weeks traditional or LH training. Muscle quality is defined by the maximal force produced per unit of muscle mass ["
                          - link "36" [ref=e270] [cursor=pointer]:
                            - /url: "#B36-encyclopedia-01-00035"
                          - text: "] and was computed by dividing the heaviest weight lifted in 1RM by the skeletal muscle mass (estimated by dual X-ray absorptiometry). Regardless of muscle hypertrophy and composition, this indicates that the amount of strength relative to the size of the muscle improved similarly between the two kinds of trainings. In another analysis of the same experiment ["
                          - link "19" [ref=e271] [cursor=pointer]:
                            - /url: "#B19-encyclopedia-01-00035"
                          - text: "], Ribeiro et al. showed that both trainings similarly impacted muscular strength (1RM) and hypertrophy (estimated by dual X-ray absorptiometry). However, only older women participated in the study, and the impact of contraction types (eccentric, concentric, plyometric, or isometric) was not discussed in these studies."
                        - generic [ref=e272]:
                          - text: For a practitioner willing to spare time, half-triangle pyramids have a lower workload than traditional training or triangle pyramids (
                          - link "Table 1" [ref=e273] [cursor=pointer]:
                            - /url: "#table_body_display_encyclopedia-01-00035-t001"
                          - text: ). In fact, by working at a higher intensity, pyramidal methods recruit an increased number of fast-moving motor units, which compensated for the loss of training volume. Triangle pyramids have the same or a slightly higher training volume than traditional training. However, the number of repetitions performed at low intensity and high frequency is higher in triangle pyramids than in traditional or half-pyramidal training. That is, a greater endurance outcome can be expected in triangle pyramids versus traditional training.
                        - generic [ref=e274]:
                          - text: In contrast, Costa et al. [
                          - link "37" [ref=e275] [cursor=pointer]:
                            - /url: "#B37-encyclopedia-01-00035"
                          - text: "] showed that pyramidal training led to a decrease in performance in the lower (but not the upper) limbs of the body during a training session. Compared with traditional training, this suggests that pyramidal training leads to more rapid failure, leading to reduced training volume and increased rest between sessions. Although this finding should be approached with caution, it suggests that pyramidal methods offer fewer benefits compared with traditional methods of resistance training."
                      - generic [ref=e276]:
                        - heading "6.2. Comparison between HL and LH Protocols" [level=3] [ref=e277]
                        - generic [ref=e278]:
                          - text: In a study by Leighton et al. [
                          - link "38" [ref=e279] [cursor=pointer]:
                            - /url: "#B38-encyclopedia-01-00035"
                          - text: "] that was reported in Fleck et al. ["
                          - link "8" [ref=e280] [cursor=pointer]:
                            - /url: "#B8-encyclopedia-01-00035"
                          - text: "], the effectiveness of eight different protocols was evaluated by comparing isometric strength outcomes. In particular, the authors compared the HL (Oxford) and LH (Delorme) protocols. They found a significant increase between pre- to post-training strength in (1) elbow flexion for Delorme and (2) in elbow flexion and extension for Oxford. Improvement of elbow flexion strength was comparable between the two protocols, but HL was superior to LH for increasing isometric elbow extension and back and leg isometric strength (measured by means of a leg dynamometer). This suggests that the two methods may have different impacts on the upper or lower limbs of the body."
                        - generic [ref=e281]:
                          - text: In theory, fatigue occurs earlier in LH pyramids, as the practitioner is already exhausted when reaching series with heavy weight. It has been reported (e.g., [
                          - link "11" [ref=e282] [cursor=pointer]:
                            - /url: "#B11-encyclopedia-01-00035"
                          - text: "]) that the use of maximal loads and low repetitions exerts pressure on the muscular nervous system by calling on fast-moving motor units and changes the nervous activity of the muscle, thereby increasing muscle strength. This suggests that LH may produce lower strength outcomes than HL. However, in practice, HL also requires an extensive warm-up before reaching the highest workloads."
                        - generic [ref=e283]:
                          - text: Miller [
                          - link "39" [ref=e284] [cursor=pointer]:
                            - /url: "#B39-encyclopedia-01-00035"
                          - text: "] compared the HL and LH methods and concluded that the most important training bout should be performed first to reduce the effects of fatigue and allow for a greater number of repetitions to be performed. However, the protocol only included bench press as an exercise; though, as previously discussed in the present work, the effects may differ between the upper and lower limbs. The protocol also comprised only three sessions and five volunteers and only compared the number of repetitions between the two methods."
                        - generic [ref=e285]:
                          - text: In sum, comparisons between HL and LH concerning strength gains are equivocal. This could mean that they produce different gains based on the type of contraction, as only isometric strength was evaluated in Leighton et al. [
                          - link "38" [ref=e286] [cursor=pointer]:
                            - /url: "#B38-encyclopedia-01-00035"
                          - text: "]. Moreover, the effect size is high in Miller ["
                          - link "39" [ref=e287] [cursor=pointer]:
                            - /url: "#B39-encyclopedia-01-00035"
                          - text: "], as only a few participants were included in the study."
                      - generic [ref=e288]:
                        - heading "6.3. Comparison between Half-Triangle and Triangle Pyramids" [level=3] [ref=e289]
                        - generic [ref=e290]:
                          - text: Increasing, decreasing, and triangle pyramids affect strength, hypertrophy, and power similarly, but only triangle pyramids are likely to improve endurance. However, workload is lower in half-triangle versus triangle pyramids (
                          - link "Table 1" [ref=e291] [cursor=pointer]:
                            - /url: "#table_body_display_encyclopedia-01-00035-t001"
                          - text: ).
                      - generic [ref=e292]:
                        - heading "6.4. Comparison of Triangle Methods" [level=3] [ref=e293]
                        - generic [ref=e294]:
                          - text: As pointed out by Mohammadi et al. [
                          - link "11" [ref=e295] [cursor=pointer]:
                            - /url: "#B11-encyclopedia-01-00035"
                          - text: "], research outputs on triangle pyramids are conflicting. Previous studies have suggested that two different triangle pyramidal exercises lead to similar strength, endurance, hypertrophy, and anaerobic power outcomes, and also that different pyramidal patterns produce different outcomes based on which body limb is trained. Triangle pyramids can be compared as follows:"
                        - list [ref=e297]:
                          - listitem [ref=e298]:
                            - generic [ref=e299]:
                              - text: Mohammadi et al. [
                              - link "11" [ref=e300] [cursor=pointer]:
                                - /url: "#B11-encyclopedia-01-00035"
                              - text: "] showed that ASYM versus SYM pyramids produced higher absolute power gains when the movement was executed at the same speed in the two methods. Other variables, such as strength, endurance, body weight, and hypertrophy of the upper and lower limbs, were similar."
                          - listitem [ref=e301]:
                            - generic [ref=e302]: As the diet was not controlled in this study, the lack of a significant difference between the body weight in ASYM versus SYM pyramidal training was discussed, and it was suggested that SYM pyramids may produce leaner athletes.
                          - listitem [ref=e303]:
                            - generic [ref=e304]:
                              - text: ASYM and SYM pyramids (
                              - link "Table 1" [ref=e305] [cursor=pointer]:
                                - /url: "#table_body_display_encyclopedia-01-00035-t001"
                              - text: ) offer a similar training volume at high intensity and endurance, except that the overall training volume is lower in ASYM versus SYM pyramidal training.
                          - listitem [ref=e306]:
                            - generic [ref=e307]:
                              - text: In theory, RP training offers the same advantage as ASYM pyramids but with a slightly higher endurance training volume (
                              - link "Table 1" [ref=e308] [cursor=pointer]:
                                - /url: "#table_body_display_encyclopedia-01-00035-t001"
                              - text: ). In practice, the first sets appear to be warm-up sets because they are not conducted to fatigue. The limited research on this method suggests that it should be avoided [
                              - link "8" [ref=e309] [cursor=pointer]:
                                - /url: "#B8-encyclopedia-01-00035"
                              - text: "]."
                    - generic [ref=e310]:
                      - heading "7. Discussion and Conclusions" [level=2] [ref=e311]
                      - generic [ref=e312]:
                        - text: Pyramidal and, in general, resistance training induce cardiovascular, endocrinal, and neural adaptations, as well as changes in muscle composition and size. This results in an increase in strength, power, hypertrophy, and local muscle endurance. Strength and hypertrophy outcomes are comparable between traditional and pyramidal training [
                        - link "17" [ref=e313] [cursor=pointer]:
                          - /url: "#B17-encyclopedia-01-00035"
                        - text: "], except that triangle pyramids likely produce greater endurance as regards the dose-dependent relationship between outcomes and training volume. However, to our knowledge, this has not been investigated experimentally to date."
                      - generic [ref=e314]:
                        - text: Endurance outcomes in resistance training are surprising in terms of the specificity principle, which holds that two different kinds of training produce distinct adaptations. In accordance with this principle, resistance training tends to improve anaerobic filial and increase myofiber size and their contractile properties, while endurance training results in an improvement in the aerobic filial with a decrease in myofiber size and contractile properties [
                        - link "40" [ref=e315] [cursor=pointer]:
                          - /url: "#B40-encyclopedia-01-00035"
                        - text: "]. Reiss et al. ["
                        - link "10" [ref=e316] [cursor=pointer]:
                          - /url: "#B10-encyclopedia-01-00035"
                        - text: "] suggested that concurrent methods of training interfere with each other, overwhelming the body’s capacity to compensate for the stimulation. In practice, interferences occur in the repetition zone of five to ten RMs, when the anaerobic threshold is greater than 75% to 85% of the VO"
                        - subscript [ref=e317]: "2"
                        - text: max. In other words, strength and cardiovascular training are compatible, but intense cardiovascular training should be avoided while training for muscular hypertrophy.
                      - generic [ref=e318]:
                        - text: In contrast, the impact of strength training for endurance athletes is not clear. Tanaka et al. [
                        - link "40" [ref=e319] [cursor=pointer]:
                          - /url: "#B40-encyclopedia-01-00035"
                        - text: "] found that resistance training improved short- and long-term endurance in beginners and well-trained athletes. The authors suggested that both types of training, aside from their different adaptations mentioned above, resulted in the same changes from type IIX to type IIA myofibers. In addition, resistance training improved the lactate threshold in untrained individuals, thereby delaying the onset of fatigue in endurance training. However, the authors stated that resistance training should be specifically adapted to each endurance sport, reporting that a resistance training method used in cyclists was inefficient on swimmers. In addition, it is possible that strength training may limit the development of maximal aerobic capacity ["
                        - link "41" [ref=e320] [cursor=pointer]:
                          - /url: "#B41-encyclopedia-01-00035"
                        - text: "]."
                      - generic [ref=e321]:
                        - text: In short, the pyramidal method is an effective method for training for strength, hypertrophy, and power while having the added benefit of enhancing muscular endurance. This suggests that the pyramidal method is a good candidate for athletes who practice wrestling because combat training involves aerobic training interspersed with anaerobic effort [
                        - link "11" [ref=e322] [cursor=pointer]:
                          - /url: "#B11-encyclopedia-01-00035"
                        - text: "]. Although the use of resistance in addition to endurance training is an interesting topic, the practice of resistance training should be carefully considered in light of the type of endurance performed, the training experience of the athlete (an improvement in the lactic threshold was only observed for beginners), the intensity of the endurance session (lower than 75 to 85% of VO"
                        - subscript [ref=e323]: "2"
                        - text: max), and its potential on the maximal aerobic capacity. Further research could investigate the benefits of pyramidal training compared with periodization, including separate endurance and strength training.
                      - generic [ref=e324]:
                        - text: Research has shown that different triangle pyramidal methods, such as flat or narrow pyramids, result in similar adaptations as resistance training [
                        - link "11" [ref=e325] [cursor=pointer]:
                          - /url: "#B11-encyclopedia-01-00035"
                        - text: "]. However, the resulting power is significantly higher in ASYM pyramids compared with SYM pyramids, while it was shown (though the finding is controversial) that athletes following a SYM pyramid training were leaner ["
                        - link "11" [ref=e326] [cursor=pointer]:
                          - /url: "#B11-encyclopedia-01-00035"
                        - text: "]. Among the triangle pyramidal methods, only reverse pyramids should be avoided, although studies on RPs are rare ["
                        - link "8" [ref=e327] [cursor=pointer]:
                          - /url: "#B8-encyclopedia-01-00035"
                        - text: "]. A reasonable hypothesis is that first series in RP protocol should be conducted to fatigue in order to maximize endurance gains."
                      - generic [ref=e328]: From a practitioner’s point of view, half-triangle pyramids are more efficient than traditional and triangle pyramids because they produce similar strength and hypertrophy outcomes with a lower training volume. However, they also likely result in less local muscle endurance in light of the dose-dependent relationship with training volume. HL and LH are two ubiquitous half-triangle methods in which the weight is increased or decreased between each set. The differences between the two methods are equivocal, which could be due to the different effect sizes in prior studies. To the best of our knowledge, the impact of contraction type in HL versus LH pyramids has not been investigated to date. Ambiguity in terms of strength gains between these two types of pyramidal trainings could also mean that, from the practitioner’s perspective, differences between the two methods are undetectable.
                      - generic [ref=e329]:
                        - text: The effect of pyramidal training on body limbs was investigated by Costa et al. [
                        - link "37" [ref=e330] [cursor=pointer]:
                          - /url: "#B37-encyclopedia-01-00035"
                        - text: "], Leighton et al. ["
                        - link "38" [ref=e331] [cursor=pointer]:
                          - /url: "#B38-encyclopedia-01-00035"
                        - text: "], and Mohammadi et al. ["
                        - link "11" [ref=e332] [cursor=pointer]:
                          - /url: "#B11-encyclopedia-01-00035"
                        - text: "]. Costa et al. ["
                        - link "37" [ref=e333] [cursor=pointer]:
                          - /url: "#B37-encyclopedia-01-00035"
                        - text: "] showed that pyramidal training decreased lower limb activity during a single bout of pyramidal training compared with traditional training. This is consistent with Leighton et al. ["
                        - link "38" [ref=e334] [cursor=pointer]:
                          - /url: "#B38-encyclopedia-01-00035"
                        - text: "], who showed that LH Delorme training and Oxford HL training significantly affected the upper limbs but not the legs and back. However, encouragingly, Mohammadi et al. ["
                        - link "11" [ref=e335] [cursor=pointer]:
                          - /url: "#B11-encyclopedia-01-00035"
                        - text: "] suggested that the impact of different types of pyramidal training on the body and upper limbs did not differ significantly."
                      - generic [ref=e336]:
                        - text: From all studies presented in this review, only Costa et al. [
                        - link "37" [ref=e337] [cursor=pointer]:
                          - /url: "#B37-encyclopedia-01-00035"
                        - text: "] suggested a decrease in performance of pyramidal versus resistance training. However, it should be emphasized that only immediate responses to resistance training were considered in Costa’s study. Therefore, medium- and long-term effects of pyramidal versus traditional training are highly hypothetical and require an analysis over a longer period. Despite everything, this study demonstrates that different training methods (i.e., pyramidal, drop set or traditional training) may be used to modulate fatigue in line with the program objectives."
                      - generic [ref=e338]:
                        - text: Elsewhere, studies have demonstrated that pyramidal training is an alternative to traditional training for disabled or aging individuals [
                        - link "19" [ref=e339] [cursor=pointer]:
                          - /url: "#B19-encyclopedia-01-00035"
                        - text: ","
                        - link "35" [ref=e340] [cursor=pointer]:
                          - /url: "#B35-encyclopedia-01-00035"
                        - text: ","
                        - link "42" [ref=e341] [cursor=pointer]:
                          - /url: "#B42-encyclopedia-01-00035"
                        - text: "], though muscle electrical activity differs significantly between the pyramidal methods depending on the repetition zones ["
                        - link "43" [ref=e342] [cursor=pointer]:
                          - /url: "#B43-encyclopedia-01-00035"
                        - text: "]. The suitability of pyramidal training for disabled or aging individuals, as well as for well-trained athletes ["
                        - link "17" [ref=e343] [cursor=pointer]:
                          - /url: "#B17-encyclopedia-01-00035"
                        - text: "], suggests that pyramidal training is an effective method of resistance training for program variation across these populations. Nevertheless, it should be noted that the impact and comparison of training variables such as rest between series, speed of execution, amplitude of movement and diet on pyramidal methods was, in our opinion, insufficiently covered by the existing literature."
