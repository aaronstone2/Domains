    - paragraph [ref=e10]:
      - text: "This is the official website for flame graphs: a visualization of hierarchical data that I created to visualize stack traces of profiled software so that the most frequent code-paths can be identified quickly and accurately. They can be generated using my open source programs on"
      - link "github.com/brendangregg/FlameGraph" [ref=e11] [cursor=pointer]:
        - /url: https://github.com/brendangregg/FlameGraph
      - text: which create interactive SVGs. There are now over 100 other implementations, many open source (see the
      - link "Updates" [ref=e12] [cursor=pointer]:
        - /url: "#Updates"
      - text: "section) and they are also now available in most commercial profilers. My colleague on the Netflix performance engineering team, Martin Spier, created a more interactive d3 version, also widely used:"
      - link "d3-flame-graph" [ref=e13] [cursor=pointer]:
        - /url: https://github.com/spiermar/d3-flame-graph
      - text: .
    - paragraph [ref=e14]: "These pages (or posts) introduce different types of flame graphs:"
