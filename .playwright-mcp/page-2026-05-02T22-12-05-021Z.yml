    - heading "Summary" [level=2] [ref=e40]
    - paragraph [ref=e41]: The x-axis shows the stack profile population, sorted alphabetically (it is not the passage of time), and the y-axis shows stack depth, counting from zero at the bottom. Each rectangle represents a stack frame. The wider a frame is is, the more often it was present in the stacks. The top edge shows what is on-CPU, and beneath it is its ancestry. Original flame graphs use random colors to help visually differentiate adjacent frames. Variations include inverting the y-axis (an "icicle graph"), changing the hue to indicate code type, and using a color spectrum to convey an additional dimension.
    - paragraph [ref=e42]: "Flame graphs are both a static and dynamic visualization. As a static visualization, a flame graph can be saved as an image, included in print (books), and will still convey the \"big picture\" as only the most frequent frames have enough width for labels. A dynamic visualization allows interactive features to aid navigation and comprehension, including:"
    - list [ref=e43]:
      - listitem [ref=e44]: Mouse hover shows additional frame details in a status bar.
      - listitem [ref=e45]: Mouse click zooms the visualization horizontally, revealing function names previously elided.
      - listitem [ref=e46]: Search matches and highlights a given term and shows the "cumulative percentage" of stacks including the search term.
    - paragraph [ref=e47]:
      - text: This visualization is fully explained in my ACMQ article
      - link "The Flame Graph" [ref=e48] [cursor=pointer]:
        - /url: http://queue.acm.org/detail.cfm?id=2927301
      - text: ", also published in"
      - link "Communications of the ACM, Vol. 59 No. 6" [ref=e49] [cursor=pointer]:
        - /url: http://cacm.acm.org/magazines/2016/6/202665-the-flame-graph/abstract
      - text: .
    - paragraph [ref=e50]:
      - text: Also see my
      - link "CPU Flame Graphs" [ref=e51] [cursor=pointer]:
        - /url: FlameGraphs/cpuflamegraphs.html
      - text: page, and the
      - link "presentation" [ref=e52] [cursor=pointer]:
