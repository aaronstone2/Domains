      - listitem [ref=e148]:
        - text: I wrote a post showing how the Google lightweight-java-profiler can be used to create
        - link "Java Flame Graphs" [ref=e149] [cursor=pointer]:
          - /url: http://www.brendangregg.com/blog/2014-06-12/java-flame-graphs.html
        - text: . This is only Java code time, and not other CPU consumers. See my later work with Java (-XX:+PreserveFramePointer) for a different and more complete profile.
      - listitem [ref=e150]:
        - link "Vladimir Kirillov" [ref=e151] [cursor=pointer]:
          - /url: https://twitter.com/darkproger
        - text: has developed
        - link "eflame" [ref=e152] [cursor=pointer]:
          - /url: https://github.com/proger/eflame
        - text: (github), a Flame Graph profiler for Erlang. Blocking calls are in blue, see the screenshot.
      - listitem [ref=e153]:
        - link "Trevor Norris" [ref=e154] [cursor=pointer]:
          - /url: https://twitter.com/trevnorris
        - text: posted instructions for creating
        - link "Linux Node.js" [ref=e155] [cursor=pointer]:
          - /url: https://gist.github.com/trevnorris/9616784
        - text: CPU flame graphs, by using
        - link "perf_events" [ref=e156] [cursor=pointer]:
          - /url: perf.html
        - text: and --perf-basic-prof. See the
        - link "example" [ref=e157] [cursor=pointer]:
          - /url: https://twitter.com/trevnorris/status/445720118207606784
        - text: .
      - listitem [ref=e158]:
        - link "Luca Canali" [ref=e159] [cursor=pointer]:
          - /url: https://twitter.com/LucaCanaliDB
        - text: provides many examples of
        - link "Flame Graphs for Oracle" [ref=e160] [cursor=pointer]:
          - /url: http://externaltable.blogspot.com/2014/05/flame-graphs-for-oracle.html
        - text: databases, and explains what they mean.
      - listitem [ref=e161]:
        - text: Julien Charbon posted some CPU flame graphs on FreeBSD, to analyze
        - link "TCP stack lock contention with short-lived connections" [ref=e162] [cursor=pointer]:
          - /url: https://lists.freebsd.org/pipermail/freebsd-net/2014-May/038810.html
        - text: .
      - listitem [ref=e163]:
        - text: Gabriel posted
        - link "Profiling and optimising with Flamegraph" [ref=e164] [cursor=pointer]:
          - /url: http://www.gabriel.urdhr.fr/2014/05/23/flamegraph/
        - text: ", explaining all the steps with some really good examples."
    - paragraph [ref=e165]: "More Flame Graph news (updated Dec 2014):"
    - list [ref=e166]:
      - listitem [ref=e167]:
        - text: Facebook's Strobelight uses an inverted flame graph for perf analysis. See the slide in Yannick Brosseau's
        - link "Using tracing at Facebook scale" [ref=e168] [cursor=pointer]:
          - /url: http://tracingsummit.org/w/images/6/6f/TracingSummit2014-Tracing-at-Facebook-Scale.pdf
        - text: (PDF) talk.
      - listitem [ref=e169]:
        - text: The post on
        - 'link "Profiling a Meteor app: Telescope" [ref=e170] [cursor=pointer]':
          - /url: https://meteorhacks.com/profiling-a-meteor-app-telescope.html
        - text: includes flame graphs.
      - listitem [ref=e171]:
        - text: Adrien Mahieux added the
        - link "Click to Zoom" [ref=e172] [cursor=pointer]:
          - /url: https://github.com/brendangregg/FlameGraph/pull/35
        - text: feature to the original
        - link "FlameGraph" [ref=e173] [cursor=pointer]:
          - /url: https://github.com/brendangregg/FlameGraph
        - text: software. This is really awesome!
      - listitem [ref=e174]:
        - text: I wrote a post on
        - link "Differential Flame Graphs" [ref=e175] [cursor=pointer]:
          - /url: /blog/2014-11-09/differential-flame-graphs.html
        - text: ", showing new features I added to flame graphs for performance regression testing."
      - listitem [ref=e176]:
        - text: "I came up with an unusual but useful use for differential flame graphs:"
        - link "CPI Flame Graphs" [ref=e177] [cursor=pointer]:
          - /url: /blog/2014-10-31/cpi-flame-graphs.html
        - text: ", to highlight memory stall cycles."
      - listitem [ref=e178]:
        - text: I gave a talk at the 2014 FreeBSD Developer and Vendor Summit on
        - link "Flame Graphs on FreeBSD" [ref=e179] [cursor=pointer]:
          - /url: http://www.brendangregg.com/blog/2015-03-10/freebsd-flame-graphs.html
        - text: .
      - listitem [ref=e180]:
        - text: I wrote a post on
        - link "Node.js Flame Graphs on Linux" [ref=e181] [cursor=pointer]:
          - /url: http://www.brendangregg.com/blog/2014-09-17/node-flame-graphs-on-linux.html
        - text: using Linux perf_events and v8's --perf-basic-prof option.
      - listitem [ref=e182]:
        - text: Yunong Xiao showed how flame graphs helped solve an important production performance issue for Netflix in the post
        - link "Node.js in Flames" [ref=e183] [cursor=pointer]:
          - /url: http://techblog.netflix.com/2014/11/nodejs-in-flames.html
        - text: .
      - listitem [ref=e184]:
        - text: Oozou developed and published
        - link "RubyProf::FlameGraphPrinter" [ref=e185] [cursor=pointer]:
          - /url: https://github.com/oozou/ruby-prof-flamegraph
        - text: for ruby-prof, to generate folded stacks for flame graph generation.
      - listitem [ref=e186]:
        - text: Thorsten Lorenz developed a
        - link "web flamegraph interface" [ref=e187] [cursor=pointer]:
          - /url: https://github.com/thlorenz/flamegraph
        - text: that can load new profiles, and perform a regexp search. See his
        - link "example" [ref=e188] [cursor=pointer]:
          - /url: http://thlorenz.com/flamegraph/web/
        - text: .
    - paragraph [ref=e189]: "More Flame Graph news (updated Jun 2015):"
    - list [ref=e190]:
      - listitem [ref=e191]:
        - text: "Shawn Sterling posted about his excellent talk at Linuxfest Northwest 2014:"
        - link "Getting Started With Flamegraph" [ref=e192] [cursor=pointer]:
          - /url: http://systemtemplar.org/blog/2015/04/07/getting-started-with-flamegraph/
        - text: ", which includes both the slides and video (turn the volume up)."
      - listitem [ref=e193]:
        - text: Scott Lystig Fritchie gave a great talk on
        - link "profiling Erlang code" [ref=e194] [cursor=pointer]:
          - /url: http://www.snookles.com/erlang/ef2015/
        - text: including flame graphs at Erlang Factory San Francisco 2015.
      - listitem [ref=e195]:
        - text: I submitted tickets for a flame graph / flame chart toggle for
        - link "Google Chrome (Issue 452624)" [ref=e196] [cursor=pointer]:
          - /url: https://code.google.com/p/chromium/issues/detail?id=452624
        - text: and
        - link "Firefox (bug 1123495)" [ref=e197] [cursor=pointer]:
          - /url: https://bugzilla.mozilla.org/show_bug.cgi?id=1123495
        - text: . I'd love to see both implemented. The chromium ticket prompted interesting discussion and prototypes.
      - listitem [ref=e198]:
        - text: In my SCALE13x talk (2015), I previewed
        - link "mixed-mode Java flame graphs" [ref=e199] [cursor=pointer]:
          - /url: http://www.slideshare.net/brendangregg/scale2015-linux-perfprofiling/57
        - text: using Linux perf_events ("perf"). This uses a JVM frame pointer patch that has become the -XX:+PreserveFramePointer option in both JDK9 (
        - link "JDK-8068945" [ref=e200] [cursor=pointer]:
          - /url: https://bugs.openjdk.java.net/browse/JDK-8068945
        - text: ) and JDK8u60 (
        - link "JDK-8072465" [ref=e201] [cursor=pointer]:
          - /url: https://bugs.openjdk.java.net/browse/JDK-8072465
        - text: ). For the first time, we can see all CPU consumers in one visualization! See slides 40 to 57 for more details, and my post about it (when I write it!).
      - listitem [ref=e202]:
        - text: Francesco Mazzoli post about
        - link "Flame graphs for GHC time profiles with ghc-prof-flamegraph" [ref=e203] [cursor=pointer]:
          - /url: https://www.fpcomplete.com/blog/2015/04/ghc-prof-flamegraph
        - text: ", including a tutorial for making flame graphs from the existing GHC (Haskell) profiler output."
      - listitem [ref=e204]:
        - text: Robin Moffatt posted about
        - link "Analysing ODI performance with Flame Graphs" [ref=e205] [cursor=pointer]:
          - /url: http://www.rittmanmead.com/2015/04/analysing-odi-performance-with-flame-graphs/
        - text: ", for understanding load plans in the Oracle Data Integrator."
      - listitem [ref=e206]:
        - text: Flame graphs were
        - link "demoed" [ref=e207] [cursor=pointer]:
          - /url: https://twitter.com/bleen18/status/589886547262058499
        - text: at d3NYC (Drupal) 2015, but I haven't found slides online yet.
      - listitem [ref=e208]:
        - text: Cor-Paul Bezemer has been investigating flame graph differentials with his
        - link "Flamegraphdiff" [ref=e209] [cursor=pointer]:
          - /url: http://corpaul.github.io/flamegraphdiff/
        - text: software, which shows the difference from A to B using three flame graphs simultaneously. This was also the subject of a SANER2015
        - link "paper" [ref=e210] [cursor=pointer]:
          - /url: http://ieeexplore.ieee.org/xpl/login.jsp?tp=&arnumber=7081872&url=http%3A%2F%2Fieeexplore.ieee.org%2Fiel7%2F7066219%2F7081802%2F07081872.pdf%3Farnumber%3D7081872
        - text: ($), and
        - link "talk" [ref=e211] [cursor=pointer]:
          - /url: http://www.slideshare.net/corpaulbezemer/saner-2015-era-track
        - text: .
      - listitem [ref=e212]:
        - text: M. Isuru Tharanga Chrishantha Perera wrote a translator for
        - link "Java Flight Recorder" [ref=e213] [cursor=pointer]:
          - /url: https://github.com/chrishantha/jfr-flame-graph
        - text: profiles, for making flame graphs.
      - listitem [ref=e214]:
        - text: Jan Stępień developed
        - link "Pluggable Flame Graphs for Clojure" [ref=e215] [cursor=pointer]:
          - /url: https://github.com/jstepien/flames/
        - text: (
        - link "example" [ref=e216] [cursor=pointer]:
          - /url: https://stepien.cc/~jan/flames-01.svg
        - text: ).
      - listitem [ref=e217]:
        - text: Evan Hempel has created a
        - link "python-flamegraph" [ref=e218] [cursor=pointer]:
          - /url: https://github.com/evanhempel/python-flamegraph
        - text: profiler for Python, which generates the folded stack output suitable for making into flame graphs. See the README on github for instructions.
      - listitem [ref=e219]:
        - text: Franck Pachot posted another example of using CPU flame graphs for identification of an
        - link "Oracle database bug" [ref=e220] [cursor=pointer]:
          - /url: http://www.dbi-services.com/index.php/blog/entry/flame-graph-for-quick-identification-of-oracle-bug
        - text: .
      - listitem [ref=e221]:
        - text: Strongloop have included a nice looking
        - link "Node.js flame graphs module" [ref=e222] [cursor=pointer]:
          - /url: https://strongloop.com/strongblog/transaction-tracing-node-js-root-cause
        - text: for their Arc Profiler.
      - listitem [ref=e223]:
        - link "@yoheia" [ref=e224] [cursor=pointer]:
          - /url: https://twitter.com/yoheia
        - text: posted a detailed flame graph post showing
        - link "Linux kernel profiling (in Japanese)" [ref=e225] [cursor=pointer]:
          - /url: http://d.hatena.ne.jp/yohei-a/20150706/1436208007
        - text: .
      - listitem [ref=e226]:
        - text: Zoltan Majo fixed
        - link "JDK-8068945" [ref=e227] [cursor=pointer]:
          - /url: https://bugs.openjdk.java.net/browse/JDK-8068945
        - text: for Java 9 and
        - link "JDK-8072465" [ref=e228] [cursor=pointer]:
          - /url: https://bugs.openjdk.java.net/browse/JDK-8072465
        - text: for Java 8 update 60 build 19 (or later, download as early access
        - link "here" [ref=e229] [cursor=pointer]:
          - /url: https://jdk8.java.net/download.html
        - text: "). This adds -XX:+PreserveFramePointer, which allows Linux perf_events to sample full stacks for making flame graphs. This began with a prototype patch I developed and submitted: ("
        - link "A hotspot patch for stack profiling" [ref=e230] [cursor=pointer]:
          - /url: http://mail.openjdk.java.net/pipermail/hotspot-compiler-dev/2014-December/016477.html
        - text: ). Great to see this functionality make it into the JVM!
      - listitem [ref=e231]:
        - text: Min Zhou has developed
        - link "PerfJ" [ref=e232] [cursor=pointer]:
          - /url: https://github.com/coderplay/perfj
        - text: ", for automating the collection of Java flame graphs, using the frame pointer patch (see previous item)."
    - paragraph [ref=e233]: "More Flame Graph news (updated Dec 2015):"
    - list [ref=e234]:
      - listitem [ref=e235]:
        - text: Myself and Martin Spier posted about
        - link "Java in Flames" [ref=e236] [cursor=pointer]:
          - /url: http://techblog.netflix.com/2015/07/java-in-flames.html
        - text: (
        - link "PDF" [ref=e237] [cursor=pointer]:
          - /url: /Articles/Netflix_Java_in_Flames.pdf
        - text: ) for the Netflix Tech Blog, showing Java mixed-mode flame graphs using the new -XX:+PreserveFramePointer JVM option.
      - listitem [ref=e238]:
        - text: Jonathan Perkin used memory flame graphs for
        - link "Reducing RAM usage in pkgin" [ref=e239] [cursor=pointer]:
          - /url: http://www.perkin.org.uk/posts/reducing-ram-usage-in-pkgin.html
        - text: .
      - listitem [ref=e240]:
        - text: Isuru Perera postabout about
        - link "Java CPU Flame Graphs" [ref=e241] [cursor=pointer]:
          - /url: http://isuru-perera.blogspot.com/2015/07/java-cpu-flame-graphs.html
        - text: with an example making use of Min's PerfJ.
      - listitem [ref=e242]:
        - text: Ben Sandler from Uber has posted
        - link "go-torch" [ref=e243] [cursor=pointer]:
          - /url: https://github.com/uber/go-torch
        - text: ", a flame graph profiler for go-lang programs."
      - listitem [ref=e244]:
        - text: Andi Kleen demonstrated
        - link "Generating flame graphs with Processor Trace" [ref=e245] [cursor=pointer]:
          - /url: http://halobates.de/blog/p/329
        - text: ", a feature from modern Intel CPUs for very high frequency sampling."
      - listitem [ref=e246]:
        - text: I wrote about the new
        - link "flame graph search" [ref=e247] [cursor=pointer]:
          - /url: http://www.brendangregg.com/blog/2015-08-11/flame-graph-search.html
        - text: feature. The matched percentage is very handy, so I don't have to mouse over many tiny frames and add them up manually.
      - listitem [ref=e248]:
        - text: Eben Freeman posted about
        - link "Profiling Python in Production" [ref=e249] [cursor=pointer]:
          - /url: https://nylas.com/blog/performance/
        - text: ", which includes a python profiler and basic d3 flame graphs."
      - listitem [ref=e250]:
        - text: Will Sewell mentioned flame graphs in his
        - link "Top tips and tools for optimising Haskell" [ref=e251] [cursor=pointer]:
          - /url: https://blog.pusher.com/top-tips-and-tools-for-optimising-haskell/
        - text: post, and linked to the work for
        - link "GHC flame graphs" [ref=e252] [cursor=pointer]:
          - /url: https://www.fpcomplete.com/blog/2015/04/ghc-prof-flamegraph#flame-graphs-for-ghc-time-profiles
        - text: by Francesco Mazzoli.
      - listitem [ref=e253]:
        - text: Bo Lopker created
        - link "djdt-flamegraph" [ref=e254] [cursor=pointer]:
          - /url: https://github.com/23andMe/djdt-flamegraph
        - text: (github) for getting a flame graph of current requests in the Django Python web framework.
      - listitem [ref=e255]:
        - text: NodeSource have flamegraphs in their
        - link "NSolid" [ref=e256] [cursor=pointer]:
          - /url: https://nodesource.com/products/nsolid
        - text: Node.js analysis product. The graphics look very nice, and they also have treemaps and sunbursts (both of which I think are usually less effective than flame graphs, but I don't mind having the option).
      - listitem [ref=e257]:
        - text: Alex Ciminian has been developing a
        - link "d3-flame-graphs" [ref=e258] [cursor=pointer]:
          - /url: https://github.com/cimi/d3-flame-graphs
        - text: library (github) for d3, implemented in CoffeeScript. Check out the demo, it looks really nice so far.
      - listitem [ref=e259]:
        - text: Martin Spier (a colleague at Netflix) has been developing
        - link "d3-flame-graph" [ref=e260] [cursor=pointer]:
          - /url: https://github.com/spiermar/d3-flame-graph
        - text: ", as a d3 library implemented in JavaScript. This will be integrated into our open source"
        - link "Vector" [ref=e261] [cursor=pointer]:
          - /url: http://techblog.netflix.com/2015/04/introducing-vector-netflixs-on-host.html
        - text: instance analysis tool. It has zoom transitions!
      - listitem [ref=e262]:
        - text: I gave a
        - link "Java Mixed-Mode Flame Graphs" [ref=e263] [cursor=pointer]:
          - /url: http://www.brendangregg.com/blog/2015-11-06/java-mixed-mode-flame-graphs.html
        - text: talk at JavaOne 2015, including all the latest updates.
      - listitem [ref=e264]:
        - text: David Calavera wrote about
        - link "Docker flame graphs for Go" [ref=e265] [cursor=pointer]:
          - /url: https://medium.com/@calavera/docker-flame-graphs-f9523e98d57d#.m2xz1vl18
        - text: .
      - listitem [ref=e266]:
        - text: Carol Nichols wrote detailed instructions for
        - 'link "Rust Profiling with Instruments and FlameGraph on OSX: CPU/Time" [ref=e267] [cursor=pointer]':
          - /url: http://carol-nichols.com/2015/12/09/rust-profiling-on-osx-cpu-time/
        - text: .
    - paragraph [ref=e268]: "More Flame Graph news (updated Jun 2016):"
    - list [ref=e269]:
      - listitem [ref=e270]:
        - text: Apekshit Sharma wrote a post about
        - link "Saving CPU! Using Native Hadoop Libraries for CRC computation in HBase" [ref=e271] [cursor=pointer]:
          - /url: https://blogs.apache.org/hbase/entry/saving_cpu_using_native_hadoop
        - text: .
      - listitem [ref=e272]:
        - text: Mike Huang wrote a Netflx tech blog post to show how he helped with
        - link "Saving 13 Million Computational Minutes per Day with Flame Graphs" [ref=e273] [cursor=pointer]:
          - /url: http://techblog.netflix.com/2016/04/saving-13-million-computational-minutes.html
        - text: .
      - listitem [ref=e274]:
        - text: Srdjan Marinovic and Ryan Day created
        - link "goprofui" [ref=e275] [cursor=pointer]:
          - /url: https://github.com/wirelessregistry/goprofui
        - text: includes a cpu.go profiler for golang and flame graphs.
      - listitem [ref=e276]:
        - text: I wrote an article for ACMQ,
        - link "The Flame Graph" [ref=e277] [cursor=pointer]:
          - /url: http://queue.acm.org/detail.cfm?id=2927301
        - text: ", which defines flame graphs, describes their origin, explains how to interpret them, and discusses possible future developments."
      - listitem [ref=e278]:
        - text: David Mark Clements has developed
        - link "0x" [ref=e279] [cursor=pointer]:
          - /url: https://github.com/davidmarkclements/0x
        - text: ", a new interactive flame graph profiler for Node.js processes on both Linux and OS X. See the"
        - link "demo" [ref=e280] [cursor=pointer]:
          - /url: http://davidmarkclements.github.io/0x-demo/
        - text: .
      - listitem [ref=e281]:
        - link "Qt Creator 4.0.0" [ref=e282] [cursor=pointer]:
          - /url: https://blog.qt.io/blog/2016/05/11/qt-creator-4-0-0-released/?utm_content=32276554&utm_medium=social&utm_source=twitter
        - text: now includes
        - link "flame graphs" [ref=e283] [cursor=pointer]:
          - /url: https://doc.qt.io/qtcreator/creator-qml-performance-monitor.html#visualizing-statistics-as-flame-graphs
        - text: "along with timeline and statistical views. That's how it should be done: different views of the same data you can switch between."
      - listitem [ref=e284]:
        - text: Antonio Pérez developed
        - link "4gl-flamegraph" [ref=e285] [cursor=pointer]:
          - /url: https://github.com/skarcha/4gl-flamegraph
        - text: for processing the profiler output of Genero by 4Js (Four Js).
      - listitem [ref=e286]:
        - text: Ty Overby published a
        - link "flamegraph profiling tool for rust" [ref=e287] [cursor=pointer]:
          - /url: https://github.com/TyOverby/flame
        - text: .
      - listitem [ref=e288]:
        - text: The
        - link "vprof Python package" [ref=e289] [cursor=pointer]:
          - /url: https://github.com/nvdv/vprof
        - text: provides interactive visualizations for profiling, including flame graphs.
      - listitem [ref=e290]:
        - text: Alastair Butler and Kei Yoshimoto published the paper
        - link "Large scale semantic representation with flame graphs" [ref=e291] [cursor=pointer]:
          - /url: http://www.anlp.jp/proceedings/annual_meeting/2015/pdf_dir/C1-5.pdf
        - text: (PDF), where they used them to visualize semantically annotated corpora, which has been parsed into a hierarchy.
      - listitem [ref=e292]:
        - text: Jonathan Newbrough developed the
        - link "Gumshoe Load Investigator" [ref=e293] [cursor=pointer]:
          - /url: https://github.com/dcm-oss/gumshoe
        - text: for Java analysis, initially for internal use in the Dell Cloud Manager, which makes good use of flame graphs.
      - listitem [ref=e294]:
        - text: Mahesh Dathrika published
        - link "Igniting Node.js Flame" [ref=e295] [cursor=pointer]:
          - /url: http://www.ebaytechblog.com/2016/06/15/igniting-node-js-flames/
        - text: ", showing how they use the v8-profiler at eBPF to create Node.js flame graphs."
      - listitem [ref=e296]:
        - text: Maciek Lesiczka is building an ASP.NET profiler that includes flame graphs, and introduced it in
        - link "netric.io - lightweight ASP.NET profiler" [ref=e297] [cursor=pointer]:
          - /url: http://macieklesiczka.github.io/2016/06/29/netric_io/
        - text: .
      - listitem [ref=e298]:
        - text: Nitsan Wakart covered Java flame graphs and various Java profiling challenges in his Devoxx UK talk
        - 'link "Extreme Profiling: Digging Into Hotspots by Nitsan Wakart" [ref=e299] [cursor=pointer]':
          - /url: https://www.youtube.com/watch?v=7PkkxDaFDj8
        - text: (youtube).
      - listitem [ref=e300]:
        - text: Maciek Lesiczka has been developing
        - link "netric.io - lightweight ASP.NET profiler" [ref=e301] [cursor=pointer]:
          - /url: http://macieklesiczka.github.io/2016/06/29/netric_io/
        - text: ", an ASP.NET profiler that includes flame graphs."
      - listitem [ref=e302]:
        - text: My article
        - link "The Flame Graph" [ref=e303] [cursor=pointer]:
          - /url: http://cacm.acm.org/magazines/2016/6/202665-the-flame-graph/abstract
        - text: was published in CACM.
    - paragraph [ref=e304]: "More Flame Graph news (updated Dec 2016):"
    - list [ref=e305]:
      - listitem [ref=e306]:
        - text: Rhys Hiltner from Twitch blogged about
        - link "Go's march to low-latency GC" [ref=e307] [cursor=pointer]:
          - /url: https://blog.twitch.tv/gos-march-to-low-latency-gc-a6fa96f06eb7#.yit1viugb
        - text: ", which included flame graph analysis of GC time."
      - listitem [ref=e308]:
        - text: Dmytro Semenov on the ebay tech blog posted
        - link "Mastering the Fire" [ref=e309] [cursor=pointer]:
          - /url: http://www.ebaytechblog.com/2016/07/14/mastering-the-fire/
        - text: ", about how they can create flame graphs on production servers at any time with one click of a button."
      - listitem [ref=e310]:
        - text: Olivier Cano posted about
        - link "Measuring Snap performance" [ref=e311] [cursor=pointer]:
          - /url: https://medium.com/intel-sdi/measuring-snap-performance-7cde2b315a62#.m8t6nxb8i
        - text: which includes flame graphs for golang.
      - listitem [ref=e312]:
        - text: Kay Ousterhout wrote about
