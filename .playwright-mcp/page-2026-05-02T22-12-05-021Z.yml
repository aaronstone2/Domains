    - paragraph [ref=e28]: The example on the right is a portion of a CPU flame graph, showing MySQL codepaths that are consuming CPU cycles, and by how much.
    - paragraph [ref=e29]:
      - text: Flame graphs can also be used for any hierarchical data. E.g., file system contents (see
      - link "instructions" [ref=e30] [cursor=pointer]:
