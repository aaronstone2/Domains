    - heading "Operating Systems" [level=2] [ref=e68]
    - paragraph [ref=e69]: "Some operating system profilers now have built-in support for flame graphs:"
    - list [ref=e70]:
      - listitem [ref=e71]: "Linux: perf (perf script report flamegraph)"
      - listitem [ref=e72]: "Windows: WPA, PerfView"
    - paragraph [ref=e73]: "Flame graphs can also be generated from any profile data that contains stack traces, including from the following profiling tools:"
    - list [ref=e74]:
      - listitem [ref=e75]: "Linux: perf, eBPF, SystemTap, and ktap"
      - listitem [ref=e76]: "FreeBSD: DTrace"
      - listitem [ref=e77]: "Mac OS X: Instruments"
      - listitem [ref=e78]: "Windows: Xperf.exe"
    - paragraph [ref=e79]: Once you have a profiler that can generate meaningful stacks, converting them into a flame graph is usually the easy step.
    - paragraph [ref=e80]: There are also numerous profiling products and companies that now support flame graphs. See the Updates section below.
    - heading "Variations" [level=2] [ref=e81]
    - paragraph [ref=e82]: Icicle charts are flame graphs upside down. Some people prefer it that way. My flamegraph.pl creates them using --inverted. I prefer the standard "flame" layout, where the y-axis is counting stack depth upwards from zero at the bottom. I'm also used to scanning them top-down to look for plateaus. But for very deep stacks the flame graph layout (with a GUI that starts at the top) often means the initial view may be mostly empty (a few thin interrupt stacks) forcing the developer to scroll down to find the bulk of the profile. For developers who prefer reading root-to-leaf anyway, an icicle layout instead means that the starting point is always on screen without needing to scroll. For that reason, many flame graph implementations use the icicle layout by default instead. Others use the flame graph layout but begin showing the bottom so that the root frames are on screen. I don't have a strong opinion about this, do whichever you prefer! Preferably include a toggle so that the end user can pick their preferred layout.
    - paragraph [ref=e83]:
      - text: Flame charts were first added by Google Chrome's WebKit Web Inspector (
      - link "bug" [ref=e84] [cursor=pointer]:
        - /url: https://bugs.webkit.org/show_bug.cgi?id=111162
      - text: ). While inspired by flame graphs, flame charts put the passage of time on the x-axis instead of the alphabet. This means that time-based patterns can studied. Flame graphs reorder the x-axis samples alphabetically, which maximizes frame merging, and better shows the big picture of the profile. Multi-threaded applications can't be shown sensibly by a single flame chart, whereas they can with a flame graphs (a problem flame charts didn't need to deal with, since it was initially used for single-threaded JavaScript analysis). Both visualizations are useful, and tools should make both available if possible (e.g., TraceCompass does). Some analysis tools have implemented flame charts and mistakingly called them flame graphs.
    - paragraph [ref=e85]:
      - text: Sunburst layout using radial coordinates for the x-axis, a flame graph can be turned into a hierarchical pie chart. The Google Web Inspector team
      - link "prototyped" [ref=e86] [cursor=pointer]:
        - /url: https://bugs.chromium.org/p/chromium/issues/detail?id=452624
      - text: them. I also discussed them vs flame graphs in my
      - link "comparison" [ref=e87] [cursor=pointer]:
        - /url: /blog/2017-02-06/flamegraphs-vs-treemaps-vs-sunburst.html
      - text: post.
    - heading "Origin" [level=2] [ref=e88]
    - paragraph [ref=e89]: "I invented flame graphs when working on a MySQL performance issue and needed to understand CPU usage quickly and in depth. The regular profilers/tracers had produced walls of text, so I was exploring visualizations. I first traced CPU function calls and visualized it using Neelakanth Nadgir's time-ordered visualization for callstacks, which itself was inspired by Roch Bourbonnais's CallStackAnalyzer and Jan Boerhout's vftrace. These look similar to flame graphs, but have the passage of time on the x-axis. But there were two problems: the overhead of function tracing was too high, perturbing the target, and the final visualization was too dense to read when spanning multiple seconds. I switched to timed sampling (profiling) to solve the overhead problem, but since the function flow is no longer known (sampling has gaps) I ditched time on the x-axis and reordered samples to maximize frame merging. It worked, the final visualization was much more readable. Neelakanth and Roch's visualizations used completely random colors to differentiate frames. I thought it looked nicer to narrow the color palette, and picked just warm colors initially as it explained why the CPUs were \"hot\" (busy). Since it resembled flames, it quickly became known as flame graphs."
    - paragraph [ref=e90]: I described more detail of the original performance problem that led to flame graphs in my ACMQ/CACM article (link above). The flame graph visualization is really an adjacency diagram with an inverted icicle layout, which I used to visualize profiled stack traces.
    - heading "Updates" [level=2] [ref=e91]
    - paragraph [ref=e92]: "Flame graphs were released in Dec 2011. Not long afterwards (updated in 2012):"
    - list [ref=e93]:
      - listitem [ref=e94]:
        - text: Alan Coopersmith generated flame graphs of the
        - link "X server" [ref=e95] [cursor=pointer]:
          - /url: http://blogs.oracle.com/alanc/entry/flame_on_graphing_hot_paths
        - text: .
      - listitem [ref=e96]:
        - text: Dave Pacheco created them with
        - link "node.js" [ref=e97] [cursor=pointer]:
          - /url: http://dtrace.org/blogs/dap/2012/01/05/where-does-your-node-program-spend-its-time/
        - text: functions.
      - listitem [ref=e98]:
        - text: Max Bruning has also shown how he used it to solve an
        - link "IP scaling issue" [ref=e99] [cursor=pointer]:
          - /url: http://smartos.org/2012/02/28/using-flamegraph-to-solve-ip-scaling-issue-dce/
        - text: .
      - listitem [ref=e100]:
        - text: Dave Pacheco has also created
        - link "stackvis" [ref=e101] [cursor=pointer]:
          - /url: https://www.npmjs.com/package/stackvis
        - text: ", a Node.js implementation, available on npm."
      - listitem [ref=e102]:
        - text: Zoltan Farkas was inspired by flame graphs to create
        - link "Spf4j (Simple performance framework for java)" [ref=e103] [cursor=pointer]:
          - /url: http://zolyfarkas.github.io/spf4j/#
        - text: ", which includes them in a GUI."
    - paragraph [ref=e104]: "More Flame Graph news (updated Apr 2013):"
    - list [ref=e105]:
      - listitem [ref=e106]:
        - text: I wrote some documentation for
        - link "Linux Kernel Flame Graphs" [ref=e107] [cursor=pointer]:
          - /url: FlameGraphs/cpuflamegraphs.html#perf
        - text: ", generated using either perf and SystemTap for the profile data."
      - listitem [ref=e108]:
        - text: Mark Probst developed
        - link "Flame Graphs for Instruments" [ref=e109] [cursor=pointer]:
          - /url: http://schani.wordpress.com/2012/11/16/flame-graphs-for-instruments/
        - text: on Mac OS X.
      - listitem [ref=e110]:
        - text: Sam Saffron has developed
        - link "Flame graphs in Ruby MiniProfiler" [ref=e111] [cursor=pointer]:
          - /url: http://samsaffron.com/archive/2013/03/19/flame-graphs-in-ruby-miniprofiler
        - text: ", and shows examples of amazingly deep stacks."
      - listitem [ref=e112]:
        - text: Bruce Dawson has an excellent post on
        - link "Summarizing Xperf CPU Usage with Flame Graphs" [ref=e113] [cursor=pointer]:
          - /url: http://randomascii.wordpress.com/2013/03/26/summarizing-xperf-cpu-usage-with-flame-graphs/
        - text: on Microsoft Windows. It includes examples for Visual Studio and Outlook, and a stack folding script to process the Xperf output.
      - listitem [ref=e114]:
        - text: Google Chrome's performance analysis tool, WebKit Web Inspector, introduced "
        - link "Flame Charts" [ref=e115] [cursor=pointer]:
          - /url: https://bugs.webkit.org/show_bug.cgi?id=111162
        - text: "\", inspired by flame graphs. These are a similar visualization, but the x-axis is time, instead of the alphabet. Check out the"
        - link "screenshot" [ref=e116] [cursor=pointer]:
          - /url: https://bug-113052-attachments.webkit.org/attachment.cgi?id=194532
        - text: ", which includes a mouse-over popup that links to the source code. (Update: there is a bug to add flame graphs to Chrome, in addition to flame charts:"
        - link "Chromium 452624" [ref=e117] [cursor=pointer]:
          - /url: https://code.google.com/p/chromium/issues/detail?id=452624
        - text: .)
      - listitem [ref=e118]:
        - text: Tim Bunce has been improving and adding features to Flame Graphs, and has included them in Perl's best profiler, Devel:::NYTProf, for profiling Perl. See his post on
        - link "NYTProf v5 – Flaming Precision" [ref=e119] [cursor=pointer]:
          - /url: http://blog.timbunce.org/2013/04/08/nytprof-v5-flaming-precision/
        - text: .
    - paragraph [ref=e120]: "More Flame Graph news (updated Aug 2013):"
    - list [ref=e121]:
      - listitem [ref=e122]:
        - text: I wrote a document summarizing four techniques for generating
        - link "Memory Leak (and Growth) Flame Graphs" [ref=e123] [cursor=pointer]:
          - /url: FlameGraphs/memoryflamegraphs.html
        - text: ", which visualize stacks with byte counts, instead of the traditional CPU sample Flame Graphs. I also colored them green to indicate that they are a different type."
      - listitem [ref=e124]:
        - text: John Graham-Cumming showed how CloudFlare was using SystemTap-generated flame graphs for optimizing their
        - link "Lua WAF" [ref=e125] [cursor=pointer]:
          - /url: http://blog.cloudflare.com/cloudflares-new-waf-compiling-to-lua
        - text: .
      - listitem [ref=e126]:
        - text: Yichun Zhang showed how
        - link "Off-CPU Time Flame Graphs" [ref=e127] [cursor=pointer]:
          - /url: http://t.co/tusuJkqKXF
        - text: (PDF) can solve issues of blocking time. See
        - link "Off-CPU Analysis" [ref=e128] [cursor=pointer]:
          - /url: offcpuanalysis.html
        - text: for why this is important.
      - listitem [ref=e129]:
        - text: Igor Soarez wrote
        - link "How To Make Flame Graphs" [ref=e130] [cursor=pointer]:
          - /url: http://blog.crowdprocess.com/post/58797416513/how-to-make-flame-graphs
        - text: for node.js analysis, showing all steps involved.
      - listitem [ref=e131]:
        - link "Paul Irish" [ref=e132] [cursor=pointer]:
          - /url: https://plus.google.com/+PaulIrish/posts/3nqbozQF3VN
        - text: and
        - link "Umar Hansa" [ref=e133] [cursor=pointer]:
          - /url: https://plus.google.com/111696301786817020074/posts/7PjohGxGECZ
        - text: posted an awesome demo of using FlameCharts to investigate time in V8, which includes zooming in and clicking on functions to go to code, and Addy Osmani posted a longer
        - link "video tutorial" [ref=e134] [cursor=pointer]:
          - /url: http://addyosmani.com/blog/devtools-flame-charts/
        - text: ". While these aren't Flame Graphs, they show developments in a related visualization: a time-series version that retains sequence and ordering."
