                      - /url: mailto:?&subject=From%20MDPI%3A%20%22Twelve%20Weeks%20Rest%26ndash%3BPause%20and%20Traditional%20Resistance%20Training%3A%20Effects%20on%20Myokines%20and%20Performance%20Adaptations%20among%20Recreationally%20Trained%20Men"&body=https://www.mdpi.com/2124616%3A%0A%0ATwelve%20Weeks%20Rest%26ndash%3BPause%20and%20Traditional%20Resistance%20Training%3A%20Effects%20on%20Myokines%20and%20Performance%20Adaptations%20among%20Recreationally%20Trained%20Men%0A%0AAbstract%3A%20A%20rest%26ndash%3Bpause%20%28RP%29%20technique%20involves%20performing%20one%20or%20more%20repetitions%20at%20high%20resistance%20to%20failure%2C%20followed%20by%20a%20short%20rest%20before%20performing%20one%20or%20more%20repetitions.%20These%20techniques%20can%20affect%20neuromuscular%20conditions%20and%20fatigue%20by%20changing%20the%20rest%20time%20between%20repetitions.%20This%20study%20compared%20the%20effect%20of%2012%20weeks%20of%20RP%20and%20traditional%20resistance%20training%20%28TRT%29%20on%20myokines%20%28myostatin%20%28MSTN%29%2C%20follistatin%20%28FLST%29%20and%20insulin-like%20growth%20factor-1%20%28IGF-1%29%29%20and%20functional%20adaptations.%20The%20study%20recruited%2029%20men%20between%20the%20ages%20of%2020%20and%2030%20who%20had%20performed%20resistance%20training%20for%20at%20least%206%20to%2012%20months.%20Participants%20were%20randomly%20divided%20into%20three%20groups%3A%20RP%2C%20TRT%2C%20and%20control%3B%20resistance%20training%20was%20performed%203%20days%20per%20week%20for%2012%20weeks.%20The%20training%20methods%20of%20the%20two%20groups%20were%20largely%20similar.%20The%20results%20showed%20that%20RP%20increased%20IGF-1%20and%20FLST%2FMSTN%20more%20than%20the%20TRT%20group%20%28%25%20change%20%3D%2019.04%2C%20%25%20change%20%3D%2037.71%29%2C%20and%20only%20the%20RP%20and%20TRT%20groups%20had%20significant%20changes%20in%20the%20FLST%2FMSTN%20ratio%20compared%20to%20the%20control%20group%20%28p%20%26lt%3B%200.001[...]
