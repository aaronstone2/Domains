                      - heading "1. Introduction" [level=2] [ref=e160]
                      - generic [ref=e161]:
                        - text: The various resistance training systems are divided into high volume and high intensity, which trainers and athletes commonly use. In these methods, the traditional techniques derived from advanced training are often used, and the new relaxation techniques are derived from advanced training. Each technique works with different volumes, strengths, frequencies, and rest periods. Traditional methods are the most common training methods. In this method, the athlete increases the weight in each set and completes the exercise with maximum strength. This method is used during strength and hypertrophy. The RP method is also the most popular training method today. Today, recreational and professional athletes regularly use the RP technique, which includes short rest periods between low, high repetitions [
                        - link "1" [ref=e162] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: "]. This method involves lifting a specific weight to exhaustion (usually 10–12 reps) followed by short sets (3–4 sets) of high intensity (85–90% of 1RM) and short periods of rest (10–12 reps at 12 s.) and low frequency (2 to 5 repetitions) until complete physical exhaustion ["
                        - link "2" [ref=e163] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: "]. According to Paoli et al., RP training methods have been shown to use more energy and may require more energy than traditional resistance training (TRT) ["
                        - link "3" [ref=e164] [cursor=pointer]:
                          - /url: "#B3-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e165]:
                        - text: The metabolic stress of RP and the emphasis on the phosphogenic and glycolytic energy systems may differ from traditional multiset training [
                        - link "1" [ref=e166] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: "]. For example, in the RP protocol, the exercise is performed initially at 80% 1RM, followed by subsequent sets in 20 s intervals for a total of 18 reps; about 8–12 reps of 80% 1RM in the first set will cause failure ["
                        - link "4" [ref=e167] [cursor=pointer]:
                          - /url: "#B4-stresses-03-00022"
                        - text: "] in the phosphogene and glycolytic system for energy transfer. Since muscle phosphocreatine (PCr) levels can recover quickly ["
                        - link "5" [ref=e168] [cursor=pointer]:
                          - /url: "#B5-stresses-03-00022"
                        - text: "], a 20 s interval after the first set allows for a relative PCr synthesis that makes it easier to perform more repetitions in the training set. These repetitions again (up to a total of 18) increase the level of metabolic load (from the first) and stimulate the expression of hypertrophy in the muscle ["
                        - link "6" [ref=e169] [cursor=pointer]:
                          - /url: "#B6-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e170]:
                        - text: Resistance training increases muscle mass [
                        - link "7" [ref=e171] [cursor=pointer]:
                          - /url: "#B7-stresses-03-00022"
                        - text: "], volume exercise ["
                        - link "8" [ref=e172] [cursor=pointer]:
                          - /url: "#B8-stresses-03-00022"
                        - text: "], and the number of steps performed ["
                        - link "9" [ref=e173] [cursor=pointer]:
                          - /url: "#B9-stresses-03-00022"
                        - text: "] in most healthy individuals; it is a characteristic of the physical training response used in training ["
                        - link "10" [ref=e174] [cursor=pointer]:
                          - /url: "#B10-stresses-03-00022"
                        - text: ","
                        - link "11" [ref=e175] [cursor=pointer]:
                          - /url: "#B11-stresses-03-00022"
                        - text: "]. Muscle growth and hypertrophy caused by resistance training affect many factors, including myogenic regulatory factor (MRF), transforming growth factor beta (TGF-β) such as myostatin (MSTN) and follistatin (FLST), and endocrine and paracrine growth hormone (GH) and insulin-like growth factor (IGF-1), whose metabolic activity increases protein synthesis and stimulates muscle fiber hypertrophy. MSTN is expressed and secreted in muscle cells, which is less expressed and secreted in various tissues such as the brain and adipose tissue, and has functions such as inhibiting the hypertrophic growth of muscle cells and the prevention of proliferation of these cells (inhibition of hyperplastic growth) ["
                        - link "12" [ref=e176] [cursor=pointer]:
                          - /url: "#B12-stresses-03-00022"
                        - text: "]. FLST is a glycoprotein expressed and secreted in almost all mammalian tissues, especially skeletal muscle. The main function of FLST is to suppress the effects of TGF-β family proteins, including MSTN. In the case of FLST, the MSTN cannot connect to its receiver and functionality ["
                        - link "13" [ref=e177] [cursor=pointer]:
                          - /url: "#B13-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e178]: The effect of RP training on hormonal changes has not been investigated. Based on the evidence that RP training can achieve better metabolic response and repair than TRT, we hypothesize that RP training can significantly affect hormonal adjustments, strength and muscle hypertrophy. Therefore, to clarify the benefits of this technique and to solve the hormonal and functional confusion, this study aims to evaluate the effect of 12 weeks of RP and TRT on muscle activity and myokines in men.
                    - generic [ref=e179]:
                      - heading "2. Results" [level=2] [ref=e180]
                      - generic [ref=e181]:
                        - text: "The descriptive characteristics of the subjects are RP group: age (years) = 25.64 ± 4.35, height (cm) = 176.10 ± 7.20, body mass (kg): 81.42 ± 12.53; TRT group: age (years) = 26.19±3.27, height (cm) = 180.70 ± 5.05, body mass (kg): 80.57±13.33; control group: age (years) = 24.39 ± 4.11, height (cm) = 174.88 ± 8.38, body mass (kg): 80.17 ± 19.56. According to the results of"
                        - link "Figure 1" [ref=e182] [cursor=pointer]:
                          - /url: "#fig_body_display_stresses-03-00022-f001"
                        - text: ", the levels of IGF-1, FLST and the ratio of FLST to MSTN increased significantly after 12 weeks of RP resistance training (ES = 0.41, p = 0.03; ES = 1.00, p = 0.001; ES = 1.40, p = 0.001; respectively), MSTN levels decreased but the changes were not significant (ES = 0.33, p = 0.07); In addition, in the RP group, strength of upper-body, lower-body, thigh and arm MCSA and SMM increased, and PBF decreased; the changes observed after 12 weeks of training were significant (ES = 2.03, p < 0.001; ES = 2.35, p < 0.001; ES = 1.38, p < 0.001; ES = 1.53, p < 0.001; ES = 0.25, p = 0.02; ES = 0.43, p = 0.02; respectively,"
                        - link "Table 1" [ref=e183] [cursor=pointer]:
                          - /url: "#table_body_display_stresses-03-00022-t001"
                        - text: ).
                      - generic [ref=e184]:
                        - generic [ref=e186] [cursor=pointer]:
                          - img "Stresses 03 00022 g001a" [ref=e187]
                          - img "Stresses 03 00022 g001b" [ref=e188]
                          - link [ref=e189]:
                            - /url: "#fig_body_display_stresses-03-00022-f001"
                        - generic [ref=e190]: "Figure 1. Changes in hormonal responses to resistance program (IGF-1 (A), MSTN (B), FLST (C), FLST/MSTN (D)). TR: traditional, RP: rest–pause, C: control, MSTN: myostatin, FLST: follistatin, IGF-1: insulin-like growth factor-1, EF: effect size. * denotes significant differences between baseline and post-testing values (p ≤ 0.05); # denotes significant differences between the RP and TR groups with the C group. (p ≤ 0.05)."
                      - generic [ref=e191]:
                        - generic [ref=e192]: Table 1. Changes in body composition, muscle strength and hypertrophy in response to 12-week training intervention (mean ± SD).
                        - generic [ref=e194] [cursor=pointer]:
                          - img [ref=e195]
                          - link [ref=e196]:
                            - /url: "#table_body_display_stresses-03-00022-t001"
                      - generic [ref=e197]:
                        - text: As shown in
                        - link "Figure 1" [ref=e198] [cursor=pointer]:
                          - /url: "#fig_body_display_stresses-03-00022-f001"
                        - text: ", changes in MSTN, FLST, and the ratio of FLST to MSTN were significant in the TRT group (ES = 0.73, p = 0.03; ES = 1.77, p < 0.001; ES = 2.63, p < 0.001; respectively), but although IGF-1 levels increased after 12 weeks of training, the observed changes were not significant (ES = 0.29, p = 0.57). According to the results of"
                        - link "Table 1" [ref=e199] [cursor=pointer]:
                          - /url: "#table_body_display_stresses-03-00022-t001"
                        - text: ", changes in upper- and lower-body muscle strength, thigh and arm MCSA, BMI, SMM and PBF were significant after 12 weeks of TRT (ES = 1.77, p < 0.001; ES = 1.32, p < 0.001; ES = 0.70, p < 0.001; ES = 0.93, p < 0.001; ES = 0.20, p = 0.09; ES = 0.27, p = 0.01; ES = 0.55, p = 0.001, respectively). In addition, the observed changes were not significant in the control group (p > 0.05)."
                      - generic [ref=e200]:
                        - text: As depicted in
                        - link "Figure 1" [ref=e201] [cursor=pointer]:
                          - /url: "#fig_body_display_stresses-03-00022-f001"
                        - text: ", the most remarkable alterations in IGF-1 levels were observed in the RP group, but the differences were insignificant (%Change = 19.04, p = 0.1). Additionally, the MSTN levels decreased in all three groups of patients with RP, TRT, and a control group, but the differences between the groups were insignificant (%Change = −10.08; %Change = −8.37; %Change = −0.32; respectively, p = 0.1). Conversely, FLST levels increased in the RP and TRT groups (%Change = 21.05 and %Change = 19.55; respectively) and these increases were significant compared to the control group (p = 0.002 and p = 0.001; respectively). The findings indicated that the largest increase in the FLST/MSTN ratio was in the RP group (%Change RP group = 37.71; %Change TRT group = 31.78; %Change control group = 0.27), and the changes in the RP and TRT groups were significant compared to the control group (p < 0.001; p = 0.02; respectively,"
                        - link "Figure 1" [ref=e202] [cursor=pointer]:
                          - /url: "#fig_body_display_stresses-03-00022-f001"
                        - text: ).
                      - generic [ref=e203]:
                        - text: "Upper- and lower-body muscle strength in the RP group increased more than the other groups, and the changes were significant in all groups (RP group upper-body: %Change = 74.90; RP group lower-body: %Change = 63.79; TRT group upper-body: %Change = 63.54; TRT group lower-body: %Change = 51.19; control group upper-body: %Change = −0.69; control group lower-body: %Change = 1.78; p< 0.006) ("
                        - link "Table 1" [ref=e204] [cursor=pointer]:
                          - /url: "#table_body_display_stresses-03-00022-t001"
                        - text: "). Additionally, the increase rate in the thigh and arm MCSA in the RP group was higher than the other two groups, and the intergroup changes in all three groups were significant (RP group: thigh MCSA %Change = 32.86; arm MCSA %Change = 33.80; TRT group: thigh MCSA %Change = 17.72; arm MCSA %Change = 19.36; control group: thigh MCSA %Change = −0.25; arm MCSA %Change = −0.21; p < 0.05)."
                        - link "Table 1" [ref=e205] [cursor=pointer]:
                          - /url: "#table_body_display_stresses-03-00022-t001"
                        - text: demonstrates that SMM levels increased in both the RP and TRT groups (a change of 3.48 and 4.58%, respectively); however, the increase in the TRT group was greater and was significant when compared to the control group (p = 0.02). Additionally, the differences in PBF levels between the RP and TRT groups and the control group were significant (p = 0.005 and p = 0.01, respectively). Contrastingly, there were no significant differences in BMI levels between the groups (p = 0.67) (
                        - link "Table 1" [ref=e206] [cursor=pointer]:
                          - /url: "#table_body_display_stresses-03-00022-t001"
                        - text: ).
                    - generic [ref=e207]:
                      - heading "3. Discussion" [level=2] [ref=e208]
                      - generic [ref=e209]: This study compared the effect of 12 weeks of RP versus TRT on muscle activity and myokines (MSTN, FLST, and IGF-1) in active men. The study showed that the practice of RP increases muscle strength and upper-body and lower-body MCSA and reduces PBF compared to the TRT. Furthermore, IGF-1 levels increased in the RP group, while MSTN levels decreased in the TR group, but the difference between the two groups was insignificant. Changes in FLST levels in the RP and TRT groups were significant compared to the control group. Moreover, the greatest increase in the FLST/MSTN ratio was observed in the RP group, with changes in the PR and TRT groups.
                      - generic [ref=e210]:
                        - text: Resistance training stimulates muscle growth by increasing the positive effects of muscle growth and by suppressing the negative effects by increasing hypertrophy and hyperplasia. The rate of release of myokine and factors regulating muscle growth affect the volume and strength of the muscles involved in the activity [
                        - link "14" [ref=e211] [cursor=pointer]:
                          - /url: "#B14-stresses-03-00022"
                        - text: "]. Due to the loss of muscle mass and the expansion of protein synthesis, the main cause of muscle hypertrophy is stimulated ["
                        - link "15" [ref=e212] [cursor=pointer]:
                          - /url: "#B15-stresses-03-00022"
                        - text: "]. The interest of these proteins is a signaling system that leads to a positive balance of myogenic factors such as FLST, Myo-D and c-fos, and a negative balance of myostatic factors such as MSTN. As a result, a good balance of the hypertrophic process is brought about by increasing the synthesis of synthetic proteins and the increase in the penetration of satellite cells by cells ["
                        - link "16" [ref=e213] [cursor=pointer]:
                          - /url: "#B16-stresses-03-00022"
                        - text: "]. On the other hand, the intensity or level of resistance produced during resistance training can also affect motor unit activation. The number and type of active motor units also affect the level of secreted myokines and their autocrine and paracrine functions ["
                        - link "17" [ref=e214] [cursor=pointer]:
                          - /url: "#B17-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e215]:
                        - text: The current study showed that the RP training increased IGF-1 levels more than the TRT group, but the observed differences were not significant. In addition, FLST levels increased in both groups to a similar extent, but the changes in the control group were not significant. In addition, MSTN levels decreased in the RP and TRT groups, but the rate of decrease was not significant. The ratio of FLST to MSTN in the RP group was higher than in the others, and the differences between the groups in the RP and TRT were different compared to the controls. To date, no studies have investigated the effects of PR training on IGF-1, FLST, or MSTN levels. Some researchers have suggested that using different methods of resistance training can lead to a better anabolic environment and improve the effect of training on muscles [
                        - link "1" [ref=e216] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: ","
                        - link "18" [ref=e217] [cursor=pointer]:
                          - /url: "#B18-stresses-03-00022"
                        - text: ","
                        - link "19" [ref=e218] [cursor=pointer]:
                          - /url: "#B19-stresses-03-00022"
                        - text: ","
                        - link "20" [ref=e219] [cursor=pointer]:
                          - /url: "#B20-stresses-03-00022"
                        - text: "]. For example, a drop set increases the metabolic stress due to the large number of consecutive repetitions performed ["
                        - link "19" [ref=e220] [cursor=pointer]:
                          - /url: "#B19-stresses-03-00022"
                        - text: ","
                        - link "20" [ref=e221] [cursor=pointer]:
                          - /url: "#B20-stresses-03-00022"
                        - text: "]. In addition, by extending the time spent at high loads, RP can help to increase the workload ["
                        - link "1" [ref=e222] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: ","
                        - link "2" [ref=e223] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: "]. Girman et al. ["
                        - link "21" [ref=e224] [cursor=pointer]:
                          - /url: "#B21-stresses-03-00022"
                        - text: "] found no difference in GH between cluster and TRT in a group of trained men. Slow movement increases GH more than tempo movement, and tempo also plays an important role ["
                        - link "22" [ref=e225] [cursor=pointer]:
                          - /url: "#B22-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e226]:
                        - text: The RP system involves first lifting a fixed load to exhaustion (usually 10–12 repetitions) followed by subsequent sets using short rest intervals (10–20 s) [
                        - link "2" [ref=e227] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: "]. The recommended amount of rest varied between repetitions in different studies. Increased mechanical stress (i.e., the time spent under stress associated with heavy loads) and metabolic stress (i.e., the accumulation of metabolites in the muscle, muscle hypoxia, and changes in the local myogenic factors) caused by the RP system can lead to an increase in muscle mass or strength by increasing the number of fibers used or by altering the release of myokin and the expansion of cells versus TRT ["
                        - link "1" [ref=e228] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: ","
                        - link "2" [ref=e229] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: ","
                        - link "6" [ref=e230] [cursor=pointer]:
                          - /url: "#B6-stresses-03-00022"
                        - text: ","
                        - link "20" [ref=e231] [cursor=pointer]:
                          - /url: "#B20-stresses-03-00022"
                        - text: "]. Additionally, differences in amplitude of repetition may lead to a greater advantage for the glycolytic pathway in the RP group, which in turn may lead to greater muscle fiber swelling and metabolic stress, which appears to promote anabolism ["
                        - link "6" [ref=e232] [cursor=pointer]:
                          - /url: "#B6-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e233]:
                        - text: RP technique is one of the functional systems of the comprehensive high-intensity training (HIT) system [
                        - link "2" [ref=e234] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: "]. HIT can increase testosterone, cortisol ["
                        - link "22" [ref=e235] [cursor=pointer]:
                          - /url: "#B22-stresses-03-00022"
                        - text: ","
                        - link "23" [ref=e236] [cursor=pointer]:
                          - /url: "#B23-stresses-03-00022"
                        - text: ","
                        - link "24" [ref=e237] [cursor=pointer]:
                          - /url: "#B24-stresses-03-00022"
                        - text: "] and the testosterone-to-cortisol ratio ["
                        - link "25" [ref=e238] [cursor=pointer]:
                          - /url: "#B25-stresses-03-00022"
                        - text: ","
                        - link "26" [ref=e239] [cursor=pointer]:
                          - /url: "#B26-stresses-03-00022"
                        - text: "]. The results of Elliott et al. showed that HIT increases plasma FLST in inactive subjects ["
                        - link "27" [ref=e240] [cursor=pointer]:
                          - /url: "#B27-stresses-03-00022"
                        - text: "]. Regarding the role of MSTN and FLST in the response to resistance training, studies have shown that MSTN plasma levels decrease after several weeks of resistance training, whereas FLST concentrations increase after resistance training ["
                        - link "28" [ref=e241] [cursor=pointer]:
                          - /url: "#B28-stresses-03-00022"
                        - text: ","
                        - link "29" [ref=e242] [cursor=pointer]:
                          - /url: "#B29-stresses-03-00022"
                        - text: ","
                        - link "30" [ref=e243] [cursor=pointer]:
                          - /url: "#B30-stresses-03-00022"
                        - text: "]. Activated muscle mass is a key determinant of endocrine anabolic hormone responses to resistance training ["
                        - link "31" [ref=e244] [cursor=pointer]:
                          - /url: "#B31-stresses-03-00022"
                        - text: ","
                        - link "32" [ref=e245] [cursor=pointer]:
                          - /url: "#B32-stresses-03-00022"
                        - text: "]. Mourkioti et al. showed that FLST levels increase depending on the volume of active muscle groups ["
                        - link "33" [ref=e246] [cursor=pointer]:
                          - /url: "#B33-stresses-03-00022"
                        - text: "]. In this study, an attempt was made to activate more muscle mass during the training session through primary movement. The present study attempted to activate muscle volume in training sessions using the main movements. These exercises significantly increased follistatin in both training groups. Myokine production can vary depending on various factors, including diet, lifestyle, medication, circadian rhythm, and several other factors ["
                        - link "34" [ref=e247] [cursor=pointer]:
                          - /url: "#B34-stresses-03-00022"
                        - text: "]. It is possible that some of these influencing factors influenced the results of the current study, as they were considered part of the study’s limitations, in addition to controlling the subjects’ nutrition (a food recall questionnaire was used), assessing their familiarity and skills related to RP implementation and movement speed (tempo)."
                      - generic [ref=e248]:
                        - text: HIT increases the activation of signaling pathways associated with contractile proteins, thereby increasing myokine levels [
                        - link "16" [ref=e249] [cursor=pointer]:
                          - /url: "#B16-stresses-03-00022"
                        - text: "]. In our study, training RP as a HIT also increases the ratio of FLST to MSTN. Resistance training-induced muscle hypertrophy can be achieved by altering the balance of muscle protein synthesis, increasing molecular stimulation of mitogen-activated protein kinase (MAPK) and Ca"
                        - superscript [ref=e250]: "+2"
                        - text: signaling pathways, and inhibiting protein degradation pathways and apoptosis (such as forkhead boxes) to realize protein O (FOXO) [
                        - link "17" [ref=e251] [cursor=pointer]:
                          - /url: "#B17-stresses-03-00022"
                        - text: "]. MSTN and FLST in these processes are significant; FLST is essential for forming, growing, and developing muscle fibers ["
                        - link "35" [ref=e252] [cursor=pointer]:
                          - /url: "#B35-stresses-03-00022"
                        - text: "]. Elevated FLST is a powerful agonist that stimulates all signaling pathways for protein synthesis and inhibits protein degradation pathways ["
                        - link "35" [ref=e253] [cursor=pointer]:
                          - /url: "#B35-stresses-03-00022"
                        - text: "]. A significant increase in FLST stimulates all signaling pathways involved in protein synthesis and suppresses protein breakdown ["
                        - link "35" [ref=e254] [cursor=pointer]:
                          - /url: "#B35-stresses-03-00022"
                        - text: "]. Further, FLST stimulates satellite cells, essential for muscle repair and development ["
                        - link "16" [ref=e255] [cursor=pointer]:
                          - /url: "#B16-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e256]:
                        - text: In addition to the role of FLST in the development of muscle tissue, it affects increasing bone growth and density by increasing osteoblastic activity and decreasing osteoclastic activity [
                        - link "36" [ref=e257] [cursor=pointer]:
                          - /url: "#B36-stresses-03-00022"
                        - text: "]; as well, its role in increasing fat metabolism and reducing fat stores has been reported ["
                        - link "37" [ref=e258] [cursor=pointer]:
                          - /url: "#B37-stresses-03-00022"
                        - text: "]. However, an important part of the myogenic mechanisms of FLST is due to its function in suppressing members of the TGF-β family, especially MSTN ["
                        - link "35" [ref=e259] [cursor=pointer]:
                          - /url: "#B35-stresses-03-00022"
                        - text: "]. FLST directly disrupts the function of MSTN by reducing levels of the free protein MSTN as well as by binding to its specific receptor, and it indirectly reduces the function of other members of the TGF-β family by activating certain mediators ["
                        - link "35" [ref=e260] [cursor=pointer]:
                          - /url: "#B35-stresses-03-00022"
                        - text: "]. The mechanism of action of MSTN is the same as that of bidirectional FLST because, unlike FLST, it disrupts all intracellular anabolic pathways and protein synthesis by activating many SMAD proteins. Similar to FOXO, all catabolic processes are accelerated, eventually leading to muscle tissue atrophy ["
                        - link "38" [ref=e261] [cursor=pointer]:
                          - /url: "#B38-stresses-03-00022"
                        - text: "]. Furthermore, MSTN receptors in adipose and bone tissue cells indicate the opposite function of MSTN to FLST in these tissues ["
                        - link "37" [ref=e262] [cursor=pointer]:
                          - /url: "#B37-stresses-03-00022"
                        - text: "]. Thus, small changes in the levels of these myokines can play a role in the process of muscle and bone development as well as metabolic balances in the body ["
                        - link "37" [ref=e263] [cursor=pointer]:
                          - /url: "#B37-stresses-03-00022"
                        - text: "]. Studies have shown that exogenously increasing FLST levels or suppressing MSTN gene expression, which causes a significant increase in fast-twitch fibers compared with slow-twitch fibers, promotes muscle hypertrophy. As a result of high-intensity training, fast-twitch motor units are more active, resulting in higher muscle myokines and myogenic factors ["
                        - link "17" [ref=e264] [cursor=pointer]:
                          - /url: "#B17-stresses-03-00022"
                        - text: ","
                        - link "38" [ref=e265] [cursor=pointer]:
                          - /url: "#B38-stresses-03-00022"
                        - text: "]. On the other hand, previous research has shown exercise-induced muscle hypertrophy. This growth is dependent on levels of hormones such as GH, IGF-1, testosterone and cortisol, which are affected by how intensely and vigorously an exercise is performed ["
                        - link "39" [ref=e266] [cursor=pointer]:
                          - /url: "#B39-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e267]:
                        - text: Resistance training with higher intensity loads produces greater growth hormone levels than resistance training with lower intensity loads, which depends on the type of exercise (cardio vs. strength), how much work is done in a particular number of repetitions, and the muscle group being exercised [
                        - link "39" [ref=e268] [cursor=pointer]:
                          - /url: "#B39-stresses-03-00022"
                        - text: "]. Additionally, the exercise at a high frequency using lighter weights results in larger GH responses than working out at a slower pace with heavier weights ["
                        - link "39" [ref=e269] [cursor=pointer]:
                          - /url: "#B39-stresses-03-00022"
                        - text: "]. Growth and tissue repair increase GH levels, which activate anabolic growth factors such as PI3K and IRS-1/2 ["
                        - link "39" [ref=e270] [cursor=pointer]:
                          - /url: "#B39-stresses-03-00022"
                        - text: "]. Different factors affect hormonal adaptations, including exercise pattern, intensity, duration, tempo, and muscle group volume. This study investigated RP for the first time in the context of hormonal changes, with an increased ratio of IGF-1 and FLST to MSTN observed in both RP and TRT (higher in RP). Furthermore, MSTN was reported to have decreased (more so in TRT). However, drawing definitive conclusions from these results is difficult, and thus, more research is needed."
                      - generic [ref=e271]:
                        - text: The results showed that changes in upper-body and lower-body strength, thigh and arm MCSA, SMM and PBF were significant in RP and TRT groups after 12 weeks of training. Upper- and lower-body muscle strength, and arm and thigh MCSA in the RP group increased more than in other groups; between-group changes were significant. The changes in PBF levels in the RP and TRT groups compared to the control group were significant. In addition, SMM increased in both groups, but significant changes were observed in the TRT group compared to the control group. The upper-body and lower-body strength increased a lot in the RP group (ES = 2.03, ES = 2.35; respectively); this could have been due to poor technique and lack of motivation at the start of the training protocol. Training for 12 weeks can improve people’s movement technique and increase their self-confidence and motivation. Additionally, the metabolic and hormonal responses associated with muscle failure provide a significant stimulus for strength and neuromuscular adaptations during RP training [
                        - link "2" [ref=e272] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: "]. Regular training also leads to more physiological and neurological adaptations in recreational athletes, which is why their records can increase at the end of the training protocol. In this regard, we can refer to the study of Enes et al. ["
                        - link "40" [ref=e273] [cursor=pointer]:
                          - /url: "#B40-stresses-03-00022"
                        - text: "], who found that RP produces a greater increase in muscle strength than TRT. After a 12-week resistance training program involving hypertrophic intensity, Oliver et al. found that trained men in the cluster training group had greater strength and power than those in the TRT group ["
                        - link "41" [ref=e274] [cursor=pointer]:
                          - /url: "#B41-stresses-03-00022"
                        - text: "]. In contrast to these results, some studies ["
                        - link "1" [ref=e275] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: ","
                        - link "42" [ref=e276] [cursor=pointer]:
                          - /url: "#B42-stresses-03-00022"
                        - text: "] did not find a significant difference in muscle strength between the RP and TRT groups. According to Prestes et al., RP training is an effective method for building upper-body and lower-body muscle strength recreationally. The increased strength in the RP training was equivalent to the TRT ["
                        - link "1" [ref=e277] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: "]. In addition, Korak et al. in their study stated that while changes in strength and neural activation did not differ between groups, 1RMs increased in both groups ["
                        - link "42" [ref=e278] [cursor=pointer]:
                          - /url: "#B42-stresses-03-00022"
                        - text: "]. Some studies have shown an increase in the strength of recreational and non-recreational athletes in both RP and traditional multi-set training systems ["
                        - link "43" [ref=e279] [cursor=pointer]:
                          - /url: "#B43-stresses-03-00022"
                        - text: ","
                        - link "44" [ref=e280] [cursor=pointer]:
                          - /url: "#B44-stresses-03-00022"
                        - text: "]."
                      - generic [ref=e281]:
                        - text: In addition, Gantois et al. stated that RP and TRT to muscular failure would further reduce countermovement jump height and perceive more training load than non-failure training. RP system to muscular failure leads to higher acute neuromuscular dysfunction. RP non-failure had no effect on neuromuscular function and reduced training load and metabolic stress compared to other trials [
                        - link "45" [ref=e282] [cursor=pointer]:
                          - /url: "#B45-stresses-03-00022"
                        - text: "]. Regarding the increase in muscle hypertrophy, the results of Prestes et al. ["
                        - link "1" [ref=e283] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: "] and Korak et al. ["
                        - link "42" [ref=e284] [cursor=pointer]:
                          - /url: "#B42-stresses-03-00022"
                        - text: "] were in line with the results of the present study. Prestes et al. showed that the RP system achieved better results in thigh muscle hypertrophy. They stated this because trainers often change training techniques in programs to continue to increase strength and muscle mass ["
                        - link "1" [ref=e285] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: "]; thus, if maximizing muscle endurance, hypertrophy, and time efficiency ["
                        - link "2" [ref=e286] [cursor=pointer]:
                          - /url: "#B2-stresses-03-00022"
                        - text: "] are of primary importance, then the RP technique should be used instead of the TRT technique ["
                        - link "1" [ref=e287] [cursor=pointer]:
                          - /url: "#B1-stresses-03-00022"
                        - text: "]. In addition, Korak et al. concluded that RP increases hypertrophy more than the TRT group. The RP system should be used if the training goal is to increase hypertrophy ["
                        - link "42" [ref=e288] [cursor=pointer]:
                          - /url: "#B42-stresses-03-00022"
                        - text: "]. The pauses used in a set in RP training allow for some PCr to be regenerated."
                      - generic [ref=e289]:
                        - text: However, studies have shown that complete re-synthesis of PCr after high-intensity training sessions may require ≥170 s [
                        - link "46" [ref=e290] [cursor=pointer]:
                          - /url: "#B46-stresses-03-00022"
                        - text: "]. It is possible that some PCr resynthesis occurred at this time. This can delay fatigue and increase muscle strength during RP training ["
                        - link "42" [ref=e291] [cursor=pointer]:
                          - /url: "#B42-stresses-03-00022"
                        - text: "]. Although the underlying mechanisms are not well understood, it is speculated that more mechanical work will alter signaling pathways related to ribosome biogenesis and muscle protein synthesis ["
                        - link "47" [ref=e292] [cursor=pointer]:
                          - /url: "#B47-stresses-03-00022"
                        - text: ","
                        - link "48" [ref=e293] [cursor=pointer]:
                          - /url: "#B48-stresses-03-00022"
                        - text: "], which ultimately increases muscular mass. Resistance training includes mechanical stimuli and is a decisive factor that increases skeletal muscle growth. This increase is caused by increased expression of IGF-1 or mechanical growth factor (MGF) protein, which leads to activation of successive signaling cascades PI3K and phosphoinositide-dependent kinase 1 (PDK1) and Akt. After this, Akt activates two independent pathways: mammalian target point of rapamycin (mTOR) and glycogen synthase kinase-3β (GSK3β), which play a key role in skeletal muscle hypertrophy ["
                        - link "49" [ref=e294] [cursor=pointer]:
                          - /url: "#B49-stresses-03-00022"
                        - text: "]. Resistance training increases resting metabolic rate (RMR) and sleeping metabolic rate (SMR). Resistance training also increases energy expenditure and decreases respiratory quotient (RQ) during rest and sleep 24 h after training. This decrease in RQ indicates greater reliance on fat as a fuel source ["
                        - link "50" [ref=e295] [cursor=pointer]:
                          - /url: "#B50-stresses-03-00022"
                        - text: "]. Wang et al. stated that the energy expenditure associated with one kilogram of muscle tissue is approximately 13 kcal/day, and one kilogram of fat is approximately 4.5 kcal/day ["
                        - link "51" [ref=e296] [cursor=pointer]:
                          - /url: "#B51-stresses-03-00022"
                        - text: "]. Therefore, energy expenditure seems to be an essential weight management strategy to protect against muscle tissue loss and, thus, better maintain RMR ["
                        - link "50" [ref=e297] [cursor=pointer]:
                          - /url: "#B50-stresses-03-00022"
                        - text: "]. Hormonal changes are also associated with reduced body fat ["
                        - link "52" [ref=e298] [cursor=pointer]:
                          - /url: "#B52-stresses-03-00022"
                        - text: "]. Due to the further increase in IGF-1 and the ratio of FLST to MSTN in the RP group, a further increase in muscle strength and hypertrophy can be justified. This training system can probably have more effects than the TRT system, but more research is needed to draw more accurate conclusions."
                      - generic [ref=e299]: The present study had various limitations, including the time it took for subjects to get accustomed to and trained with the RP system. Furthermore, nutrition during training as well as circadian sleep of the subjects were assessed with questionnaires but were not regulated. Participants in this experiment were recreational athletes, and their initial skill level was relatively low. Consequently, techniques demonstrated by participants at the start of trials had to be corrected through meticulous training and monitoring. An advantage of amateur athletes is that neural changes leading to improved performance can be achieved within a few weeks, resulting in more adaptation than those who are already trained.
                    - generic [ref=e300]:
                      - heading "4. Materials and Methods" [level=2] [ref=e301]
                      - generic [ref=e302]:
                        - text: "The study included thirty 20- to 30-year-old men who were not regularly active in the last year. They had to be in good physical and mental health. There were also no dietary supplements or medications that affected amino acid metabolism—especially beta blockers, beta agonists, calcium channel blockers, or corticosteroids. In addition to medical examinations for diseases or smoking habits, all participants were required to pass further tests. Following successful screening, subjects signed an informed consent form and were assigned to one of three groups (n = 10): RP, TRT and control ("
                        - link "Figure 2" [ref=e303] [cursor=pointer]:
                          - /url: "#fig_body_display_stresses-03-00022-f002"
                        - text: ). In accordance with the ethical guidelines of the Helsinki Declaration, the experiment was approved by IR.SSRC.REC.1400.060 of the Sports Science Research Institute.
                      - generic [ref=e304]:
                        - generic [ref=e306] [cursor=pointer]:
                          - img "Stresses 03 00022 g002" [ref=e307]
                          - link [ref=e308]:
                            - /url: "#fig_body_display_stresses-03-00022-f002"
                        - generic [ref=e309]: "Figure 2. Flow chart of the study. TRT: traditional resistance training, RP: rest–pause, 1RM: one repetition maximum, myostatin: MSTN, follistatin: FLST, insulin-like growth factor-1: IGF-1."
                      - generic [ref=e310]:
                        - heading "4.1. Research Design" [level=3] [ref=e311]
                        - generic [ref=e312]:
                          - text: At an initial meeting with all participants and trainers, the goals and procedure of the study were clarified, while forms regarding the purpose and process of research were distributed. In addition, a medical questionnaire was provided. Subsequently, directions on performing RP training were given, and registered data included age, height (Seca, Germany), weight (Seca, Germany), body mass index (BMI), and other functional indicators. Strength tests (1RM) for each subject were performed according to methods by Niewiadomski et al. [
                          - link "53" [ref=e313] [cursor=pointer]:
                            - /url: "#B53-stresses-03-00022"
                          - text: "] and Barbalho et al. ["
                          - link "54" [ref=e314] [cursor=pointer]:
                            - /url: "#B54-stresses-03-00022"
                          - text: "]. Muscle hypertrophy was calculated following Knapik et al.’s ["
                          - link "55" [ref=e315] [cursor=pointer]:
                            - /url: "#B55-stresses-03-00022"
                          - text: "] as well as Heymsfield et al.’s ["
                          - link "56" [ref=e316] [cursor=pointer]:
                            - /url: "#B56-stresses-03-00022"
                          - text: "] equations. Body composition was measured with the help of bioelectrical impedance analysis (InBody270, Korea). Plasma levels of MSTN, FLSF and IGF-1 were also checked before and after training through blood samples taken 48 h prior and post-training; however one of the control groups had to be excluded due to lack of cooperation in the second sampling stage. A control group had to be excluded because of poor cooperation during the second stage of blood sampling."
                      - generic [ref=e317]:
                        - heading "4.2. Procedure" [level=3] [ref=e318]
                        - generic [ref=e319]: "The subjects were randomly divided into three groups each advised to follow the recommended diet while participating in a 12-week training period. Before commencing the training sessions, warm-up exercises lasting 5 min usually occurred, followed by stretching of every muscle (6–10 s). Each group was trained on alternating even and odd days three days per week. The movements selected involved: machine leg extension, leg press, machine lying leg curl, cable pull-down, seated cable row, dumbbell curl, barbell curl (for the first session), bench press, incline bench press, barbell shoulder press, dumbbell military press, cable push-down and barbell lying triceps extension (for the second), with the program for third session mirroring that of the first. The training programs of the two groups were identical in volume."
                      - generic [ref=e320]:
                        - heading "4.3. TRT Program" [level=3] [ref=e321]
                        - generic [ref=e322]:
                          - text: In the TRT, for each movement, 3 sets × 10 repetitions and in total 30 repetitions with an intensity of 70% 1RM, for the first to third week; 3 sets × 8 repetitions, a total of 24 repetitions with an intensity of 75% 1RM, for the fourth to sixth week; 3 sets × 6 repetitions and a total of 18 repetitions with 80% 1RM for the seventh to ninth week; 3 sets × 4 repetitions with a total of 12 repetitions with 85% 1RM, for the tenth to twelfth week with 2 min rest between sets, and 3 min were considered between different exercises (
                          - link "Table 2" [ref=e323] [cursor=pointer]:
                            - /url: "#table_body_display_stresses-03-00022-t002"
                          - text: ).
                        - generic [ref=e324]:
                          - generic [ref=e325]: Table 2. Training program for 12 weeks.
                          - generic [ref=e327] [cursor=pointer]:
                            - img [ref=e328]
                            - link [ref=e329]:
                              - /url: "#table_body_display_stresses-03-00022-t002"
                      - generic [ref=e330]:
                        - heading "4.4. RP Resistance Training Program" [level=3] [ref=e331]
                        - generic [ref=e332]:
                          - text: "RP involves several mini-sets. In the RP method, a fixed volume-load is prescribed and subsequent failure mini-sets are performed as required with short intra-set rest intervals (e.g., 30 s) after an initial failure mini-set (typically 10–12 repetitions). In this study, the RP technique was performed: athletes began training with 70% 1RM and continued training until complete muscle failure occurred. After 30 s of rest, they next performed mini-sets with rest intervals of 30 s to reach the number of repetitions in the TRT with the same intensity of activity (30 repetitions). The exercise was performed the same way from the fourth to the sixth weeks, with the rest period reduced to 25 s and intensity increased to 75% 1RM, and the repetitions were continued until the number of repetitions in the TRT were reached at the same intensity. From the seventh to the ninth week, the exercise intensity was adjusted to 80% of 1RM, followed by a 20 s pause, and continued at that intensity until 18 repetitions in TRT were completed. After the tenth and twelfth weeks, the intensity was increased to 85% 1RM, which reduced the time between short sets to 15 s, and the exercise was continued until a 12-repetition TRT was reached with the same intensity ("
                          - link "Table 2" [ref=e333] [cursor=pointer]:
                            - /url: "#table_body_display_stresses-03-00022-t002"
                          - text: ).
                      - generic [ref=e334]:
                        - heading "4.5. Assessing the 1RM" [level=3] [ref=e335]
                        - generic [ref=e336]:
                          - text: Following the introduction and preparation of the subjects with different resistance exercises, the subjects were taken to a gym where they determined their 1RM for all selected stations using the Niewiadomski et al. method [
                          - link "53" [ref=e337] [cursor=pointer]:
                            - /url: "#B53-stresses-03-00022"
                          - text: "]. Thus, in order to prevent and minimize injury, subjects walked on the treadmill for five minutes in a low-intensity mode for general warm-up and then started performing eight repetitions with 50% 1RM (estimated approximately) for specific body warming. After one minute of rest, the subject performed three repetitions with an intensity of 70% of an estimated 1RM. After a 3 min rest, the subject repeated 3 to 5 attempts for 1RM. Barbalho et al. used a similar method to determine 1RM ["
                          - link "54" [ref=e338] [cursor=pointer]:
                            - /url: "#B54-stresses-03-00022"
                          - text: "]. They provided a 3 to 5 min rest between each attempt and added 5% to the load."
                      - generic [ref=e339]:
                        - heading "4.6. Assessment of Muscle Hypertrophy" [level=3] [ref=e340]
                        - generic [ref=e341]:
                          - text: Muscular hypertrophy of the lower body was estimated by assessing the muscular cross-sectional area (MCSA) of the thigh based on the Knapik et al. equation using the following formula [
                          - link "55" [ref=e342] [cursor=pointer]:
                            - /url: "#B55-stresses-03-00022"
                          - text: "]:"
                          - generic [ref=e344]:
                            - text: Thigh MCSA (cm
                            - superscript [ref=e345]: "2"
                            - text: ) = 0.649 × ((CT/π − SQ)
                            - superscript [ref=e346]: "2"
                            - text: − (0.3 × dE)
                            - superscript [ref=e347]: "2"
                            - text: )
                        - generic [ref=e349]: "CT: circumference thigh (cm), π: 3.14, SQ: skinfold quadriceps (cm), dE: distance epicondyles (cm)."
                        - generic [ref=e350]: Arm circumference by a tape measure (Iran) and a caliper (Harpenden, England) were used to measure the skinfold on the anterior midline of the thigh, and a caliper (Calsize, China) was used to measure the distance between the internal and external epicondyles of the femur.
                        - generic [ref=e351]:
                          - text: Muscular hypertrophy of the upper body was also calculated by assessing the MCSA of the arm, using the equation of Heymsfield et al. [
                          - link "56" [ref=e352] [cursor=pointer]:
                            - /url: "#B56-stresses-03-00022"
                          - text: "]:"
                          - generic [ref=e354]:
                            - text: Arm MCSA (cm
                            - superscript [ref=e355]: "2"
                            - text: ) = π ((CA/2 π) − (TA/2))
                            - superscript [ref=e356]: "2"
                            - text: − 5.5
                        - generic [ref=e358]: "CA: circumference arm (cm), π: 3.14, TA: triceps skinfold arm (cm)"
                        - generic [ref=e359]: The arm circumference was measured by a tape measure, and skinfold of the triceps by a caliper.
                      - generic [ref=e360]:
                        - heading "4.7. Nutrient Intake and Dietary Analysis" [level=3] [ref=e361]
                        - generic [ref=e362]:
                          - text: The subjects were instructed on how to modify their diet following the recommendations of the Academy of Nutrition and Dietetics, the Dietitians of Canada, and the American College of Sports Medicine. These recommendations distribute macronutrients (55–65% of total calories from carbohydrates, approximately 35% of total calories from fats and approximately 10–15% of total calories from protein) [
                          - link "50" [ref=e363] [cursor=pointer]:
                            - /url: "#B50-stresses-03-00022"
                          - text: "]. Except for these instances, subjects were instructed not to alter their diet during training. A questionnaire for a 3-day food recall (2 regular days and 1 off) was employed to assess caloric intake. Participants were instructed to document their diet for three days before the start of the program and for three days following the program’s final week of. Calories, carbohydrates, fats, and proteins consumed were calculated."
                        - generic [ref=e364]:
                          - text: Each food item in the diet was analyzed in the program (Master diet pro, Iran) that is used to analyze diet data, the number of calories consumed was calculated, and the amount of energy from proteins, fats, and carbohydrates was compared using paired samples t tests. The results of
                          - link "Table 3" [ref=e365] [cursor=pointer]:
                            - /url: "#table_body_display_stresses-03-00022-t003"
                          - text: confirmed that no dietary changes occurred prior to or following the training period. Additionally, the lack of control over the subjects’ nutrition during the study was one of the limitations of the present investigation.
                        - generic [ref=e366]:
                          - generic [ref=e367]: Table 3. Dietary daily intake assessed for the groups (mean ± SD).
                          - generic [ref=e369] [cursor=pointer]:
                            - img [ref=e370]
                            - link [ref=e371]:
                              - /url: "#table_body_display_stresses-03-00022-t003"
                      - generic [ref=e372]:
                        - heading "4.8. Assessment of Biochemical Indicators" [level=3] [ref=e373]
                        - generic [ref=e374]: Laboratory blood collection specialists took five milliliters of blood from the brachial vein from each subject on an empty stomach (between 8:00 and 9:00 in the morning). Blood samples were collected in test tubes with EDTA anticoagulant and centrifuged at 3500 rpm for 10 min, and serum samples were kept at −70 °C for subsequent measurements. Plasma levels of MSTN, FLST and IGF-1 were assessed by ELISA Kit to measure human myokines from the German company (ELISA, ZellBio GmbH, Ulm, Germany), for MSTN, FLST and IGF-1 by ELISA method according to the manufacturer’s protocol. The sensitivity was 0.02 ng/mL for IGF-1, 1 ng/mL for FLST, and 9 ng/L for MSTN.
                      - generic [ref=e375]:
                        - heading "4.9. Statistical Analysis" [level=3] [ref=e376]
                        - generic [ref=e377]:
                          - text: The distribution of each variable was evaluated via the Shapiro–Wilk test in order to verify that their distribution was normal. The paired samples t-test was employed to compare the pre- and post-test results in the two groups. The statistical significance of the results was evaluated using an analysis of covariance (ANCOVA that took baseline values as a covariate). This allowed for the identification of potential interactions between time × group. Multiple comparisons were performed using the LSD (post hoc analysis) procedure after the results were obtained. All differences between the groups were examined more thoroughly via effect sizes (ES) (Cohen’s d). The magnitude of the ES statistics was considered trivial <0.20; small 0.20–0.50; moderate 0.50–0.80; large 0.80–1.30; and very large >1.30 [
                          - link "57" [ref=e378] [cursor=pointer]:
                            - /url: "#B57-stresses-03-00022"
                          - text: "]. For each variable, a percentage change score was calculated ((post—pre)/pre × 100). Statistical significance was designated at p ≤ 0.05 for these analyses. All analyses were performed using SPSS version 21.0 (SPSS Inc., Chicago, IL, USA)."
                    - generic [ref=e379]:
                      - heading "5. Conclusions" [level=2] [ref=e380]
                      - generic [ref=e381]: The RP training technique has a greater effect on strength and muscle hypertrophy than TRT, which can be incorporated into a training system to increase strength and hypertrophy. It seems that this training system can be employed to create more effective training than TRT for individuals. However, additional research is needed on the effects of the RP system versus the TRT system regarding hormonal adaptations.
